<script>
      let selectedEmpId = null;
      let clockIntervalId = null;

      let employeeClockState = null;
      let clockStateRequestId = 0;
      const pendingClockRequests = new Set();
      const CLOCK_TIME_ZONE = <?!= JSON.stringify(TIME_ZONE) ?>;
      let clockPinContext = null;
      let clockPinRequestId = 0;
      let isClockPinSubmitting = false;
      let sharedNotePinGrant = null;

      let employeeListItems = [];

      let authToken = '';

      let employeeAuthToken = '';

      let currentScreen = 'employee';
      let currentManagerSection = '';

      let loginSessionId = 0;

      const UNRECORDED_LABEL = '未打刻';

      const POSITION_ITEMS = <?!= JSON.stringify(POSITION_ITEMS) ?>;

      const ROLE_MANAGER = <?!= JSON.stringify(ROLE_MANAGER) ?>;

      window.addEventListener('load', function () {
        initializeShiftTimeSelects();
        const navItems = document.querySelectorAll('.manager-nav-item');

        for (let j = 0; j < navItems.length; j++) {
          navItems[j].addEventListener('click', function () {
            showManagerSection(this);});
            }

        document.getElementById('manager_password_input').addEventListener(
          'keydown', function (event) { if (event.key === 'Enter') {
            submitManagerLogin();}});

        document.getElementById('clock_pin_input').addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); submitClockPin(); }
        });
        document.getElementById('clock_pin_overlay').addEventListener('keydown', function (event) {
          if (event.key === 'Escape') { event.preventDefault(); closeClockPinDialog(); }
        });

        document.addEventListener('click', handleDocumentClickForSharedNoteDropdown);

        window.setInterval(refreshOrderUpcomingDate, 60000);
        document.addEventListener('visibilitychange', refreshOrderUpcomingDate);
        initApp();
      });

      function initApp() {
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result || !result.success) {
              showEmployeeListMessage('従業員情報の取得に失敗しました');
              return;
            }
            employeeAuthToken = result.token;
            authToken = employeeAuthToken;
            loginSessionId++;

            resetEmployeeScreen();
            loadEmployeeList();
            showScreen('employee');
          })
          .withFailureHandler(function (error) {
            showEmployeeListMessage('従業員情報の取得に失敗しました: ' + error.message);
          })
          .createEmployeeSession();
      }

      function showScreen(screenName) {
        currentScreen = screenName;
        const isEmployee = (screenName === 'employee');
        document.getElementById('employee_screen').style.display = isEmployee ? 'block' : 'none';
        document.getElementById('manager_screen').style.display = isEmployee ? 'none' : 'block';

        document.getElementById('screen_switch_btn').textContent = isEmployee ? '店長画面へ' : '従業員画面へ';
      }

      function handleScreenSwitchButtonClick() {
        if (pendingClockRequests.size > 0 || isSharedNoteSubmitting) { return; }
        if (shiftSaving || attendancePendingSaves.size) { return; }
        if (currentScreen === 'employee') {
          closeClockPinDialog();
          closeSharedNoteModal();
          openManagerLoginModal();
        } else if (shiftDrafts.size > 0 || hasUnsavedSkillChanges() || skillSaving) {
          switchToEmployeeScreen();
        } else {
          openScreenSwitchModal();
        }
      }

      function openManagerLoginModal() {
        document.getElementById('manager_password_input').value = '';
        showManagerLoginError('');
        document.getElementById('manager_login_overlay').style.display = 'flex';
        document.getElementById('manager_password_input').focus();
      }

      function closeManagerLoginModal() {
        document.getElementById('manager_login_overlay').style.display = 'none';
        document.getElementById('manager_password_input').value = '';
      }

      function handleManagerLoginOverlayClick(event) {

        if (event.target === event.currentTarget) {
          closeManagerLoginModal();
        }
      }

      function submitManagerLogin() {
        const passwordInput = document.getElementById('manager_password_input');

        const password = passwordInput.value;
        const submitBtn = document.getElementById('manager_login_submit_btn');
        if (submitBtn.disabled) { return; }

        if (password === '') {
          showManagerLoginError('パスワードを入力してください');
          return;
        }

        showManagerLoginError('');
        passwordInput.value = '';
        submitBtn.disabled = true;

        google.script.run
          .withSuccessHandler(function (result) {
            submitBtn.disabled = false;
            if (!result.success) {
              showManagerLoginError(result.message);
              passwordInput.value = '';
              passwordInput.focus();
              return;
            }
            closeManagerLoginModal();
            startManagerSession(result.token);
          })
          .withFailureHandler(function (error) {
            submitBtn.disabled = false;
            showManagerLoginError('エラー: ' + error.message);
          })
          .login(password);
      }

      function showManagerLoginError(message) {
        document.getElementById('manager_login_error').textContent = message;
      }

      function startManagerSession(token) {
        authToken = token;
        loginSessionId++;

        closeAllModals();

        resetManagerScreen();
        showScreen('manager');
      }

      function openScreenSwitchModal() {
        document.getElementById('screen_switch_overlay').style.display = 'flex';
      }

      function closeScreenSwitchModal() {
        document.getElementById('screen_switch_overlay').style.display = 'none';
      }

      function handleScreenSwitchOverlayClick(event) {
        if (event.target === event.currentTarget) {
          closeScreenSwitchModal();
        }
      }

      function confirmScreenSwitch() {
        closeScreenSwitchModal();
        switchToEmployeeScreen();
      }

      function switchToEmployeeScreen() {
        if (attendancePendingSaves.size) { return; }
        if (!confirmLeaveSkillEditor(switchToEmployeeScreen)) { return; }
        if (!confirmLeaveShiftEditor(switchToEmployeeScreen)) { return; }
        const managerToken = authToken;
        authToken = employeeAuthToken;
        loginSessionId++;

        closeAllModals();

        resetEmployeeScreen();
        loadEmployeeList();
        resetManagerScreen();
        showScreen('employee');

        if (managerToken !== '' && managerToken !== employeeAuthToken) {
          google.script.run.logout(managerToken);
        }
      }

      function closeAllModals() {
        closeClockPinDialog();
        closeSharedNoteModal();
        document.getElementById('manager_password_input').value = '';
        const overlays = document.querySelectorAll('.modal-overlay');
        for (let i = 0; i < overlays.length; i++) {
          overlays[i].style.display = 'none';
        }
      }

      function resetEmployeeScreen() {
        isSharedNoteSubmitting = false;
        closeSharedNoteModal();
        pendingClockRequests.clear();
        clearEmployeeSelection();

        employeeListItems = [];
        document.getElementById('employee_list').innerHTML = '';
        showEmployeeListMessage('');
      }

      function resetManagerScreen() {
        document.getElementById('manager_screen').classList.remove('skill-section-active', 'order-section-active', 'attendance-section-active');
        document.getElementById('manager_screen').classList.remove('shift-section-active');
        document.getElementById('manager_screen').classList.remove('employee-section-active');
        currentManagerSection = '';
        resetManagerPasswordForm();
        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let i = 0; i < navItems.length; i++) {
          navItems[i].classList.remove('selected');
        }

        const sections = document.querySelectorAll('.manager-section');
        for (let j = 0; j < sections.length; j++) {
          sections[j].style.display = 'none';
        }

        resetEmployeeEditSection();
        resetSkillSection();
        resetShiftSections();
        resetAttendanceSection();

        orderBoard = null;
        orderCart = [];
        closeIngredientModal('order_item_overlay');
        document.getElementById('order_view_picker').style.display = 'flex';
        orderDrafts = [];
        orderSelectedVendorId = '';
        orderSending = false;
        orderSendKey = '';
        orderView = 'cart';
        document.getElementById('order_body').style.display = 'none';
      }

      function isSameLoginSession(sessionId) {
        return authToken !== '' && sessionId === loginSessionId;
      }

      function loadEmployeeList(onFailed) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (employees) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            applyEmployeeList(employees);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showEmployeeListMessage('エラー: ' + error.message);
            if (onFailed) {
              onFailed(error);
            }
          })
          .getActiveEmployeeList(authToken);
      }

      function applyEmployeeList(employees) {
        employeeListItems = employees || [];
        renderEmployeeList();
        if (document.getElementById('employee_delete_block').style.display !== 'none') {
          renderEmployeeDeleteList();
        }
        if (document.getElementById('employee_pin_block').style.display !== 'none') {
          renderEmployeePinTargets();
        }
      }

      function renderEmployeeList() {
        const list = document.getElementById('employee_list');
        list.innerHTML = '';

        const employees = employeeListItems;
        let isSelectedEmployeeShown = false;
        for (let i = 0; i < employees.length; i++) {
          const item = createEmployeeListItem(employees[i]);
          if (selectedEmpId !== null && String(employees[i].id) === selectedEmpId) {
            item.classList.add('selected');
            isSelectedEmployeeShown = true;
          }
          list.appendChild(item);
        }

        if (employeeListItems.length === 0) {
          showEmployeeListMessage('従業員が登録されていません');

        } else {
          showEmployeeListMessage('');
        }

        if (selectedEmpId !== null && !isSelectedEmployeeShown) {
          clearEmployeeSelection();
        }
      }

      function createEmployeeListItem(employee) {
        const item = document.createElement('li');
        item.className = 'employee-item';
        item.dataset.empId = String(employee.id);
        renderEmployeeNameBlock(item, employee);
        item.addEventListener('click', function () {
          selectEmployee(employee, item);
        });
        return item;
      }

      function renderEmployeeNameBlock(container, employee) {
        container.innerHTML = '';

        const nameEl = document.createElement('div');
        nameEl.className = 'employee-name-text';
        nameEl.textContent = employee.name;
        container.appendChild(nameEl);

        const numberEl = document.createElement('div');
        numberEl.className = 'employee-number-text';
        numberEl.textContent = '従業員番号 : ' + employee.number;
        container.appendChild(numberEl);
      }

      function showEmployeeListMessage(message) {
        document.getElementById('employee_list_message').textContent = message;
      }

      function selectEmployee(employee, item) {
        if (isSharedNoteSubmitting) { return; }
        closeClockPinDialog();
        closeSharedNoteModal();
        selectedEmpId = String(employee.id);
        employeeClockState = null;
        clockStateRequestId++;
        renderClockButtons();

        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove('selected');
        }
        item.classList.add('selected');

        renderEmployeeNameBlock(document.getElementById('selected_emp_name'), employee);
        document.getElementById('record_message').textContent = '';
        hideTodayWorkCard();
        hideSharedNoteCard();
        document.getElementById('right_panel').style.display = 'block';
        startClock();
        loadSharedNotesForSelection(selectedEmpId);
        loadEmployeeClockState(selectedEmpId);
      }

      function clearEmployeeSelection() {
        closeClockPinDialog();
        closeSharedNoteModal();
        selectedEmpId = null;
        employeeClockState = null;
        clockStateRequestId++;
        renderClockButtons();

        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove('selected');
        }

        if (clockIntervalId) {
          clearInterval(clockIntervalId);
          clockIntervalId = null;
        }

        document.getElementById('right_panel').style.display = 'none';
        document.getElementById('selected_emp_name').innerHTML = '';
        document.getElementById('record_message').textContent = '';
        hideTodayWorkCard();
        hideSharedNoteCard();
      }

      function hideTodayWorkCard() {
        document.getElementById('today_work_card').style.display = 'none';
        document.getElementById('today_work_card_body').innerHTML = '';
      }

      function startClock() {
        if (clockIntervalId) {
          clearInterval(clockIntervalId);
        }
        updateClock();
        clockIntervalId = setInterval(updateClock, 1000);
      }

      function updateClock() {
        const now = new Date();
        const pad = function (n) { return ('0' + n).slice(-2); };
        document.getElementById('current_time').innerHTML =
          pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        if (selectedEmpId && employeeClockState && employeeClockState.date !== getClockTodayKey()) {
          loadEmployeeClockState(selectedEmpId);
        }
      }

      function getClockTodayKey() {
        const parts = new Intl.DateTimeFormat('en', { timeZone: CLOCK_TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
        const values = {};
        parts.forEach(function (part) { values[part.type] = part.value; });
        return values.year + '/' + values.month + '/' + values.day;
      }

      function clockRequestKey(empId, sessionId) {
        return sessionId + ':' + empId;
      }

      function canRecordClock(type) {
        return !!(selectedEmpId && employeeClockState &&
          employeeClockState.employeeId === selectedEmpId &&
          employeeClockState.date === getClockTodayKey() &&
          employeeClockState.allowedTypes.indexOf(type) !== -1 &&
          !pendingClockRequests.has(clockRequestKey(selectedEmpId, loginSessionId)));
      }

      function renderClockButtons() {
        const buttons = document.querySelectorAll('[data-clock-type]');
        for (let i = 0; i < buttons.length; i++) {
          buttons[i].disabled = clockPinContext !== null || sharedNoteEmpId !== null || !canRecordClock(buttons[i].dataset.clockType);
        }
        setSharedNoteButtonsDisabled(clockPinContext !== null || isSharedNoteSubmitting || sharedNoteEmpId !== selectedEmpId || !canRecordClock('退勤'));
      }

      function applyEmployeeClockState(state) {
        employeeClockState = state && String(state.employeeId) === selectedEmpId ? state : null;
        renderClockButtons();
        if (!employeeClockState || employeeClockState.state === 'invalid') {
          showRecordError(new Error(state && state.error ? state.error : '本日の打刻状態を確認できません。従業員を選び直してください'));
        }
      }

      function loadEmployeeClockState(empId, preserveMessage) {
        if (!empId || empId !== selectedEmpId) { return; }
        const requestId = ++clockStateRequestId;
        const sessionId = loginSessionId;
        employeeClockState = null;
        renderClockButtons();
        if (!preserveMessage) { showRecordMessage('本日の打刻状態を確認中...'); }
        google.script.run
          .withSuccessHandler(function (state) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId || requestId !== clockStateRequestId) { return; }
            if (!preserveMessage) { showRecordMessage(''); }
            applyEmployeeClockState(state);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId || requestId !== clockStateRequestId) { return; }
            employeeClockState = null;
            renderClockButtons();
            showRecordError(new Error('打刻状態の取得に失敗しました。従業員を選び直してください: ' + error.message));
          })
          .getTodayClockState(empId, authToken);
      }

      function startClockSubmission(empId) {
        pendingClockRequests.add(clockRequestKey(empId, loginSessionId));
        clockStateRequestId++;
        renderClockButtons();
      }

      function finishClockSubmission(empId, sessionId, result, error) {
        pendingClockRequests.delete(clockRequestKey(empId, sessionId));
        if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) { return false; }
        clockStateRequestId++;
        if (error) {
          showRecordError(error);
          loadEmployeeClockState(empId, true);
        } else {
          showRecordMessage(result.message);
          applyEmployeeClockState(result.clockState);
        }
        return true;
      }
      function handleClockButtonClick(type) {
        if (!canRecordClock(type) || clockPinContext !== null || sharedNoteEmpId !== null) { return; }
        openClockPinDialog(type);
      }

      function isValidEmployeePin(pin) {
        return typeof pin === 'string' && pin.length === 6 && !/[^0-9]/.test(pin);
      }

      function openClockPinDialog(type, resumeWithNote) {
        if (clockPinContext !== null || currentScreen !== 'employee' || !canRecordClock(type)) { return; }
        clockPinContext = {
          empId: selectedEmpId, type: type, sessionId: loginSessionId,
          resumeWithNote: typeof resumeWithNote === 'boolean' ? resumeWithNote : null
        };
        clockPinRequestId++;
        isClockPinSubmitting = false;
        const employee = employeeListItems.find(function (item) { return String(item.id) === selectedEmpId; });
        if (!employee) { closeClockPinDialog(); return; }
        renderEmployeeNameBlock(document.getElementById('clock_pin_employee'), employee);
        document.getElementById('clock_pin_title').textContent = type + '：PINの確認';
        document.getElementById('clock_pin_input').value = '';
        document.getElementById('clock_pin_error').textContent = '';
        document.getElementById('clock_pin_submit_btn').disabled = false;
        document.getElementById('clock_pin_overlay').style.display = 'flex';
        document.getElementById('clock_pin_input').focus();
        renderClockButtons();
      }

      function closeClockPinDialog() {
        clockPinContext = null;
        clockPinRequestId++;
        isClockPinSubmitting = false;
        document.getElementById('clock_pin_overlay').style.display = 'none';
        document.getElementById('clock_pin_input').value = '';
        document.getElementById('clock_pin_error').textContent = '';
        document.getElementById('clock_pin_submit_btn').disabled = false;
        renderClockButtons();
      }

      function handleClockPinOverlayClick(event) {
        if (event.target === event.currentTarget) { closeClockPinDialog(); }
      }

      function submitClockPin() {
        if (!clockPinContext || isClockPinSubmitting) { return; }
        const context = clockPinContext;
        const input = document.getElementById('clock_pin_input');
        const pin = input.value;
        input.value = '';
        if (!isValidEmployeePin(pin)) {
          document.getElementById('clock_pin_error').textContent = 'PINは半角数字6桁で入力してください';
          input.focus();
          return;
        }
        const requestId = ++clockPinRequestId;
        isClockPinSubmitting = true;
        document.getElementById('clock_pin_submit_btn').disabled = true;
        document.getElementById('clock_pin_error').textContent = '';
        google.script.run
          .withSuccessHandler(function (grant) {
            if (requestId !== clockPinRequestId || clockPinContext !== context ||
                !isSameLoginSession(context.sessionId) || selectedEmpId !== context.empId) { return; }
            input.value = '';
            closeClockPinDialog();
            if (!canRecordClock(context.type)) {
              showRecordMessage('打刻状態が変わりました。状態を確認してからもう一度操作してください');
              loadEmployeeClockState(context.empId, true);
              return;
            }
            if (context.type === '退勤') {
              sharedNotePinGrant = grant;
              if (context.resumeWithNote === null) { openSharedNoteDialog(); }
              else { submitSharedNoteClockOut(context.resumeWithNote); }
            } else {
              submitAuthenticatedClock(context.empId, context.type, grant.ticket, context.sessionId);
            }
          })
          .withFailureHandler(function (error) {
            if (requestId !== clockPinRequestId || clockPinContext !== context || !isSameLoginSession(context.sessionId)) { return; }
            isClockPinSubmitting = false;
            input.value = '';
            document.getElementById('clock_pin_submit_btn').disabled = false;
            document.getElementById('clock_pin_error').textContent = error.message;
            input.focus();
            loadEmployeeClockState(context.empId, true);
          })
          .authenticateClockPin(context.empId, context.type, pin, authToken);
      }

      function submitAuthenticatedClock(empIdAtClick, type, ticket, sessionId) {
        startClockSubmission(empIdAtClick);
        showRecordMessage('登録中...');
        google.script.run
          .withSuccessHandler(function (result) {
            if (!finishClockSubmission(empIdAtClick, sessionId, result, null)) { return; }
            if (type === '出勤') {
              loadTodayWorkInfo(empIdAtClick);
              loadSharedNotesForClockIn(empIdAtClick);
            }
          })
          .withFailureHandler(function (error) {
            finishClockSubmission(empIdAtClick, sessionId, null, error);
          })
          .recordClock(empIdAtClick, type, ticket, authToken);
      }

      function showRecordMessage(message) {
        document.getElementById('record_message').textContent = message;
      }

      function showRecordError(error) {
        document.getElementById('record_message').textContent = 'エラー: ' + error.message;
      }

      function loadTodayWorkInfo(empId) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (info) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            renderTodayWorkCard(info);
          })
          .withFailureHandler(function () {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            showTodayWorkFetchError();
          })
          .getTodayWorkInfo(empId);
      }

      function renderTodayWorkCard(info) {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';

        const hasPosition = !!info.position;
        const hasNotices = info.notices && info.notices.length > 0;

        if (!hasPosition && !hasNotices) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'today-work-empty';
          emptyMsg.textContent = '本日の業務情報は登録されていません';
          body.appendChild(emptyMsg);
          card.style.display = 'block';
          return;
        }

        const positionLabel = document.createElement('div');
        positionLabel.className = 'today-work-label';
        positionLabel.textContent = '今日のポジション';
        body.appendChild(positionLabel);

        const positionValue = document.createElement('div');
        positionValue.className = 'today-work-position';
        positionValue.textContent = hasPosition ? info.position : '未設定';
        body.appendChild(positionValue);

        const noticesLabel = document.createElement('div');
        noticesLabel.className = 'today-work-label';
        noticesLabel.textContent = '確認事項';
        body.appendChild(noticesLabel);

        if (hasNotices) {
          const list = document.createElement('ul');
          list.className = 'today-work-notices-list';
          for (let i = 0; i < info.notices.length; i++) {
            const li = document.createElement('li');
            li.textContent = info.notices[i];
            list.appendChild(li);
          }
          body.appendChild(list);
        } else {
          const noNotice = document.createElement('div');
          noNotice.className = 'today-work-no-notice';
          noNotice.textContent = '本日の確認事項はありません';
          body.appendChild(noNotice);
        }

        card.style.display = 'block';
      }

      function showTodayWorkFetchError() {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';
        const warning = document.createElement('div');
        warning.className = 'today-work-warning';
        warning.textContent = '⚠ 本日の業務情報を取得できませんでした';
        body.appendChild(warning);
        card.style.display = 'block';
      }

      function loadSharedNotesForSelection(empId) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (notes) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            renderSharedNoteCard(notes);
          })
          .withFailureHandler(function () {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            hideSharedNoteCard();
          })
          .getSharedNotesForSelection(empId);
      }

      function loadSharedNotesForClockIn(empId) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (notes) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            renderSharedNoteCard(notes);
          })
          .withFailureHandler(function () {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            hideSharedNoteCard();
          })
          .getSharedNotesForClockIn(empId);
      }

      function renderSharedNoteCard(notes) {
        const card = document.getElementById('shared_note_card');
        const body = document.getElementById('shared_note_card_body');
        body.innerHTML = '';

        if (!notes || notes.length === 0) {
          card.style.display = 'none';
          return;
        }

        for (let i = 0; i < notes.length; i++) {
          const item = document.createElement('div');
          item.className = 'shared-note-item';

          const meta = document.createElement('div');
          meta.className = 'shared-note-meta';
          meta.textContent = notes[i].createdAtLabel + '　' + notes[i].senderName + 'さんから';
          item.appendChild(meta);

          const bodyEl = document.createElement('div');
          bodyEl.className = 'shared-note-body';
          bodyEl.textContent = notes[i].body;
          item.appendChild(bodyEl);

          body.appendChild(item);
        }

        card.style.display = 'block';
      }

      function hideSharedNoteCard() {
        document.getElementById('shared_note_card').style.display = 'none';
        document.getElementById('shared_note_card_body').innerHTML = '';
      }

      let sharedNoteEmpId = null;

      const SHARED_NOTE_SELECT_PLACEHOLDER = '共有したいスタッフを選択してください（複数選択可）';

      let isSharedNoteSubmitting = false;

      function openSharedNoteDialog() {
        if (!canRecordClock('退勤') || isSharedNoteSubmitting || sharedNoteEmpId !== null) {
          return;
        }
        sharedNoteEmpId = selectedEmpId;
        renderClockButtons();

        document.getElementById('shared_note_text').value = '';

      function submitSharedNoteClockOut(withNote) {
        if (clockPinContext !== null || isSharedNoteSubmitting || sharedNoteEmpId !== selectedEmpId || !canRecordClock('退勤')) { return; }
        const empId = sharedNoteEmpId;
        const sessionId = loginSessionId;
        const recipients = withNote ? getSharedNoteCheckedRecipients() : [];
        const noteText = document.getElementById('shared_note_text').value.trim();
        if (withNote && (recipients.length === 0 || noteText === '')) {
          showSharedNoteConfirmError('共有先を1人以上選び、共有メモを入力してください');
          return;
        }
        if (!sharedNotePinGrant || sharedNotePinGrant.expiresAt <= Date.now()) {
          sharedNotePinGrant = null;
          openClockPinDialog('退勤', withNote);
          return;
        }
        const ticket = sharedNotePinGrant.ticket;
        sharedNotePinGrant = null;
        isSharedNoteSubmitting = true;
        startClockSubmission(empId);
        showSharedNoteInputError('');
        showSharedNoteConfirmError('');
        const runner = google.script.run
          .withSuccessHandler(function (result) {
            pendingClockRequests.delete(clockRequestKey(empId, sessionId));
            if (!isSameLoginSession(sessionId)) { return; }
            if (sharedNoteEmpId === empId) {
              isSharedNoteSubmitting = false;
              closeSharedNoteModal();
            }
            finishClockSubmission(empId, sessionId, result, null);
          })
          .withFailureHandler(function (error) {
            pendingClockRequests.delete(clockRequestKey(empId, sessionId));
            if (!isSameLoginSession(sessionId)) { return; }
            if (sharedNoteEmpId === empId) {
              isSharedNoteSubmitting = false;
              const message = '退勤処理に失敗しました: ' + error.message;
              if (withNote) { showSharedNoteConfirmError(message); }
              else { showSharedNoteInputError(message); }
            }
            finishClockSubmission(empId, sessionId, null, error);
          });
        if (withNote) {
          runner.saveSharedNoteAndClockOut(empId, recipients.map(function (item) { return item.id; }), noteText, authToken, ticket);
        } else {
          runner.recordClock(empId, '退勤', ticket, authToken);
        }
      }

      let attendanceRows = new Map();

      const attendancePendingSaves = new Set();

        if (attendancePendingSaves.size) { return; }

        showAttendanceMessage('読み込み中...', false);
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId) || requestId !== attendanceRequestId) { return; }

      function renderAttendances(result) {
        document.getElementById('attendance_date').textContent = result.date;
        attendanceRows = new Map(result.attendances.map(function (attendance) { return [String(attendance.id), attendance]; }));
        attendanceDrafts.clear();
        const tbody = document.getElementById('attendance_tbody');
        tbody.innerHTML = '';

      function createAttendanceRow(attendance) {
        const id = String(attendance.id);
        const draft = attendanceDrafts.get(id);
        const saving = attendancePendingSaves.has(id);
        const row = document.createElement('tr');
        row.dataset.employeeId = id;
        row.classList.toggle('attendance-editing', !!draft);
        row.appendChild(createAttendanceCell(attendance.name));
        ['clockIn', 'clockOut', 'breakTime'].forEach(function (field) {
          if (!draft) { row.appendChild(createAttendanceCell(attendance[field])); return; }
          const cell = document.createElement('td');
          const input = document.createElement('input');
          const isBreak = field === 'breakTime';
          const key = isBreak ? 'breakMinutes' : field;
          input.type = isBreak ? 'number' : 'time';
          input.className = isBreak ? 'attendance-break-input' : 'attendance-time-input';
          input.step = isBreak ? '1' : '60';
          if (isBreak) { input.min = '0'; input.max = '1439'; }
          input.required = isBreak || field === 'clockIn';
          input.value = draft[key];
          input.disabled = saving;
          input.setAttribute('aria-label', attendance.name + 'の' + (isBreak ? '休憩時間（分）' : field === 'clockIn' ? '出勤時刻' : '退勤時刻'));
          input.addEventListener('input', function () {
            draft[key] = input.value;
            draft.error = '';
            showAttendanceRowStatus(id, '', false);
          });
          cell.appendChild(input);
          if (isBreak) {
            const unit = document.createElement('span');
            unit.textContent = ' 分';
            cell.appendChild(unit);
            if (attendance.breakOngoing) {
              const note = document.createElement('small');
              note.className = 'attendance-break-note';
              note.textContent = '休憩中：終了済みの休憩分を入力。退勤を入力すると休憩も終了します。';
              cell.appendChild(note);
            }
          }
          row.appendChild(cell);
        });
        row.appendChild(createAttendanceCell(attendance.workingTime));
        row.appendChild(createAttendanceCell(attendance.estimatedWage));
        const actions = document.createElement('td');
        actions.className = 'attendance-actions';
        const buttons = document.createElement('div');
        buttons.className = 'attendance-row-buttons';
        function addButton(label, action, primary) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = primary ? 'modal-submit-btn' : 'modal-cancel-btn';
          button.textContent = label;
          button.disabled = saving;
          button.addEventListener('click', action);
          buttons.appendChild(button);
        }
        if (draft) {
          addButton(saving ? '保存中...' : '保存', function () { saveAttendanceRow(id); }, true);
          addButton('キャンセル', function () { cancelAttendanceEdit(id); }, false);
        } else {
          addButton('編集', function () { startAttendanceEdit(id); }, false);
        }
        actions.appendChild(buttons);
        const status = document.createElement('div');
        status.className = 'attendance-row-status';
        status.setAttribute('role', 'status');
        if (draft && draft.error) { status.textContent = draft.error; status.classList.add('error'); }
        actions.appendChild(status);
        row.appendChild(actions);
        return row;
      }

      function findAttendanceRow(id) {
        return Array.from(document.getElementById('attendance_tbody').rows).find(function (row) {
          return row.dataset.employeeId === String(id);
        });
      }

      function renderAttendanceRow(id) {
        const row = findAttendanceRow(id);
        const attendance = attendanceRows.get(String(id));
        if (row && attendance) { row.replaceWith(createAttendanceRow(attendance)); }
      }

      function startAttendanceEdit(id) {
        id = String(id);
        const attendance = attendanceRows.get(id);
        if (!attendance || attendanceDrafts.has(id) || attendancePendingSaves.has(id)) { return; }
        attendanceDrafts.set(id, {
          clockIn: attendance.clockInInput, clockOut: attendance.clockOutInput,
          breakMinutes: String(attendance.breakMinutes), error: ''
        });
        renderAttendanceRow(id);
        findAttendanceRow(id).querySelector('input').focus();
      }

      function cancelAttendanceEdit(id) {
        id = String(id);
        if (attendancePendingSaves.has(id)) { return; }
        attendanceDrafts.delete(id);
        renderAttendanceRow(id);
      }

      function showAttendanceRowStatus(id, message, isError) {
        const row = findAttendanceRow(id);
        if (!row) { return; }
        const status = row.querySelector('.attendance-row-status');
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function validateAttendanceDraft(draft) {
        const timePattern = /^([01]\d|2[0-3]):[0-5]\d$/;
        if (!timePattern.test(draft.clockIn)) { return '出勤時刻を入力してください'; }
        if (draft.clockOut && !timePattern.test(draft.clockOut)) { return '退勤時刻を正しく入力してください'; }
        if (draft.clockOut && draft.clockOut < draft.clockIn) { return '退勤時刻は出勤時刻以降にしてください'; }
        if (!/^\d+$/.test(draft.breakMinutes) || Number(draft.breakMinutes) > 1439) {
          return '休憩時間は0〜1439の整数（分）で入力してください';
        }
        const minutes = function (time) { return Number(time.slice(0, 2)) * 60 + Number(time.slice(3)); };
        const maxBreak = minutes(draft.clockOut || '23:59') - minutes(draft.clockIn);
        if (Number(draft.breakMinutes) > maxBreak) { return '休憩時間が勤務時間を超えています'; }
        return '';
      }

      function saveAttendanceRow(id) {
        id = String(id);
        const draft = attendanceDrafts.get(id);
        const attendance = attendanceRows.get(id);
        if (!draft || !attendance || attendancePendingSaves.has(id)) { return; }
        draft.error = validateAttendanceDraft(draft);
        if (draft.error) { showAttendanceRowStatus(id, draft.error, true); return; }
        attendancePendingSaves.add(id);
        renderAttendanceRow(id);
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) { return; }
            attendancePendingSaves.delete(id);
            attendanceDrafts.delete(id);
            attendanceRows.set(id, result.attendance);
            renderAttendanceRow(id);
            showAttendanceRowStatus(id, '保存しました', false);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) { return; }
            attendancePendingSaves.delete(id);
            draft.error = 'エラー: ' + error.message;
            renderAttendanceRow(id);
          })
          .saveAttendance({
            id: id, dateKey: attendance.dateKey, revision: attendance.revision,
            clockIn: draft.clockIn, clockOut: draft.clockOut, breakMinutes: Number(draft.breakMinutes)
          }, authToken);
      }

      function createAttendanceCell(text) {
        const cell = document.createElement('td');
        cell.textContent = text;
        if (text === UNRECORDED_LABEL) {
          cell.classList.add('unrecorded');

        return cell;
      }

      function showAttendanceError(error) {
        document.getElementById('attendance_date').textContent = '';
        showAttendanceMessage('エラー: ' + error.message, true);
      }

      function showAttendanceMessage(message, isError) {
        showAppMessage('attendance_message', message, isError);
      }

      const SKILL_ITEMS = <?!= JSON.stringify(SKILL_ITEMS) ?>;
      const SKILL_LEVELS = <?!= JSON.stringify(SKILL_LEVELS) ?>;
      const SKILL_LEVEL_LABELS = <?!= JSON.stringify(SKILL_LEVEL_LABELS) ?>;

      let skillMatrix = [];
      let skillSelectedEmpId = null;
      let skillEditing = false;
      let skillSaving = false;
      const skillDrafts = new Map();
      let skillLeaveAction = null;
      let skillDiscardFocus = null;
      let skillRequestId = 0;

      function loadSkills() {
        if (skillEditing || skillSaving) { return; }
        const requestId = ++skillRequestId;
        document.getElementById('skill_layout').style.display = 'none';
        showSkillMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (matrix) {
            if (!isSameLoginSession(sessionId) || requestId !== skillRequestId) {
              return;
            }
            renderSkills(matrix);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || requestId !== skillRequestId) {
              return;
            }
            showSkillError(error);
          })
          .getSkillMatrix(authToken);
      }

      function renderSkills(matrix) {
        if (skillEditing || skillSaving) { return; }
        closeSkillDiscardDialog();
        skillMatrix = matrix;

        if (skillMatrix.length === 0) {
          skillSelectedEmpId = null;
          showSkillMessage('従業員名簿に従業員が登録されていません', false);
          return;
        }

        if (skillSelectedEmpId !== null && findSkillEmployee(skillSelectedEmpId) === null) {
          skillSelectedEmpId = null;
        }

        renderSkillEmployeeList();
        renderSkillDetail();
        showSkillMessage('', false);
        document.getElementById('skill_layout').style.display = 'grid';

      function renderSkillEmployeeList() {
        const list = document.getElementById('skill_employee_list');
        list.innerHTML = '';

        for (let i = 0; i < skillMatrix.length; i++) {
          list.appendChild(createSkillEmployeeListItem(skillMatrix[i]));
        }
      }

      function createSkillEmployeeListItem(employeeSkill) {
        const item = document.createElement('li');
        item.className = 'skill-employee-item';
        item.dataset.empId = String(employeeSkill.id);
        renderEmployeeNameBlock(item, employeeSkill);
        if (skillSelectedEmpId !== null && String(employeeSkill.id) === skillSelectedEmpId) {
          item.classList.add('selected');
        }
        item.addEventListener('click', function () {
          selectSkillEmployee(String(employeeSkill.id));
        });
        return item;
      }

      function selectSkillEmployee(empId) {
        if (skillSelectedEmpId === empId || !findSkillEmployee(empId)) { return; }
        skillSelectedEmpId = empId;
        document.querySelectorAll('.skill-employee-item').forEach(function (item) {
          item.classList.toggle('selected', item.dataset.empId === empId);
        });
        renderSkillDetail();
      }

      function startSkillEdit() {
        if (skillSelectedEmpId === null || skillEditing || skillSaving) { return; }
        skillEditing = true;
        showSkillSaveStatus('', false);
        updateSkillEditControls();
      }

      function cancelSkillEdit() {
        if (skillSaving) { return; }
        skillDrafts.clear();
        skillEditing = false;
        renderSkillDetail();
      }

      function updateSkillEditControls() {
        document.getElementById('skill_edit_btn').hidden = skillEditing;
        document.getElementById('skill_edit_btn').disabled = skillSaving;
        document.getElementById('skill_back_btn').hidden = !skillEditing;
        document.getElementById('skill_back_btn').disabled = skillSaving;
        document.getElementById('skill_save_btn').hidden = !skillEditing;
        document.getElementById('skill_save_btn').disabled = skillSaving;
        document.querySelectorAll('#skill_detail_items .skill-rank-slider').forEach(function (slider) {
          slider.disabled = !skillEditing || skillSaving;
        });
        document.querySelectorAll('#skill_discard_overlay button').forEach(function (button) { button.disabled = skillSaving; });
      }

      function hasUnsavedSkillChanges() {
        return skillDrafts.size > 0;
      }

      function updateSkillDraft(empId, item, rank) {
        if (!skillEditing || skillSaving) { return; }
        const employee = findSkillEmployee(empId);
        if (!employee) { return; }
        const key = String(empId);
        const values = (skillDrafts.get(key) || SKILL_ITEMS.map(function (skill) { return employee.skills[skill]; })).slice();
        values[SKILL_ITEMS.indexOf(item)] = rank;
        if (values.every(function (value, i) { return value === employee.skills[SKILL_ITEMS[i]]; })) {
          skillDrafts.delete(key);
        } else {
          skillDrafts.set(key, values);
        }
        showSkillSaveStatus(hasUnsavedSkillChanges() ? skillDrafts.size + '人分の未保存の変更があります' : '', false);
      }

      function confirmLeaveSkillEditor(onLeave) {
        if (skillSaving) { return false; }
        if (!hasUnsavedSkillChanges()) {
          skillEditing = false;
          return true;
        }
        skillLeaveAction = onLeave;
        skillDiscardFocus = document.activeElement;
        document.getElementById('skill_discard_status').textContent = '';
        document.getElementById('skill_discard_overlay').style.display = 'flex';
        document.getElementById('skill_discard_cancel_btn').focus();
        return false;
      }

      function closeSkillDiscardDialog() {
        if (skillSaving) { return; }
        document.getElementById('skill_discard_overlay').style.display = 'none';
        skillLeaveAction = null;
        if (skillDiscardFocus && skillDiscardFocus.isConnected) { skillDiscardFocus.focus(); }
        skillDiscardFocus = null;
      }

      function confirmSkillDiscard() {
        if (skillSaving || !skillLeaveAction) { return; }
        const action = skillLeaveAction;
        cancelSkillEdit();
        closeSkillDiscardDialog();
        action();
      }

      function saveSkillsAndLeave() {
        if (skillSaving || !skillLeaveAction) { return; }
        const action = skillLeaveAction;
        saveSelectedEmployeeSkills(function () {
          closeSkillDiscardDialog();
          action();
        });
      }

      function handleSkillDiscardKeydown(event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeSkillDiscardDialog();
        } else if (event.key === 'Tab') {
          const first = document.getElementById('skill_discard_cancel_btn');
          const last = document.getElementById('skill_discard_save_btn');
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      }

      function findSkillEmployee(empId) {
        for (let i = 0; i < skillMatrix.length; i++) {
          if (String(skillMatrix[i].id) === String(empId)) {
            return skillMatrix[i];
          }
        }
        return null;
      }

      function renderSkillDetail() {
        const detail = document.getElementById('skill_detail');
        const emptyMessage = document.getElementById('skill_detail_empty');
        const employeeSkill = (skillSelectedEmpId === null) ? null : findSkillEmployee(skillSelectedEmpId);

        if (employeeSkill === null) {
          detail.style.display = 'none';
          emptyMessage.style.display = 'block';
          return;
        }

        renderEmployeeNameBlock(document.getElementById('skill_detail_name'), employeeSkill);

        const itemsEl = document.getElementById('skill_detail_items');
        itemsEl.innerHTML = '';
        const pendingValues = skillDrafts.get(String(employeeSkill.id));
        const displayEmployee = pendingValues ? Object.assign({}, employeeSkill, { skills: {} }) : employeeSkill;
        if (pendingValues) {
          SKILL_ITEMS.forEach(function (item, i) { displayEmployee.skills[item] = pendingValues[i]; });
        }
        for (let i = 0; i < SKILL_ITEMS.length; i++) {
          itemsEl.appendChild(createSkillDetailItem(SKILL_ITEMS[i], displayEmployee));
        }

        updateSkillEditControls();
        showSkillSaveStatus(skillSaving ? '保存中...' : hasUnsavedSkillChanges() ? skillDrafts.size + '人分の未保存の変更があります' : '', false);
        emptyMessage.style.display = 'none';
        detail.style.display = 'block';
      }

      function createSkillDetailItem(item, employeeSkill) {
        const row = document.createElement('div');
        row.className = 'skill-detail-item';

        const nameEl = document.createElement('div');
        nameEl.className = 'skill-detail-item-name';
        nameEl.textContent = item;
        row.appendChild(nameEl);

        const control = document.createElement('div');
        control.className = 'skill-rank-control';
        const labels = document.createElement('div');
        labels.className = 'skill-rank-labels';
        labels.setAttribute('aria-hidden', 'true');
        SKILL_LEVELS.forEach(function (rank) {
          const label = document.createElement('span');
          label.textContent = rank;
          labels.appendChild(label);
        });
        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '0';
        slider.max = String(SKILL_LEVELS.length - 1);
        slider.step = '1';
        slider.className = 'skill-rank-slider';
        slider.dataset.skillItem = item;

      function handleShiftDiscardKeydown(event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeShiftDiscardDialog();
        } else if (event.key === 'Tab') {
          const first = document.getElementById('shift_discard_cancel_btn');

      function parseShiftDate(dateKey) {
        return new Date(dateKey + 'T00:00:00Z');
      }

      function addShiftDays(dateKey, offset) {
        const date = parseShiftDate(dateKey);
        date.setUTCDate(date.getUTCDate() + offset);
        return buildShiftDateKey(date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate());
      }

      function buildShiftMonthPrefix(year, month) {
        return year + '-' + ('0' + month).slice(-2) + '-';
      }

      function buildShiftDateKey(year, month, day) {
        return buildShiftMonthPrefix(year, month) + ('0' + day).slice(-2);
      }

      function formatShiftDate(dateKey) {
        const parts = dateKey.split('-');
        return Number(parts[0]) + '/' + Number(parts[1]) + '/' + Number(parts[2]);
      }

      function isShiftClosedDate(dateKey) {
        return parseShiftDate(dateKey).getUTCDay() === 1;
      }

      function shiftCellKey(employeeId, dateKey) {
        return JSON.stringify([String(employeeId), dateKey]);
      }

      function loadShiftMonth(year, month) {
        document.getElementById('shift_confirm_content').hidden = true;
        document.getElementById('shift_retry_btn').hidden = true;
        document.getElementById('shift_retry_btn').onclick = function () { loadShiftMonth(year, month); };
        document.getElementById('section_shift_confirm').setAttribute('aria-busy', 'true');
        setShiftMonthButtonsDisabled(true);
        showShiftMessage('読み込み中...', false);
        const sessionId = loginSessionId;
