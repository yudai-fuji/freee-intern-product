<script>
      let selectedEmpId = null;
      let clockIntervalId = null;

      // 選択中の従業員の打刻状態。通信中・未取得時は操作できない。
      let employeeClockState = null;
      let clockStateRequestId = 0;
      const pendingClockRequests = new Set();
      const CLOCK_TIME_ZONE = <?!= JSON.stringify(TIME_ZONE) ?>;
      let clockPinContext = null;
      let clockPinRequestId = 0;
      let isClockPinSubmitting = false;
      let sharedNotePinGrant = null;

      // 従業員画面の一覧に出す、有効な従業員の一覧（{ id, name, number } の配列）
      // 従業員画面と従業員編集で同じ有効な従業員一覧を使う
      let employeeListItems = [];

      // 現在サーバーとの通信に使っているログイントークン（従業員用・店長用のどちらか一方）
      let authToken = '';

      // 起動時にGASが自動発行した従業員用トークン。店長画面から従業員画面へ戻るときにこれへ戻す
      let employeeAuthToken = '';

      // 表示中の画面。'employee' か 'manager'
      let currentScreen = 'employee';
      let currentManagerSection = '';

      // トークンを切り替えるたびに増やす通し番号。切り替え前に届いた通信結果を画面へ反映しないために使う
      let loginSessionId = 0;

      // 打刻がまだ無いことを表す表示文字列（code.js の UNRECORDED_LABEL と揃える）
      const UNRECORDED_LABEL = '未打刻';

      // ポジション候補（code.js の POSITION_ITEMS をそのまま埋め込み、二重管理しない）
      const POSITION_ITEMS = <?!= JSON.stringify(POSITION_ITEMS) ?>;

      // 役割名（config.js の定数をそのまま埋め込み、二重管理しない）
      const ROLE_MANAGER = <?!= JSON.stringify(ROLE_MANAGER) ?>;

      window.addEventListener('load', function () {
        initializeShiftTimeSelects();
        const navItems = document.querySelectorAll('.manager-nav-item');

        for (let j = 0; j < navItems.length; j++) {
          navItems[j].addEventListener('click', function () {
            showManagerSection(this);});
            }

        document.getElementById('manager_password_input').addEventListener(
          'keydown', function (event) { if (event.key === 'Enter') {
            submitManagerLogin();}});

        document.getElementById('clock_pin_input').addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); submitClockPin(); }
        });
        document.getElementById('clock_pin_overlay').addEventListener('keydown', function (event) {
          if (event.key === 'Escape') { event.preventDefault(); closeClockPinDialog(); }
        });

        document.addEventListener('click', handleDocumentClickForSharedNoteDropdown);

        window.setInterval(refreshOrderUpcomingDate, 60000);
        document.addEventListener('visibilitychange', refreshOrderUpcomingDate);
        initApp();
      });

      /**
       * アプリ起動時の処理。GASに従業員用トークンを自動発行してもらい、従業員画面を開く
       * パスワード入力は求めない
       * @return {void} 戻り値なし
       */
      function initApp() {
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result || !result.success) {
              showEmployeeListMessage('従業員情報の取得に失敗しました');
              return;
            }
            employeeAuthToken = result.token;
            authToken = employeeAuthToken;
            loginSessionId++;

            resetEmployeeScreen();
            loadEmployeeList();
            showScreen('employee');
          })
          .withFailureHandler(function (error) {
            showEmployeeListMessage('従業員情報の取得に失敗しました: ' + error.message);
          })
          .createEmployeeSession();
      }

      /**
       * 従業員画面・店長画面を切り替える
       * ページ遷移はせず表示/非表示を操作するだけなので、選択中の従業員などの状態は保持される
       * @param {string} screenName 'employee' / 'manager'
       * @return {void} 戻り値なし
       */
      function showScreen(screenName) {
        currentScreen = screenName;
        const isEmployee = (screenName === 'employee');
        document.getElementById('employee_screen').style.display = isEmployee ? 'block' : 'none';
        document.getElementById('manager_screen').style.display = isEmployee ? 'none' : 'block';

        // 画面切り替えボタンは、いま出ていない方の画面名を表示する
        document.getElementById('screen_switch_btn').textContent = isEmployee ? '店長画面へ' : '従業員画面へ';
      }

      /**
       * ヘッダーの画面切り替えボタンが押されたときの処理
       * 従業員画面からは店長認証モーダルを、店長画面からは切り替え確認モーダルを開く
       * @return {void} 戻り値なし
       */
      function handleScreenSwitchButtonClick() {
        if (pendingClockRequests.size > 0 || isSharedNoteSubmitting) { return; }
        if (shiftSaving || attendancePendingSaves.size) { return; }
        if (currentScreen === 'employee') {
          closeClockPinDialog();
          closeSharedNoteModal();
          openManagerLoginModal();
        } else if (shiftDrafts.size > 0 || hasUnsavedSkillChanges() || skillSaving) {
          switchToEmployeeScreen();
        } else {
          openScreenSwitchModal();
        }
      }

      /**
       * 店長認証モーダルを開く
       * @return {void} 戻り値なし
       */
      function openManagerLoginModal() {
        document.getElementById('manager_password_input').value = '';
        showManagerLoginError('');
        document.getElementById('manager_login_overlay').style.display = 'flex';
        document.getElementById('manager_password_input').focus();
      }

      /**
       * 店長認証モーダルを閉じる
       * @return {void} 戻り値なし
       */
      function closeManagerLoginModal() {
        document.getElementById('manager_login_overlay').style.display = 'none';
        document.getElementById('manager_password_input').value = '';
      }

      /**
       * 店長認証モーダルの背景クリックを受け取る
       * @param {Event} event クリックイベント
       * @return {void} 戻り値なし
       */
      function handleManagerLoginOverlayClick(event) {
        // 暗い背景そのものをクリックしたときだけ閉じる（モーダル本体のクリックは無視）
        if (event.target === event.currentTarget) {
          closeManagerLoginModal();
        }
      }

      /**
       * 入力された店長用パスワードをGASへ照合しにいく
       * 判定はGAS側（login()）で行い、成功したときだけ店長用トークンを受け取る
       * @return {void} 戻り値なし
       */
      function submitManagerLogin() {
        const passwordInput = document.getElementById('manager_password_input');
        // 先頭の 0 を保持するため、数値に変換せず文字列のまま渡す
        const password = passwordInput.value;
        const submitBtn = document.getElementById('manager_login_submit_btn');
        if (submitBtn.disabled) { return; }

        if (password === '') {
          showManagerLoginError('パスワードを入力してください');
          return;
        }

        showManagerLoginError('');
        passwordInput.value = '';
        submitBtn.disabled = true;

        google.script.run
          .withSuccessHandler(function (result) {
            submitBtn.disabled = false;
            if (!result.success) {
              showManagerLoginError(result.message);
              passwordInput.value = '';
              passwordInput.focus();
              return;
            }
            closeManagerLoginModal();
            startManagerSession(result.token);
          })
          .withFailureHandler(function (error) {
            submitBtn.disabled = false;
            showManagerLoginError('エラー: ' + error.message);
          })
          .login(password);
      }

      /**
       * 店長認証モーダルのエラー文言を出し分ける
       * @param {string} message 表示する文言（空文字で消す）
       * @return {void} 戻り値なし
       */
      function showManagerLoginError(message) {
        document.getElementById('manager_login_error').textContent = message;
      }

      /**
       * 店長認証成功後に、店長用トークンへ切り替えて店長画面を開く
       * @param {string} token GASが発行した店長用ログイントークン
       * @return {void} 戻り値なし
       */
      function startManagerSession(token) {
        authToken = token;
        loginSessionId++; // これ以降に遅れて届いた従業員画面側の通信結果は画面へ反映しない

        closeAllModals();
        // 店長はどのメニューも選んでいない状態から始める（右側の内容表示領域は空欄）
        resetManagerScreen();
        showScreen('manager');
      }

      /**
       * 従業員画面への切り替え確認モーダルを開く
       * @return {void} 戻り値なし
       */
      function openScreenSwitchModal() {
        document.getElementById('screen_switch_overlay').style.display = 'flex';
      }

      /**
       * 従業員画面への切り替え確認モーダルを閉じる（キャンセルのときは店長画面に留まる）
       * @return {void} 戻り値なし
       */
      function closeScreenSwitchModal() {
        document.getElementById('screen_switch_overlay').style.display = 'none';
      }

      /**
       * 従業員画面への切り替え確認モーダルの背景クリックを受け取る
       * @param {Event} event クリックイベント
       * @return {void} 戻り値なし
       */
      function handleScreenSwitchOverlayClick(event) {
        if (event.target === event.currentTarget) {
          closeScreenSwitchModal();
        }
      }

      /**
       * 確認モーダルで切り替えが確定されたときの処理
       * @return {void} 戻り値なし
       */
      function confirmScreenSwitch() {
        closeScreenSwitchModal();
        switchToEmployeeScreen();
      }

      /**
       * 店長画面から従業員画面へ切り替える（パスワードは不要）
       * 起動時に発行済みの従業員用トークンへ戻し、使い終えた店長用トークンはサーバー側で無効化する
       * @return {void} 戻り値なし
       */
      function switchToEmployeeScreen() {
        if (attendancePendingSaves.size) { return; }
        if (!confirmLeaveSkillEditor(switchToEmployeeScreen)) { return; }
        if (!confirmLeaveShiftEditor(switchToEmployeeScreen)) { return; }
        const managerToken = authToken;
        authToken = employeeAuthToken;
        loginSessionId++; // これ以降に遅れて届いた店長画面側の通信結果は画面へ反映しない

        closeAllModals();
        // 店長画面での従業員の追加・削除が反映された一覧を取り直す
        resetEmployeeScreen();
        loadEmployeeList();
        resetManagerScreen();
        showScreen('employee');

        // 店長用トークンは使い終わったら無効化する（結果は画面に影響しないので待たない）
        if (managerToken !== '' && managerToken !== employeeAuthToken) {
          google.script.run.logout(managerToken);
        }
      }

      /**
       * 開いているダイアログをすべて閉じる
       * @return {void} 戻り値なし
       */
      function closeAllModals() {
        closeClockPinDialog();
        closeSharedNoteModal();
        document.getElementById('manager_password_input').value = '';
        const overlays = document.querySelectorAll('.modal-overlay');
        for (let i = 0; i < overlays.length; i++) {
          overlays[i].style.display = 'none';
        }
      }

      /**
       * 従業員画面の一時的な表示（一覧・選択中の従業員・打刻メッセージ・本日の業務）を消す
       * 打刻済みのデータには触れない
       * @return {void} 戻り値なし
       */
      function resetEmployeeScreen() {
        isSharedNoteSubmitting = false;
        closeSharedNoteModal();
        pendingClockRequests.clear();
        clearEmployeeSelection();

        employeeListItems = [];
        document.getElementById('employee_list').innerHTML = '';
        showEmployeeListMessage('');
      }

      /**
       * 店長画面を、どのメニューも選んでいない状態（右側の内容表示領域が空欄）に戻す
       * 読み込み済みの内容も残さない
       * @return {void} 戻り値なし
       */
      function resetManagerScreen() {
        document.getElementById('manager_screen').classList.remove('skill-section-active', 'order-section-active', 'attendance-section-active');
        document.getElementById('manager_screen').classList.remove('shift-section-active');
        document.getElementById('manager_screen').classList.remove('employee-section-active');
        currentManagerSection = '';
        resetManagerPasswordForm();
        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let i = 0; i < navItems.length; i++) {
          navItems[i].classList.remove('selected');
        }

        const sections = document.querySelectorAll('.manager-section');
        for (let j = 0; j < sections.length; j++) {
          sections[j].style.display = 'none';
        }

        resetEmployeeEditSection();
        resetSkillSection();
        resetShiftSections();
        resetAttendanceSection();

        orderBoard = null;
        orderCart = [];
        closeIngredientModal('order_item_overlay');
        document.getElementById('order_view_picker').style.display = 'flex';
        orderDrafts = [];
        orderSelectedVendorId = '';
        orderSending = false;
        orderSendKey = '';
        orderView = 'cart';
        document.getElementById('order_body').style.display = 'none';
      }

      /**
       * 通信を始めたときのトークンがいまも使われているかを調べる
       * 画面を切り替えたあとに遅れて届いた結果で、以前の画面を出し直さないために使う
       * @param {number} sessionId 通信を始めた時点の loginSessionId
       * @return {boolean} 同じトークンがまだ使われていれば true
       */
      function isSameLoginSession(sessionId) {
        return authToken !== '' && sessionId === loginSessionId;
      }

      /**
       * 有効な従業員の一覧をGASから取り直し、画面の一覧を描き直す
       * ログインのたびに呼ぶので、ログインし直せば追加・削除が反映された一覧が表示される
       * @param {Function} onFailed 取得に失敗したときに実行したい処理（省略できる）
       * @return {void} 戻り値なし
       */
      function loadEmployeeList(onFailed) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (employees) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            applyEmployeeList(employees);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showEmployeeListMessage('エラー: ' + error.message);
            if (onFailed) {
              onFailed(error);
            }
          })
          .getActiveEmployeeList(authToken);
      }

      /**
       * 受け取った従業員一覧を画面へ反映する
       * 従業員画面の一覧と、店長画面の削除対象一覧の両方を同じ内容に揃える
       * @param {Array} employees [{ id, name, number }, ...]
       * @return {void} 戻り値なし
       */
      function applyEmployeeList(employees) {
        employeeListItems = employees || [];
        renderEmployeeList();
        if (document.getElementById('employee_delete_block').style.display !== 'none') {
          renderEmployeeDeleteList();
        }
        if (document.getElementById('employee_pin_block').style.display !== 'none') {
          renderEmployeePinTargets();
        }
      }

      /**
       * 有効な従業員を全員、一覧に描く
       * 先頭の人を自動選択はしない。描いたあとに選択中の従業員が一覧から消えていたら、
       * 選択と打刻欄も解除して、見えていない従業員への誤打刻を防ぐ
       * @return {void} 戻り値なし
       */
      function renderEmployeeList() {
        const list = document.getElementById('employee_list');
        list.innerHTML = '';

        const employees = employeeListItems;
        let isSelectedEmployeeShown = false;
        for (let i = 0; i < employees.length; i++) {
          const item = createEmployeeListItem(employees[i]);
          if (selectedEmpId !== null && String(employees[i].id) === selectedEmpId) {
            item.classList.add('selected');
            isSelectedEmployeeShown = true;
          }
          list.appendChild(item);
        }

        if (employeeListItems.length === 0) {
          showEmployeeListMessage('従業員が登録されていません');

        } else {
          showEmployeeListMessage('');
        }

        if (selectedEmpId !== null && !isSelectedEmployeeShown) {
          clearEmployeeSelection();
        }
      }

      /**
       * 一覧に並べる従業員1人分の項目を作る
       * @param {Object} employee { id, name, number }
       * @return {Element} 一覧の項目
       */
      function createEmployeeListItem(employee) {
        const item = document.createElement('li');
        item.className = 'employee-item';
        item.dataset.empId = String(employee.id);
        renderEmployeeNameBlock(item, employee);
        item.addEventListener('click', function () {
          selectEmployee(employee, item);
        });
        return item;
      }

      /**
       * 氏名（フルネーム）と、その下の「従業員番号 : 3」を指定の場所に描く
       * @param {Element} container 描き込む場所
       * @param {Object} employee { id, name, number }
       * @return {void} 戻り値なし
       */
      function renderEmployeeNameBlock(container, employee) {
        container.innerHTML = '';

        const nameEl = document.createElement('div');
        nameEl.className = 'employee-name-text';
        nameEl.textContent = employee.name;
        container.appendChild(nameEl);

        const numberEl = document.createElement('div');
        numberEl.className = 'employee-number-text';
        numberEl.textContent = '従業員番号 : ' + employee.number;
        container.appendChild(numberEl);
      }

      /**
       * 一覧の上に出す一行メッセージ（未登録・エラーなど）を切り替える
       * @param {string} message 表示する文言（空文字で消す）
       * @return {void} 戻り値なし
       */
      function showEmployeeListMessage(message) {
        document.getElementById('employee_list_message').textContent = message;
      }

      /**
       * 打刻する従業員を選び、打刻欄を表示する
       * @param {Object} employee 選ばれた従業員 { id, name, number }
       * @param {Element} item 一覧の項目
       * @return {void} 戻り値なし
       */
      function selectEmployee(employee, item) {
        if (isSharedNoteSubmitting) { return; }
        closeClockPinDialog();
        closeSharedNoteModal();
        selectedEmpId = String(employee.id);
        employeeClockState = null;
        clockStateRequestId++;
        renderClockButtons();

        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove('selected');
        }
        item.classList.add('selected');

        // 打刻対象者にも氏名と従業員番号を出し、誰の打刻かを確認できるようにする
        renderEmployeeNameBlock(document.getElementById('selected_emp_name'), employee);
        document.getElementById('record_message').textContent = '';
        hideTodayWorkCard(); // 前の従業員の本日の業務情報を新しい従業員の画面に残さない
        hideSharedNoteCard(); // 前の従業員の共有メモを新しい従業員の画面に残さない
        document.getElementById('right_panel').style.display = 'block';
        startClock();
        loadSharedNotesForSelection(selectedEmpId); // その日すでに表示済みの共有メモがあれば出す
        loadEmployeeClockState(selectedEmpId);
      }

      /**
       * 従業員の選択を解除し、打刻欄を隠す
       * 選択中の従業員が削除されて一覧から外れたときにも呼ぶ
       * @return {void} 戻り値なし
       */
      function clearEmployeeSelection() {
        closeClockPinDialog();
        closeSharedNoteModal();
        selectedEmpId = null;
        employeeClockState = null;
        clockStateRequestId++;
        renderClockButtons();

        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove('selected');
        }

        if (clockIntervalId) {
          clearInterval(clockIntervalId);
          clockIntervalId = null;
        }

        document.getElementById('right_panel').style.display = 'none';
        document.getElementById('selected_emp_name').innerHTML = '';
        document.getElementById('record_message').textContent = '';
        hideTodayWorkCard();
        hideSharedNoteCard();
      }

      /**
       * 「本日の業務」カードを非表示にし、表示していたポジション・確認事項をクリアする
       * 従業員を切り替えた直後に必ず呼び出す
       */
      function hideTodayWorkCard() {
        document.getElementById('today_work_card').style.display = 'none';
        document.getElementById('today_work_card_body').innerHTML = '';
      }

      function startClock() {
        if (clockIntervalId) {
          clearInterval(clockIntervalId);
        }
        updateClock();
        clockIntervalId = setInterval(updateClock, 1000);
      }

      function updateClock() {
        const now = new Date();
        const pad = function (n) { return ('0' + n).slice(-2); };
        document.getElementById('current_time').innerHTML =
          pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        if (selectedEmpId && employeeClockState && employeeClockState.date !== getClockTodayKey()) {
          loadEmployeeClockState(selectedEmpId);
        }
      }

      function getClockTodayKey() {
        const parts = new Intl.DateTimeFormat('en', { timeZone: CLOCK_TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
        const values = {};
        parts.forEach(function (part) { values[part.type] = part.value; });
        return values.year + '/' + values.month + '/' + values.day;
      }

      function clockRequestKey(empId, sessionId) {
        return sessionId + ':' + empId;
      }

      function canRecordClock(type) {
        return !!(selectedEmpId && employeeClockState &&
          employeeClockState.employeeId === selectedEmpId &&
          employeeClockState.date === getClockTodayKey() &&
          employeeClockState.allowedTypes.indexOf(type) !== -1 &&
          !pendingClockRequests.has(clockRequestKey(selectedEmpId, loginSessionId)));
      }

      function renderClockButtons() {
        const buttons = document.querySelectorAll('[data-clock-type]');
        for (let i = 0; i < buttons.length; i++) {
          buttons[i].disabled = clockPinContext !== null || sharedNoteEmpId !== null || !canRecordClock(buttons[i].dataset.clockType);
        }
        setSharedNoteButtonsDisabled(clockPinContext !== null || isSharedNoteSubmitting || sharedNoteEmpId !== selectedEmpId || !canRecordClock('退勤'));
      }

      function applyEmployeeClockState(state) {
        employeeClockState = state && String(state.employeeId) === selectedEmpId ? state : null;
        renderClockButtons();
        if (!employeeClockState || employeeClockState.state === 'invalid') {
          showRecordError(new Error(state && state.error ? state.error : '本日の打刻状態を確認できません。従業員を選び直してください'));
        }
      }

      function loadEmployeeClockState(empId, preserveMessage) {
        if (!empId || empId !== selectedEmpId) { return; }
        const requestId = ++clockStateRequestId;
        const sessionId = loginSessionId;
        employeeClockState = null;
        renderClockButtons();
        if (!preserveMessage) { showRecordMessage('本日の打刻状態を確認中...'); }
        google.script.run
          .withSuccessHandler(function (state) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId || requestId !== clockStateRequestId) { return; }
            if (!preserveMessage) { showRecordMessage(''); }
            applyEmployeeClockState(state);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId || requestId !== clockStateRequestId) { return; }
            employeeClockState = null;
            renderClockButtons();
            showRecordError(new Error('打刻状態の取得に失敗しました。従業員を選び直してください: ' + error.message));
          })
          .getTodayClockState(empId, authToken);
      }

      function startClockSubmission(empId) {
        pendingClockRequests.add(clockRequestKey(empId, loginSessionId));
        clockStateRequestId++; // 保存前の状態取得結果を保存後に反映しない。
        renderClockButtons();
      }

      function finishClockSubmission(empId, sessionId, result, error) {
        pendingClockRequests.delete(clockRequestKey(empId, sessionId));
        if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) { return false; }
        clockStateRequestId++;
        if (error) {
          showRecordError(error);
          loadEmployeeClockState(empId, true);
        } else {
          showRecordMessage(result.message);
          applyEmployeeClockState(result.clockState);
        }
        return true;
      }
      function handleClockButtonClick(type) {
        if (!canRecordClock(type) || clockPinContext !== null || sharedNoteEmpId !== null) { return; }
        openClockPinDialog(type);
      }

      function isValidEmployeePin(pin) {
        return typeof pin === 'string' && pin.length === 6 && !/[^0-9]/.test(pin);
      }

      // resumeWithNoteを渡したときは、下書きを残したまま退勤だけを再認証する。
      function openClockPinDialog(type, resumeWithNote) {
        if (clockPinContext !== null || currentScreen !== 'employee' || !canRecordClock(type)) { return; }
        clockPinContext = {
          empId: selectedEmpId, type: type, sessionId: loginSessionId,
          resumeWithNote: typeof resumeWithNote === 'boolean' ? resumeWithNote : null
        };
        clockPinRequestId++;
        isClockPinSubmitting = false;
        const employee = employeeListItems.find(function (item) { return String(item.id) === selectedEmpId; });
        if (!employee) { closeClockPinDialog(); return; }
        renderEmployeeNameBlock(document.getElementById('clock_pin_employee'), employee);
        document.getElementById('clock_pin_title').textContent = type + '：PINの確認';
        document.getElementById('clock_pin_input').value = '';
        document.getElementById('clock_pin_error').textContent = '';
        document.getElementById('clock_pin_submit_btn').disabled = false;
        document.getElementById('clock_pin_overlay').style.display = 'flex';
        document.getElementById('clock_pin_input').focus();
        renderClockButtons();
      }

      function closeClockPinDialog() {
        clockPinContext = null;
        clockPinRequestId++;
        isClockPinSubmitting = false;
        document.getElementById('clock_pin_overlay').style.display = 'none';
        document.getElementById('clock_pin_input').value = '';
        document.getElementById('clock_pin_error').textContent = '';
        document.getElementById('clock_pin_submit_btn').disabled = false;
        renderClockButtons();
      }

      function handleClockPinOverlayClick(event) {
        if (event.target === event.currentTarget) { closeClockPinDialog(); }
      }

      function submitClockPin() {
        if (!clockPinContext || isClockPinSubmitting) { return; }
        const context = clockPinContext;
        const input = document.getElementById('clock_pin_input');
        const pin = input.value;
        input.value = '';
        if (!isValidEmployeePin(pin)) {
          document.getElementById('clock_pin_error').textContent = 'PINは半角数字6桁で入力してください';
          input.focus();
          return;
        }
        const requestId = ++clockPinRequestId;
        isClockPinSubmitting = true;
        document.getElementById('clock_pin_submit_btn').disabled = true;
        document.getElementById('clock_pin_error').textContent = '';
        google.script.run
          .withSuccessHandler(function (grant) {
            if (requestId !== clockPinRequestId || clockPinContext !== context ||
                !isSameLoginSession(context.sessionId) || selectedEmpId !== context.empId) { return; }
            input.value = '';
            closeClockPinDialog();
            if (!canRecordClock(context.type)) {
              showRecordMessage('打刻状態が変わりました。状態を確認してからもう一度操作してください');
              loadEmployeeClockState(context.empId, true);
              return;
            }
            if (context.type === '退勤') {
              sharedNotePinGrant = grant;
              if (context.resumeWithNote === null) { openSharedNoteDialog(); }
              else { submitSharedNoteClockOut(context.resumeWithNote); }
            } else {
              submitAuthenticatedClock(context.empId, context.type, grant.ticket, context.sessionId);
            }
          })
          .withFailureHandler(function (error) {
            if (requestId !== clockPinRequestId || clockPinContext !== context || !isSameLoginSession(context.sessionId)) { return; }
            isClockPinSubmitting = false;
            input.value = '';
            document.getElementById('clock_pin_submit_btn').disabled = false;
            document.getElementById('clock_pin_error').textContent = error.message;
            input.focus();
            loadEmployeeClockState(context.empId, true);
          })
          .authenticateClockPin(context.empId, context.type, pin, authToken);
      }

      function submitAuthenticatedClock(empIdAtClick, type, ticket, sessionId) {
        startClockSubmission(empIdAtClick);
        showRecordMessage('登録中...');
        google.script.run
          .withSuccessHandler(function (result) {
            if (!finishClockSubmission(empIdAtClick, sessionId, result, null)) { return; }
            if (type === '出勤') {
              loadTodayWorkInfo(empIdAtClick);
              loadSharedNotesForClockIn(empIdAtClick);
            }
          })
          .withFailureHandler(function (error) {
            finishClockSubmission(empIdAtClick, sessionId, null, error);
          })
          .recordClock(empIdAtClick, type, ticket, authToken);
      }

      function showRecordMessage(message) {
        document.getElementById('record_message').textContent = message;
      }

      function showRecordError(error) {
        document.getElementById('record_message').textContent = 'エラー: ' + error.message;
      }

      /**
       * 出勤成功後、本日の業務情報（ポジション・確認事項）を取得する
       * 打刻結果を反映したあとに、業務情報を別処理として取得する
       * 取得中に従業員が切り替えられていた場合は、結果が戻ってきても表示しない（安全のためのガード）
       */
      function loadTodayWorkInfo(empId) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (info) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            renderTodayWorkCard(info);
          })
          .withFailureHandler(function () {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            showTodayWorkFetchError();
          })
          .getTodayWorkInfo(empId);
      }

      /**
       * 本日の業務カードへポジション・確認事項を描画する
       * ポジション・確認事項それぞれの有無に応じて表示内容を出し分ける
       */
      function renderTodayWorkCard(info) {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';

        const hasPosition = !!info.position;
        const hasNotices = info.notices && info.notices.length > 0;

        if (!hasPosition && !hasNotices) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'today-work-empty';
          emptyMsg.textContent = '本日の業務情報は登録されていません';
          body.appendChild(emptyMsg);
          card.style.display = 'block';
          return;
        }

        const positionLabel = document.createElement('div');
        positionLabel.className = 'today-work-label';
        positionLabel.textContent = '今日のポジション';
        body.appendChild(positionLabel);

        const positionValue = document.createElement('div');
        positionValue.className = 'today-work-position';
        positionValue.textContent = hasPosition ? info.position : '未設定';
        body.appendChild(positionValue);

        const noticesLabel = document.createElement('div');
        noticesLabel.className = 'today-work-label';
        noticesLabel.textContent = '確認事項';
        body.appendChild(noticesLabel);

        if (hasNotices) {
          const list = document.createElement('ul');
          list.className = 'today-work-notices-list';
          for (let i = 0; i < info.notices.length; i++) {
            const li = document.createElement('li');
            li.textContent = info.notices[i];
            list.appendChild(li);
          }
          body.appendChild(list);
        } else {
          const noNotice = document.createElement('div');
          noNotice.className = 'today-work-no-notice';
          noNotice.textContent = '本日の確認事項はありません';
          body.appendChild(noNotice);
        }

        card.style.display = 'block';
      }

      /**
       * 本日の業務情報の取得に失敗したことをカード内に表示する
       * 打刻自体は成功しているため、record_message（出勤の成功メッセージ）は書き換えない
       */
      function showTodayWorkFetchError() {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';
        const warning = document.createElement('div');
        warning.className = 'today-work-warning';
        warning.textContent = '⚠ 本日の業務情報を取得できませんでした';
        body.appendChild(warning);
        card.style.display = 'block';
      }

      // 共有メモ：本日の業務の隣に出すカード
      // 共有メモが1件も無いときは、不自然に空のカードを出さずそのまま非表示にする

      /**
       * 従業員一覧から名前を選んだときに呼ぶ。その日すでに表示済みの共有メモがあれば取得する
       * （出勤ボタンを押した瞬間しか見られない、という実装にはしない）
       * @param {string} empId 選択された従業員番号
       * @return {void} 戻り値なし
       */
      function loadSharedNotesForSelection(empId) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (notes) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            renderSharedNoteCard(notes);
          })
          .withFailureHandler(function () {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            hideSharedNoteCard();
          })
          .getSharedNotesForSelection(empId);
      }

      /**
       * 出勤に成功した直後に呼ぶ。まだ表示していない共有メモを、今日はじめて表示したことにして取得する
       * @param {string} empId 出勤した従業員番号
       * @return {void} 戻り値なし
       */
      function loadSharedNotesForClockIn(empId) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (notes) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            renderSharedNoteCard(notes);
          })
          .withFailureHandler(function () {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            hideSharedNoteCard();
          })
          .getSharedNotesForClockIn(empId);
      }

      /**
       * 共有メモカードへ、送信日時・送信者名・本文を縦に並べて描画する
       * @param {Array} notes [{ senderName, body, createdAtLabel }, ...]
       * @return {void} 戻り値なし
       */
      function renderSharedNoteCard(notes) {
        const card = document.getElementById('shared_note_card');
        const body = document.getElementById('shared_note_card_body');
        body.innerHTML = '';

        if (!notes || notes.length === 0) {
          card.style.display = 'none';
          return;
        }

        for (let i = 0; i < notes.length; i++) {
          const item = document.createElement('div');
          item.className = 'shared-note-item';

          const meta = document.createElement('div');
          meta.className = 'shared-note-meta';
          meta.textContent = notes[i].createdAtLabel + '　' + notes[i].senderName + 'さんから';
          item.appendChild(meta);

          const bodyEl = document.createElement('div');
          bodyEl.className = 'shared-note-body';
          bodyEl.textContent = notes[i].body;
          item.appendChild(bodyEl);

          body.appendChild(item);
        }

        card.style.display = 'block';
      }

      function hideSharedNoteCard() {
        document.getElementById('shared_note_card').style.display = 'none';
        document.getElementById('shared_note_card_body').innerHTML = '';
      }

      // 共有メモ：退勤ボタンを押したときのダイアログ
      // ダイアログを開いている間は退勤時刻をまだ記録しない。「入力せず退勤」か
      // 確認画面の「退勤」を押した時点の時刻で、はじめて退勤を記録する

      // ダイアログの対象となっている従業員番号（開いていない間は null）
      let sharedNoteEmpId = null;

      // 共有先を誰も選んでいないときに、プルダウンの枠内へ出す案内文
      const SHARED_NOTE_SELECT_PLACEHOLDER = '共有したいスタッフを選択してください（複数選択可）';

      // 確認画面の「退勤」・「入力せず退勤」の二重送信を防ぐフラグ
      let isSharedNoteSubmitting = false;

      /**
       * 退勤ボタンが押されたときに、共有メモダイアログを入力画面から開く
       * @return {void} 戻り値なし
       */
      function openSharedNoteDialog() {
        if (!canRecordClock('退勤') || isSharedNoteSubmitting || sharedNoteEmpId !== null) {
          return;
        }
        sharedNoteEmpId = selectedEmpId;
        renderClockButtons();

        document.getElementById('shared_note_text').value = '';
        document.getElementById('shared_note_recipient_list').innerHTML = '';
        closeSharedNoteRecipientDropdown();
        updateSharedNoteSelectLabel();
        showSharedNoteInputError('');
        showSharedNoteConfirmError('');
        showSharedNoteInputView();
        document.getElementById('shared_note_overlay').style.display = 'flex';

        const empId = sharedNoteEmpId;
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (candidates) {
            if (!isSameLoginSession(sessionId) || sharedNoteEmpId !== empId) {
              return;
            }
            renderSharedNoteRecipientList(candidates || []);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || sharedNoteEmpId !== empId) {
              return;
            }
            showSharedNoteInputError('共有先の取得に失敗しました: ' + error.message);
          })
          .getSharedNoteRecipientCandidates(empId, authToken);
      }

      /**
       * 共有先のチェックボックス一覧（プルダウンの中身）を作る
       * 店長は名簿に含まれないため対象に出てこない。本人はサーバー側で除外済み
       * 従業員番号は出さず、氏名だけを並べる
       * @param {Array} candidates [{ id, name, number }, ...]
       * @return {void} 戻り値なし
       */
      function renderSharedNoteRecipientList(candidates) {
        const list = document.getElementById('shared_note_recipient_list');
        list.innerHTML = '';

        if (candidates.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'shared-note-recipient-empty';
          empty.textContent = '共有できる他の従業員がいません';
          list.appendChild(empty);
          return;
        }

        for (let i = 0; i < candidates.length; i++) {
          const label = document.createElement('label');
          label.className = 'modal-check shared-note-recipient-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = String(candidates[i].id);
          checkbox.dataset.name = candidates[i].name;
          checkbox.addEventListener('change', updateSharedNoteSelectLabel);
          label.appendChild(checkbox);

          const text = document.createElement('span');
          text.textContent = candidates[i].name;
          label.appendChild(text);

          list.appendChild(label);
        }
      }

      /**
       * チェックされている共有先を取り出す
       * @return {Array} [{ id, name }, ...]
       */
      function getSharedNoteCheckedRecipients() {
        const boxes = document.querySelectorAll('#shared_note_recipient_list input[type=checkbox]:checked');
        const result = [];
        for (let i = 0; i < boxes.length; i++) {
          result.push({ 'id': boxes[i].value, 'name': boxes[i].dataset.name });
        }
        return result;
      }

      /**
       * 共有先プルダウンを開閉する（閉じた枠自体を押したときに呼ぶ）
       * 共有メモダイアログの開閉とは別処理で、ここでダイアログが閉じることはない
       * @return {void} 戻り値なし
       */
      function toggleSharedNoteRecipientDropdown() {
        document.getElementById('shared_note_select').classList.toggle('open');
      }

      function closeSharedNoteRecipientDropdown() {
        document.getElementById('shared_note_select').classList.remove('open');
      }

      /**
       * プルダウンの外側がクリックされたときに、一覧だけを閉じる（共有メモダイアログは閉じない）
       * @param {Event} event クリックイベント
       * @return {void} 戻り値なし
       */
      function handleDocumentClickForSharedNoteDropdown(event) {
        const selectBox = document.getElementById('shared_note_select');
        if (!selectBox.classList.contains('open') || selectBox.contains(event.target)) {
          return;
        }
        closeSharedNoteRecipientDropdown();
      }

      /**
       * 閉じた状態の枠内の表示を、選ばれている人数に合わせて更新する
       * 1人以上選ばれていれば氏名を並べず「○名選択中」と出す
       * @return {void} 戻り値なし
       */
      function updateSharedNoteSelectLabel() {
        const label = document.getElementById('shared_note_select_label');
        const count = getSharedNoteCheckedRecipients().length;
        if (count === 0) {
          label.textContent = SHARED_NOTE_SELECT_PLACEHOLDER;
          label.classList.add('shared-note-select-placeholder');
          return;
        }
        label.textContent = count + '名選択中';
        label.classList.remove('shared-note-select-placeholder');
      }

      function showSharedNoteInputView() {
        document.getElementById('shared_note_input_view').style.display = 'block';
        document.getElementById('shared_note_confirm_view').style.display = 'none';
      }

      function showSharedNoteConfirmView() {
        document.getElementById('shared_note_input_view').style.display = 'none';
        document.getElementById('shared_note_confirm_view').style.display = 'block';
      }

      function showSharedNoteInputError(message) {
        document.getElementById('shared_note_input_error').textContent = message;
      }

      function showSharedNoteConfirmError(message) {
        document.getElementById('shared_note_confirm_error').textContent = message;
      }

      /**
       * 「確認画面へ」が押されたときの入力チェックと、確認画面への切り替え
       * 共有先が1人以上・本文ありの両方がそろわないと進めない
       * 「戻る」で入力画面に戻っても選択内容・本文はDOMに残ったままなので消えない
       * @return {void} 戻り値なし
       */
      function goToSharedNoteConfirm() {
        const checked = getSharedNoteCheckedRecipients();
        const noteText = document.getElementById('shared_note_text').value.trim();
        if (checked.length === 0 || noteText === '') {
          showSharedNoteInputError('共有先を1人以上選び、共有メモを入力してください');
          return;
        }
        showSharedNoteInputError('');

        const recipientsBox = document.getElementById('shared_note_confirm_recipients');
        recipientsBox.innerHTML = '';
        for (let i = 0; i < checked.length; i++) {
          const line = document.createElement('div');
          line.className = 'shared-note-confirm-recipient';
          line.textContent = checked[i].name;
          recipientsBox.appendChild(line);
        }
        document.getElementById('shared_note_confirm_body').textContent = noteText;

        showSharedNoteConfirmError('');
        showSharedNoteConfirmView();
      }

      /**
       * 確認画面の「戻る」。入力画面へ戻すだけで、選択内容・本文には触れない
       * @return {void} 戻り値なし
       */
      function backToSharedNoteInput() {
        showSharedNoteInputView();
      }

      /**
       * ダイアログを閉じる（「×」・「入力せず退勤」・退勤処理の完了時だけ呼ぶ）
       * 誤って入力内容を失わないよう、背景クリックでは閉じない
       * @return {void} 戻り値なし
       */
      function closeSharedNoteModal() {
        if (isSharedNoteSubmitting) { return; }
        sharedNotePinGrant = null;
        document.getElementById('shared_note_overlay').style.display = 'none';
        document.getElementById('shared_note_text').value = '';
        document.getElementById('shared_note_recipient_list').innerHTML = '';
        closeSharedNoteRecipientDropdown();
        updateSharedNoteSelectLabel();
        showSharedNoteInputError('');
        showSharedNoteConfirmError('');
        sharedNoteEmpId = null;
        renderClockButtons();
      }

      /** メモを保存せず、ボタンを押した時点で退勤する。 */
      function submitClockOutWithoutSharedNote() {
        submitSharedNoteClockOut(false);
      }

      /** メモの保存後に退勤する。サーバー側でも打刻順序を検証する。 */
      function submitClockOutWithSharedNote() {
        submitSharedNoteClockOut(true);
      }

      function submitSharedNoteClockOut(withNote) {
        if (clockPinContext !== null || isSharedNoteSubmitting || sharedNoteEmpId !== selectedEmpId || !canRecordClock('退勤')) { return; }
        const empId = sharedNoteEmpId;
        const sessionId = loginSessionId;
        const recipients = withNote ? getSharedNoteCheckedRecipients() : [];
        const noteText = document.getElementById('shared_note_text').value.trim();
        if (withNote && (recipients.length === 0 || noteText === '')) {
          showSharedNoteConfirmError('共有先を1人以上選び、共有メモを入力してください');
          return;
        }
        if (!sharedNotePinGrant || sharedNotePinGrant.expiresAt <= Date.now()) {
          sharedNotePinGrant = null;
          openClockPinDialog('退勤', withNote);
          return;
        }
        const ticket = sharedNotePinGrant.ticket;
        sharedNotePinGrant = null; // 送信後の再試行には新しいPIN認証が必要。
        isSharedNoteSubmitting = true;
        startClockSubmission(empId);
        showSharedNoteInputError('');
        showSharedNoteConfirmError('');
        const runner = google.script.run
          .withSuccessHandler(function (result) {
            pendingClockRequests.delete(clockRequestKey(empId, sessionId));
            if (!isSameLoginSession(sessionId)) { return; }
            if (sharedNoteEmpId === empId) {
              isSharedNoteSubmitting = false;
              closeSharedNoteModal();
            }
            finishClockSubmission(empId, sessionId, result, null);
          })
          .withFailureHandler(function (error) {
            pendingClockRequests.delete(clockRequestKey(empId, sessionId));
            if (!isSameLoginSession(sessionId)) { return; }
            if (sharedNoteEmpId === empId) {
              isSharedNoteSubmitting = false;
              const message = '退勤処理に失敗しました: ' + error.message;
              if (withNote) { showSharedNoteConfirmError(message); }
              else { showSharedNoteInputError(message); }
            }
            finishClockSubmission(empId, sessionId, null, error);
          });
        if (withNote) {
          runner.saveSharedNoteAndClockOut(empId, recipients.map(function (item) { return item.id; }), noteText, authToken, ticket);
        } else {
          runner.recordClock(empId, '退勤', ticket, authToken);
        }
      }

      function setSharedNoteButtonsDisabled(disabled) {
        document.getElementById('shared_note_skip_btn').disabled = disabled;
        document.getElementById('shared_note_confirm_submit_btn').disabled = disabled;
      }

      // 店長画面：従業員編集（追加・削除・PIN変更）
      // 通信中に同じ操作を二重に送らないためのフラグ
      let isEmployeeEditSubmitting = false;

      // 削除しようとしている従業員。対象を選ぶまでは null
      let employeeDeleteTarget = null;
      let employeePinRequestId = 0;
      let employeeDirectoryRequestId = 0;

      /**
       * 従業員編集を、どの操作も選んでいない状態に戻す
       * @return {void} 戻り値なし
       */
      function resetEmployeeEditSection() {
        finishEmployeeAdding();
        finishEmployeeDeleting();
        employeeDeleteTarget = null;

        document.getElementById('employee_add_mode_btn').classList.remove('selected');
        document.getElementById('employee_delete_mode_btn').classList.remove('selected');
        document.getElementById('employee_pin_mode_btn').classList.remove('selected');
        document.getElementById('employee_directory_mode_btn').classList.remove('selected');
        document.getElementById('employee_directory_block').style.display = 'none';
        document.getElementById('employee_directory_table').innerHTML = '';
        document.getElementById('employee_directory_table').hidden = true;
        employeeDirectoryRequestId++;
        document.getElementById('employee_pin_block').style.display = 'none';
        document.getElementById('employee_pin_target').innerHTML = '';

      /**

       * @param {string} message 表示する文言（空文字で消す）
       * @param {boolean} isError エラーとして赤く出すなら true
       * @return {void} 戻り値なし
       */
      function showAppMessage(elementId, message, isError) {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.classList.toggle('error', !!isError);
        element.classList.toggle('loading-message', /^読み込み中(?:\.{3}|…)$/.test(message));

      /**
       * 店長画面のサイドバーで選ばれた機能をメイン領域に表示する
       * メニューを押すまでは何も表示しないので、ログイン直後のメイン領域は空欄のままになる
       */
      function showManagerSection(navItem) {
        if (isEmployeeEditSubmitting || isManagerPasswordSubmitting || attendancePendingSaves.size) { return; }
        const sectionName = navItem.dataset.section;
        if ((sectionName === 'skill' || sectionName === 'attendance') && currentManagerSection === sectionName) { return; }
        if (sectionName !== 'attendance') { attendanceRequestId++; }
        if (sectionName !== currentManagerSection &&
            !confirmLeaveSkillEditor(function () { showManagerSection(navItem); })) { return; }
        skillRequestId++;
        if (shiftSaving) { return; }
        if (sectionName !== currentManagerSection &&
            !confirmLeaveShiftEditor(function () { showManagerSection(navItem); })) { return; }
        if (sectionName === 'shift_edit' && currentManagerSection === 'shift_edit') { return; }
        shiftMonthRequestId++;
        shiftWeekRequestId++;
        shiftWeekLoading = false;
        currentManagerSection = sectionName;
        resetManagerPasswordForm();
        resetEmployeeEditSection();
        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let i = 0; i < navItems.length; i++) {
          navItems[i].classList.remove('selected');
        }
        navItem.classList.add('selected');

        const sections = document.querySelectorAll('.manager-section');
        for (let j = 0; j < sections.length; j++) {
          sections[j].style.display = 'none';
        }

        document.getElementById('manager_screen').classList.toggle('skill-section-active', sectionName === 'skill');
        document.getElementById('manager_screen').classList.toggle('order-section-active', sectionName === 'order');
        document.getElementById('manager_screen').classList.toggle('attendance-section-active', sectionName === 'attendance');
        document.getElementById('manager_screen').classList.toggle('employee-section-active', sectionName === 'employee_edit');
        document.getElementById('manager_screen').classList.toggle('shift-section-active', sectionName === 'shift_confirm' || sectionName === 'shift_edit');
        if (sectionName === 'employee_edit') {
          document.getElementById('section_employee_edit').style.display = 'block';
        } else if (sectionName === 'dashboard') {
          document.getElementById('section_dashboard').style.display = 'block';
          loadTodayWork(); // 開くたびに最新の本日の業務設定を読み直す
        } else if (sectionName === 'attendance') {
          document.getElementById('section_attendance').style.display = 'block';
          loadAttendances(); // 開くたびに最新の打刻を読み直す
        } else if (sectionName === 'skill') {
          document.getElementById('section_skill').style.display = 'block';
          loadSkills(); // 開くたびに最新のスキル情報を読み直す
        } else if (sectionName === 'shift_confirm') {
          document.getElementById('section_shift_confirm').style.display = 'block';
          loadShiftMonth(shiftYear, shiftMonth);
        } else if (sectionName === 'shift_edit') {
          document.getElementById('section_shift_edit').style.display = 'block';
          shiftEditMode = null;
          loadShiftWeek(shiftWeekStart);
        } else if (sectionName === 'order') {
          document.getElementById('section_order').style.display = 'block';
          changeOrderView('cart'); // 開いたときは必ず「発注する食材」から始める
          loadOrderBoard(); // 開くたびに最新の業者・食材・発注履歴を読み直す
        } else if (sectionName === 'password_change') {
          document.getElementById('section_password_change').style.display = 'block';
          document.getElementById('current_manager_password').focus();
        }
      }
