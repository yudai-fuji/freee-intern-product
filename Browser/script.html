      /**
       * 取得した本日の業務設定を表に描画する
       */
      function renderTodayWork(result) {
        document.getElementById('today_work_date').textContent = result.date;

        const tbody = document.getElementById('today_work_tbody');
        tbody.innerHTML = '';

        if (result.settings.length === 0) {
          showTodayWorkMessage('従業員名簿に従業員が登録されていません', false);
          return;
        }

        for (let i = 0; i < result.settings.length; i++) {
          tbody.appendChild(createTodayWorkRow(result.settings[i]));
        }

        showTodayWorkMessage('', false);
        document.getElementById('today_work_table').style.display = 'table';
      }

      /**
       * 本日の業務設定の1行分（氏名・ポジションselect・確認事項textarea・保存ボタン）を作る
       */
      function createTodayWorkRow(setting) {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        nameCell.textContent = setting.name;
        row.appendChild(nameCell);

        const positionCell = document.createElement('td');
        const select = document.createElement('select');
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = '未設定';
        select.appendChild(emptyOption);
        for (let i = 0; i < POSITION_ITEMS.length; i++) {
          const option = document.createElement('option');
          option.value = POSITION_ITEMS[i];
          option.textContent = POSITION_ITEMS[i];
          select.appendChild(option);
        }
        select.value = setting.position;
        positionCell.appendChild(select);
        row.appendChild(positionCell);

        const noticesCell = document.createElement('td');
        const textarea = document.createElement('textarea');
        textarea.className = 'today-work-notices-input';
        textarea.rows = 3;
        textarea.value = setting.noticesText;
        noticesCell.appendChild(textarea);
        row.appendChild(noticesCell);

        const actionCell = document.createElement('td');
        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'today-work-save-btn';
        saveBtn.textContent = '保存';
        const statusSpan = document.createElement('span');
        statusSpan.className = 'today-work-row-status';
        saveBtn.addEventListener('click', function () {
          saveTodayWorkRow(setting.id, select, textarea, saveBtn, statusSpan);
        });
        actionCell.appendChild(saveBtn);
        actionCell.appendChild(statusSpan);
        row.appendChild(actionCell);

        return row;
      }

      /**
       * 1人分の本日の業務（ポジション・確認事項）を保存する
       * 他の従業員の行には影響しない。保存ボタンを押した行だけをサーバーへ送信する
       */
      function saveTodayWorkRow(empId, select, textarea, saveBtn, statusSpan) {
        saveBtn.disabled = true;
        statusSpan.textContent = '保存中...';
        statusSpan.classList.remove('error');

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (message) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            saveBtn.disabled = false;
            statusSpan.textContent = message;
            statusSpan.classList.remove('error');
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            saveBtn.disabled = false;
            statusSpan.textContent = 'エラー: ' + error.message;
            statusSpan.classList.add('error');
          })
          .saveTodayWork(empId, select.value, textarea.value, authToken);
      }

      function showTodayWorkError(error) {
        showTodayWorkMessage('エラー: ' + error.message, true);
      }

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・従業員なし・エラー）を切り替える
       */
      function showTodayWorkMessage(message, isError) {
        showAppMessage('today_work_message', message, isError);
      }


      let attendanceRows = new Map();
      const attendanceDrafts = new Map();
      const attendancePendingSaves = new Set();
      let attendanceRequestId = 0;

      function resetAttendanceSection() {
        attendanceRequestId++;
        attendanceRows.clear();
        attendanceDrafts.clear();
        attendancePendingSaves.clear();
        document.getElementById('attendance_tbody').innerHTML = '';
        document.getElementById('attendance_table').style.display = 'none';
        document.getElementById('attendance_date').textContent = '';
        showAttendanceMessage('', false);
      }

      /** 本日の保存済み勤怠を取得する。 */
      function loadAttendances() {
        if (attendancePendingSaves.size) { return; }
        const requestId = ++attendanceRequestId;
        document.getElementById('attendance_table').style.display = 'none';
        showAttendanceMessage('読み込み中...', false);
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId) || requestId !== attendanceRequestId) { return; }
            renderAttendances(result);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || requestId !== attendanceRequestId) { return; }
            showAttendanceError(error);
          })
          .getTodayAttendances(authToken);
      }

      function renderAttendances(result) {
        document.getElementById('attendance_date').textContent = result.date;
        attendanceRows = new Map(result.attendances.map(function (attendance) { return [String(attendance.id), attendance]; }));
        attendanceDrafts.clear();
        const tbody = document.getElementById('attendance_tbody');
        tbody.innerHTML = '';
        attendanceRows.forEach(function (attendance) { tbody.appendChild(createAttendanceRow(attendance)); });
        document.getElementById('attendance_table').style.display = attendanceRows.size ? 'table' : 'none';
        showAttendanceMessage(attendanceRows.size ? '' : '本日の勤務予定はありません', false);
      }

      function createAttendanceRow(attendance) {
        const id = String(attendance.id);
        const draft = attendanceDrafts.get(id);
        const saving = attendancePendingSaves.has(id);
        const row = document.createElement('tr');
        row.dataset.employeeId = id;
        row.classList.toggle('attendance-editing', !!draft);
        row.appendChild(createAttendanceCell(attendance.name));
        ['clockIn', 'clockOut', 'breakTime'].forEach(function (field) {
          if (!draft) { row.appendChild(createAttendanceCell(attendance[field])); return; }
          const cell = document.createElement('td');
          const input = document.createElement('input');
          const isBreak = field === 'breakTime';
          const key = isBreak ? 'breakMinutes' : field;
          input.type = isBreak ? 'number' : 'time';
          input.className = isBreak ? 'attendance-break-input' : 'attendance-time-input';
          input.step = isBreak ? '1' : '60';
          if (isBreak) { input.min = '0'; input.max = '1439'; }
          input.required = isBreak || field === 'clockIn';
          input.value = draft[key];
          input.disabled = saving;
          input.setAttribute('aria-label', attendance.name + 'の' + (isBreak ? '休憩時間（分）' : field === 'clockIn' ? '出勤時刻' : '退勤時刻'));
          input.addEventListener('input', function () {
            draft[key] = input.value;
            draft.error = '';
            showAttendanceRowStatus(id, '', false);
          });
          cell.appendChild(input);
          if (isBreak) {
            const unit = document.createElement('span');
            unit.textContent = ' 分';
            cell.appendChild(unit);
            if (attendance.breakOngoing) {
              const note = document.createElement('small');
              note.className = 'attendance-break-note';
              note.textContent = '休憩中：終了済みの休憩分を入力。退勤を入力すると休憩も終了します。';
              cell.appendChild(note);
            }
          }
          row.appendChild(cell);
        });
        row.appendChild(createAttendanceCell(attendance.workingTime));
        row.appendChild(createAttendanceCell(attendance.estimatedWage));
        const actions = document.createElement('td');
        actions.className = 'attendance-actions';
        const buttons = document.createElement('div');
        buttons.className = 'attendance-row-buttons';
        function addButton(label, action, primary) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = primary ? 'modal-submit-btn' : 'modal-cancel-btn';
          button.textContent = label;
          button.disabled = saving;
          button.addEventListener('click', action);
          buttons.appendChild(button);
        }
        if (draft) {
          addButton(saving ? '保存中...' : '保存', function () { saveAttendanceRow(id); }, true);
          addButton('キャンセル', function () { cancelAttendanceEdit(id); }, false);
        } else {
          addButton('編集', function () { startAttendanceEdit(id); }, false);
        }
        actions.appendChild(buttons);
        const status = document.createElement('div');
        status.className = 'attendance-row-status';
        status.setAttribute('role', 'status');
        if (draft && draft.error) { status.textContent = draft.error; status.classList.add('error'); }
        actions.appendChild(status);
        row.appendChild(actions);
        return row;
      }

      function findAttendanceRow(id) {
        return Array.from(document.getElementById('attendance_tbody').rows).find(function (row) {
          return row.dataset.employeeId === String(id);
        });
      }

      function renderAttendanceRow(id) {
        const row = findAttendanceRow(id);
        const attendance = attendanceRows.get(String(id));
        if (row && attendance) { row.replaceWith(createAttendanceRow(attendance)); }
      }

      function startAttendanceEdit(id) {
        id = String(id);
        const attendance = attendanceRows.get(id);
        if (!attendance || attendanceDrafts.has(id) || attendancePendingSaves.has(id)) { return; }
        attendanceDrafts.set(id, {
          clockIn: attendance.clockInInput, clockOut: attendance.clockOutInput,
          breakMinutes: String(attendance.breakMinutes), error: ''
        });
        renderAttendanceRow(id);
        findAttendanceRow(id).querySelector('input').focus();
      }

      function cancelAttendanceEdit(id) {
        id = String(id);
        if (attendancePendingSaves.has(id)) { return; }
        attendanceDrafts.delete(id);
        renderAttendanceRow(id);
      }

      function showAttendanceRowStatus(id, message, isError) {
        const row = findAttendanceRow(id);
        if (!row) { return; }
        const status = row.querySelector('.attendance-row-status');
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function validateAttendanceDraft(draft) {
        const timePattern = /^([01]\d|2[0-3]):[0-5]\d$/;
        if (!timePattern.test(draft.clockIn)) { return '出勤時刻を入力してください'; }
        if (draft.clockOut && !timePattern.test(draft.clockOut)) { return '退勤時刻を正しく入力してください'; }
        if (draft.clockOut && draft.clockOut < draft.clockIn) { return '退勤時刻は出勤時刻以降にしてください'; }
        if (!/^\d+$/.test(draft.breakMinutes) || Number(draft.breakMinutes) > 1439) {
          return '休憩時間は0〜1439の整数（分）で入力してください';
        }
        const minutes = function (time) { return Number(time.slice(0, 2)) * 60 + Number(time.slice(3)); };
        const maxBreak = minutes(draft.clockOut || '23:59') - minutes(draft.clockIn);
        if (Number(draft.breakMinutes) > maxBreak) { return '休憩時間が勤務時間を超えています'; }
        return '';
      }

      function saveAttendanceRow(id) {
        id = String(id);
        const draft = attendanceDrafts.get(id);
        const attendance = attendanceRows.get(id);
        if (!draft || !attendance || attendancePendingSaves.has(id)) { return; }
        draft.error = validateAttendanceDraft(draft);
        if (draft.error) { showAttendanceRowStatus(id, draft.error, true); return; }
        attendancePendingSaves.add(id);
        renderAttendanceRow(id);
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) { return; }
            attendancePendingSaves.delete(id);
            attendanceDrafts.delete(id);
            attendanceRows.set(id, result.attendance);
            renderAttendanceRow(id);
            showAttendanceRowStatus(id, '保存しました', false);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) { return; }
            attendancePendingSaves.delete(id);
            draft.error = 'エラー: ' + error.message;
            renderAttendanceRow(id);
          })
          .saveAttendance({
            id: id, dateKey: attendance.dateKey, revision: attendance.revision,
            clockIn: draft.clockIn, clockOut: draft.clockOut, breakMinutes: Number(draft.breakMinutes)
          }, authToken);
      }


      /**
       * 勤怠一覧のセルを作る
       * 氏名はシートに入力された値なので、HTMLとして解釈されないよう textContent で入れる
       */
      function createAttendanceCell(text) {
        const cell = document.createElement('td');
        cell.textContent = text;
        if (text === UNRECORDED_LABEL) {
          cell.classList.add('unrecorded'); // 未打刻は店長がすぐ気付けるよう色を変える
        }
        return cell;
      }

      function showAttendanceError(error) {
        document.getElementById('attendance_date').textContent = '';
        showAttendanceMessage('エラー: ' + error.message, true);
      }

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・打刻なし・エラー）を切り替える
       */
      function showAttendanceMessage(message, isError) {
        showAppMessage('attendance_message', message, isError);
      }

      // スキル項目・評価値（config.js の SKILL_ITEMS / SKILL_LEVELS をそのまま埋め込み、二重管理しない）
      // スライダーと保存値は同じF/B/Aの順序を使う。
      const SKILL_ITEMS = <?!= JSON.stringify(SKILL_ITEMS) ?>;
      const SKILL_LEVELS = <?!= JSON.stringify(SKILL_LEVELS) ?>;
      const SKILL_LEVEL_LABELS = <?!= JSON.stringify(SKILL_LEVEL_LABELS) ?>;

      let skillMatrix = []; // サーバーから取得した、有効な従業員ごとのスキル情報
      let skillSelectedEmpId = null; // 右側に出している従業員（文字列にした従業員番号）
      let skillEditing = false;
      let skillSaving = false;
      const skillDrafts = new Map(); // 従業員IDごとの未保存評価。skillMatrixは保存済みの状態を保つ。
      let skillLeaveAction = null;
      let skillDiscardFocus = null;
      let skillRequestId = 0;

      /**
       * 従業員ごとのスキル情報をサーバーから取得する
       * @return {void} 戻り値なし
       */
      function loadSkills() {
        if (skillEditing || skillSaving) { return; }
        const requestId = ++skillRequestId;
        document.getElementById('skill_layout').style.display = 'none';
        showSkillMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (matrix) {
            if (!isSameLoginSession(sessionId) || requestId !== skillRequestId) {
              return;
            }
            renderSkills(matrix);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || requestId !== skillRequestId) {
              return;
            }
            showSkillError(error);
          })
          .getSkillMatrix(authToken);
      }

      /**
       * 取得したスキル情報を、左の従業員一覧と右のスキル詳細に描画する
       * @param {Array} matrix [{ id, name, number, skills, updatedAt }, ...]
       * @return {void} 戻り値なし
       */
      function renderSkills(matrix) {
        if (skillEditing || skillSaving) { return; }
        closeSkillDiscardDialog();
        skillMatrix = matrix;

        if (skillMatrix.length === 0) {
          skillSelectedEmpId = null;
          showSkillMessage('従業員名簿に従業員が登録されていません', false);
          return;
        }

        // 取得し直した一覧から選択中の従業員が消えていたら、右側の表示も解除する
        if (skillSelectedEmpId !== null && findSkillEmployee(skillSelectedEmpId) === null) {
          skillSelectedEmpId = null;
        }

        renderSkillEmployeeList();
        renderSkillDetail();
        showSkillMessage('', false);
        document.getElementById('skill_layout').style.display = 'grid';
      }

      /**
       * 左側の従業員一覧（氏名・従業員番号）を描く
       * 削除済みの従業員はサーバーの getSkillMatrix が返さないので、この一覧には出てこない
       * @return {void} 戻り値なし
       */
      function renderSkillEmployeeList() {
        const list = document.getElementById('skill_employee_list');
        list.innerHTML = '';

        for (let i = 0; i < skillMatrix.length; i++) {
          list.appendChild(createSkillEmployeeListItem(skillMatrix[i]));
        }
      }

      /**
       * 従業員一覧の1人分の項目を作る
       * @param {Object} employeeSkill { id, name, number, skills, updatedAt }
       * @return {Element} 一覧の項目
       */
      function createSkillEmployeeListItem(employeeSkill) {
        const item = document.createElement('li');
        item.className = 'skill-employee-item';
        item.dataset.empId = String(employeeSkill.id);
        renderEmployeeNameBlock(item, employeeSkill); // 従業員画面の一覧と同じ見た目にそろえる
        if (skillSelectedEmpId !== null && String(employeeSkill.id) === skillSelectedEmpId) {
          item.classList.add('selected');
        }
        item.addEventListener('click', function () {
          selectSkillEmployee(String(employeeSkill.id));
        });
        return item;
      }

      /**
       * 一覧で押された従業員を選択状態にし、右側にその人のスキルを出す
       * @param {string} empId 文字列にした従業員番号
       * @return {void} 戻り値なし
       */
      function selectSkillEmployee(empId) {
        if (skillSelectedEmpId === empId || !findSkillEmployee(empId)) { return; }
        skillSelectedEmpId = empId;
        document.querySelectorAll('.skill-employee-item').forEach(function (item) {
          item.classList.toggle('selected', item.dataset.empId === empId);
        });
        renderSkillDetail();
      }

      function startSkillEdit() {
        if (skillSelectedEmpId === null || skillEditing || skillSaving) { return; }
        skillEditing = true;
        showSkillSaveStatus('', false);
        updateSkillEditControls();
      }

      function cancelSkillEdit() {
        if (skillSaving) { return; }
        skillDrafts.clear();
        skillEditing = false;
        renderSkillDetail();
      }

      function updateSkillEditControls() {
        document.getElementById('skill_edit_btn').hidden = skillEditing;
        document.getElementById('skill_edit_btn').disabled = skillSaving;
        document.getElementById('skill_back_btn').hidden = !skillEditing;
        document.getElementById('skill_back_btn').disabled = skillSaving;
        document.getElementById('skill_save_btn').hidden = !skillEditing;
        document.getElementById('skill_save_btn').disabled = skillSaving;
        document.querySelectorAll('#skill_detail_items .skill-rank-slider').forEach(function (slider) {
          slider.disabled = !skillEditing || skillSaving;
        });
        document.querySelectorAll('#skill_discard_overlay button').forEach(function (button) { button.disabled = skillSaving; });
      }

      function hasUnsavedSkillChanges() {
        return skillDrafts.size > 0;
      }

      function updateSkillDraft(empId, item, rank) {
        if (!skillEditing || skillSaving) { return; }
        const employee = findSkillEmployee(empId);
        if (!employee) { return; }
        const key = String(empId);
        const values = (skillDrafts.get(key) || SKILL_ITEMS.map(function (skill) { return employee.skills[skill]; })).slice();
        values[SKILL_ITEMS.indexOf(item)] = rank;
        if (values.every(function (value, i) { return value === employee.skills[SKILL_ITEMS[i]]; })) {
          skillDrafts.delete(key);
        } else {
          skillDrafts.set(key, values);
        }
        showSkillSaveStatus(hasUnsavedSkillChanges() ? skillDrafts.size + '人分の未保存の変更があります' : '', false);
      }

      function confirmLeaveSkillEditor(onLeave) {
        if (skillSaving) { return false; }
        if (!hasUnsavedSkillChanges()) {
          skillEditing = false;
          return true;
        }
        skillLeaveAction = onLeave;
        skillDiscardFocus = document.activeElement;
        document.getElementById('skill_discard_status').textContent = '';
        document.getElementById('skill_discard_overlay').style.display = 'flex';
        document.getElementById('skill_discard_cancel_btn').focus();
        return false;
      }

      function closeSkillDiscardDialog() {
        if (skillSaving) { return; }
        document.getElementById('skill_discard_overlay').style.display = 'none';
        skillLeaveAction = null;
        if (skillDiscardFocus && skillDiscardFocus.isConnected) { skillDiscardFocus.focus(); }
        skillDiscardFocus = null;
      }

      function confirmSkillDiscard() {
        if (skillSaving || !skillLeaveAction) { return; }
        const action = skillLeaveAction;
        cancelSkillEdit();
        closeSkillDiscardDialog();
        action();
      }

      function saveSkillsAndLeave() {
        if (skillSaving || !skillLeaveAction) { return; }
        const action = skillLeaveAction;
        saveSelectedEmployeeSkills(function () {
          closeSkillDiscardDialog();
          action();
        });
      }

      function handleSkillDiscardKeydown(event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeSkillDiscardDialog();
        } else if (event.key === 'Tab') {
          const first = document.getElementById('skill_discard_cancel_btn');
          const last = document.getElementById('skill_discard_save_btn');
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      }

      /**
       * 画面が持っているスキル情報から、指定した従業員を探す
       * @param {string} empId 文字列にした従業員番号
       * @return {Object} 見つかった従業員のスキル情報。見つからなければ null
       */
      function findSkillEmployee(empId) {
        for (let i = 0; i < skillMatrix.length; i++) {
          if (String(skillMatrix[i].id) === String(empId)) {
            return skillMatrix[i];
          }
        }
        return null;
      }

      /**
       * 右側に、選択中の従業員1人分のスキルを描く
       * 誰も選んでいないときは案内文だけを出す
       * @return {void} 戻り値なし
       */
      function renderSkillDetail() {
        const detail = document.getElementById('skill_detail');
        const emptyMessage = document.getElementById('skill_detail_empty');
        const employeeSkill = (skillSelectedEmpId === null) ? null : findSkillEmployee(skillSelectedEmpId);

        if (employeeSkill === null) {
          detail.style.display = 'none';
          emptyMessage.style.display = 'block';
          return;
        }

        // 上部に氏名と従業員番号を出し、誰のスキルを編集しているかを確認できるようにする
        renderEmployeeNameBlock(document.getElementById('skill_detail_name'), employeeSkill);

        const itemsEl = document.getElementById('skill_detail_items');
        itemsEl.innerHTML = '';
        const pendingValues = skillDrafts.get(String(employeeSkill.id));
        const displayEmployee = pendingValues ? Object.assign({}, employeeSkill, { skills: {} }) : employeeSkill;
        if (pendingValues) {
          SKILL_ITEMS.forEach(function (item, i) { displayEmployee.skills[item] = pendingValues[i]; });
        }
        for (let i = 0; i < SKILL_ITEMS.length; i++) {
          itemsEl.appendChild(createSkillDetailItem(SKILL_ITEMS[i], displayEmployee));
        }

        updateSkillEditControls();
        showSkillSaveStatus(skillSaving ? '保存中...' : hasUnsavedSkillChanges() ? skillDrafts.size + '人分の未保存の変更があります' : '', false);
        emptyMessage.style.display = 'none';
        detail.style.display = 'block';
      }

      /**
       * スキル1項目分の行（スキル名・3段階のバー・最終更新日）を作る
       * バーを動かしただけでは保存せず、保存ボタンで6項目をまとめて送る
       * @param {string} item スキル名
       * @param {Object} employeeSkill { id, name, number, skills, updatedAt }
       * @return {Element} スキル1項目分の行
       */
      function createSkillDetailItem(item, employeeSkill) {
        const row = document.createElement('div');
        row.className = 'skill-detail-item';

        const nameEl = document.createElement('div');
        nameEl.className = 'skill-detail-item-name';
        nameEl.textContent = item;
        row.appendChild(nameEl);

        const control = document.createElement('div');
        control.className = 'skill-rank-control';
        const labels = document.createElement('div');
        labels.className = 'skill-rank-labels';
        labels.setAttribute('aria-hidden', 'true');
        SKILL_LEVELS.forEach(function (rank) {
          const label = document.createElement('span');
          label.textContent = rank;
          labels.appendChild(label);
        });
        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '0';
        slider.max = String(SKILL_LEVELS.length - 1);
        slider.step = '1';
        slider.className = 'skill-rank-slider';
        slider.dataset.skillItem = item;
        slider.setAttribute('aria-label', item + 'の評価');
        slider.value = String(Math.max(0, SKILL_LEVELS.indexOf(employeeSkill.skills[item])));
        const current = document.createElement('output');
        current.className = 'skill-rank-current';
        function updateRank() {
          const index = Number(slider.value);
          const rank = SKILL_LEVELS[index];
          control.dataset.rank = rank;
          slider.style.setProperty('--rank-progress', (index / (SKILL_LEVELS.length - 1) * 100) + '%');
          slider.setAttribute('aria-valuetext', rank + '：' + SKILL_LEVEL_LABELS[rank]);
          current.textContent = rank + '：' + SKILL_LEVEL_LABELS[rank];
          Array.from(labels.children).forEach(function (label, i) { label.classList.toggle('selected', i === index); });
        }
        slider.addEventListener('input', function () {
          updateRank();
          updateSkillDraft(employeeSkill.id, item, SKILL_LEVELS[Number(slider.value)]);
        });
        updateRank();
        control.appendChild(labels);
        control.appendChild(slider);
        control.appendChild(current);
        row.appendChild(control);

        const dateLabel = document.createElement('div');
        dateLabel.className = 'skill-detail-item-updated-at';
        dateLabel.textContent = formatSkillUpdatedAtLabel(employeeSkill.updatedAt[item]);
        row.appendChild(dateLabel);

        return row;
      }

      /**
       * 更新日（'yyyy/MM/dd'形式、未保存なら空文字）を「最終更新：8/19」の形にする
       * @param {string} dateStr サーバーから届いた更新日
       * @return {string} 表示用の文字列
       */
      function formatSkillUpdatedAtLabel(dateStr) {
        if (!dateStr) {
          return '最終更新：-';
        }
        const parts = dateStr.split('/');
        if (parts.length !== 3) {
          return '最終更新：-';
        }
        return '最終更新：' + Number(parts[1]) + '/' + Number(parts[2]);
      }

      /**
       * 複数従業員の下書きをまとめて保存し、成功したときだけ下書きを消す
       * 変えていない項目の更新日はサーバー側でも動かさないので、変えた項目だけ日付が新しくなる
       * @return {void} 戻り値なし
       */
      function saveSelectedEmployeeSkills(onSaved) {
        if (!skillEditing || skillSaving) { return; }
        if (!hasUnsavedSkillChanges()) {
          cancelSkillEdit();
          if (typeof onSaved === 'function') { onSaved(); }
          return;
        }
        const changes = Array.from(skillDrafts, function (entry) { return { empId: entry[0], skillValues: entry[1].slice() }; });
        skillSaving = true;
        updateSkillEditControls();
        showSkillSaveStatus('保存中...', false);
        document.getElementById('skill_discard_status').textContent = '保存中...';
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) { return; }
            skillSaving = false;
            result.employees.forEach(function (saved) { applySavedSkills(saved.empId, saved.skillValues, saved.updatedAt); });
            skillDrafts.clear();
            skillEditing = false;
            renderSkillDetail();
            showSkillSaveStatus('変更を保存しました', false);
            if (typeof onSaved === 'function') { onSaved(); }
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) { return; }
            skillSaving = false;
            updateSkillEditControls();
            const message = 'エラー: ' + error.message;
            showSkillSaveStatus(message, true);
            document.getElementById('skill_discard_status').textContent = message;
          })
          .saveEmployeeSkillsBatch(changes, authToken);
      }

      /**
       * 保存できた内容を、画面が持っているスキル情報にも反映する
       * 従業員を切り替えて戻ってきたときに、保存前の内容が出てしまうのを防ぐ
       * @param {string} empId 保存した従業員番号
       * @param {Array} skillValues 保存した評価（SKILL_ITEMS と同じ並び）
       * @param {Object} updatedAt サーバーが返した最新の更新日
       * @return {void} 戻り値なし
       */
      function applySavedSkills(empId, skillValues, updatedAt) {
        const employeeSkill = findSkillEmployee(empId);
        if (employeeSkill === null) {
          return;
        }
        for (let i = 0; i < SKILL_ITEMS.length; i++) {
          employeeSkill.skills[SKILL_ITEMS[i]] = skillValues[i];
          employeeSkill.updatedAt[SKILL_ITEMS[i]] = updatedAt[SKILL_ITEMS[i]];
        }
      }

      /**
       * スキル管理画面の表示を初期状態に戻す（ログインし直したときに前の内容を残さない）
       * @return {void} 戻り値なし
       */
      function resetSkillSection() {
        skillRequestId++;
        skillSaving = false;
        skillEditing = false;
        closeSkillDiscardDialog();
        skillMatrix = [];
        skillDrafts.clear();
        skillSelectedEmpId = null;
        document.getElementById('skill_layout').style.display = 'none';
        document.getElementById('skill_employee_list').innerHTML = '';
        document.getElementById('skill_detail').style.display = 'none';
        document.getElementById('skill_detail_empty').style.display = 'block';
        document.getElementById('skill_detail_name').innerHTML = '';
        document.getElementById('skill_detail_items').innerHTML = '';
        showSkillSaveStatus('', false);
        showSkillMessage('', false);
      }

      /**
       * 保存ボタンのそばに出す短い通知（保存中・保存しました・エラー）を切り替える
       * @param {string} message 表示する文言（空文字で消す）
       * @param {boolean} isError エラーとして赤字にするなら true
       * @return {void} 戻り値なし
       */
      function showSkillSaveStatus(message, isError) {
        const statusEl = document.getElementById('skill_save_status');
        statusEl.textContent = message;
        if (isError) {
          statusEl.classList.add('error');
        } else {
          statusEl.classList.remove('error');
        }
      }

      function showSkillError(error) {
        showSkillMessage('エラー: ' + error.message, true);
      }

      /**
       * 一覧・詳細の代わりに出す一行メッセージ（読み込み中・従業員なし・エラー）を切り替える
       */
      function showSkillMessage(message, isError) {
        showAppMessage('skill_message', message, isError);
      }

      // シフト確認は保存済みデータだけを表示し、編集の下書きとは分離する。
      let shiftYear = null;
      let shiftMonth = null;
      let shiftSelectedDate = null;
      let shiftTodayKey = '';
      let shiftMonthRequestId = 0;
      let shiftMonthRecords = [];
      let shiftMonthEmployees = [];
      let shiftMonthHolidays = new Set();
      let shiftWeekStart = null;
      let shiftWeekRequestId = 0;
      let shiftWeekLoading = false;
      let shiftWeekEmployees = [];
      let shiftSavedRecords = new Map();
      let shiftDrafts = new Map();
      let shiftEditMode = null;
      let shiftSaving = false;
      let shiftLeaveAction = null;
      let shiftLeaveFocus = null;
      const SHIFT_WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
      const SHIFT_WORK_LABELS = { lunch: 'ランチ', dinner: 'ディナー', all: 'オール', custom: '時間指定', unavailable: '出勤不可' };

      const SHIFT_CUSTOM_TIME_PATTERN = /^(1[1-9]|2[0-2]):[0-5][0-9]$/;

    function initializeShiftTimeSelects() {
      const hourSelectIds = [
        'shift_start_hour',
        'shift_end_hour'
      ];

      const minuteSelectIds = [
        'shift_start_minute',
        'shift_end_minute'
