        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId) || requestId !== shiftMonthRequestId) { return; }
            setShiftMonthButtonsDisabled(false);
            shiftYear = result.year;
            shiftMonth = result.month;
            shiftTodayKey = result.today;
            shiftMonthRecords = result.shifts;
            shiftMonthEmployees = result.employees;
            shiftMonthHolidays = new Set(result.holidays || []);
            if (shiftSelectedDate !== null &&
                shiftSelectedDate.indexOf(buildShiftMonthPrefix(result.year, result.month)) !== 0) {
              shiftSelectedDate = null;
            }
            showShiftMessage('', false);
            renderShiftCalendar();
            renderShiftDateDetail();
            document.getElementById('shift_confirm_content').hidden = false;
            document.getElementById('section_shift_confirm').setAttribute('aria-busy', 'false');
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || requestId !== shiftMonthRequestId) { return; }
            setShiftMonthButtonsDisabled(false);
            showShiftMessage('エラー: ' + error.message, true);
            document.getElementById('shift_retry_btn').hidden = false;
            document.getElementById('section_shift_confirm').setAttribute('aria-busy', 'false');
          })
          .getShiftMonth(year, month, authToken);
      }

      function setShiftMonthButtonsDisabled(disabled) {
        document.getElementById('shift_prev_btn').disabled = disabled;
        document.getElementById('shift_next_btn').disabled = disabled;
      }

      function changeShiftMonth(offset) {
        if (shiftYear === null || shiftMonth === null) {
          loadShiftMonth(null, null);
          return;
        }
        const date = new Date(Date.UTC(shiftYear, shiftMonth - 1 + offset, 1));
        loadShiftMonth(date.getUTCFullYear(), date.getUTCMonth() + 1);
      }

      function getShiftDayStatus(dateKey, records) {
        if (isShiftClosedDate(dateKey)) { return 'closed'; }
        return records.some(function (record) { return record.workType !== 'unavailable'; }) ? 'created' : 'uncreated';
      }

      function getShiftDateDetails(dateKey) {
        const records = shiftMonthRecords.filter(function (item) { return item.date === dateKey; });
        const status = getShiftDayStatus(dateKey, records);
        const weekday = parseShiftDate(dateKey).getUTCDay();
        const required = weekday === 0 || weekday === 6 || shiftMonthHolidays.has(dateKey) ? 4 : 3;
        const employees = new Map(shiftMonthEmployees.map(function (employee) { return [String(employee.id), employee]; }));
        const periods = status !== 'created' ? [] : ['lunch', 'dinner'].map(function (period) {
          const ids = new Set(records.filter(function (record) { return getShiftWorkPeriods(record).includes(period); })
            .map(function (record) { return String(record.employeeId); }));
          const members = Array.from(ids).map(function (id) { return employees.get(id); }).filter(Boolean);
          const count = members.filter(function (employee) { return !employee.isManager; }).length;
          return { period: period, members: members, count: count, shortage: Math.max(0, required - count),
            excess: count > required, missingSkills: getShiftPeriodSkills(period).filter(function (skill) {
              return !members.some(function (employee) { return canPerformShiftSkill(employee, skill); });
            }) };
        });
        return { date: dateKey, status: status, shifts: records, periods: periods,
          shortage: periods.some(function (period) { return period.shortage > 0; }),
          excess: periods.some(function (period) { return period.excess; }) };
      }

      function canPerformShiftSkill(employee, skill) {
        const rank = employee.skills && employee.skills[skill];
        return rank === 'A';
      }

      function getShiftPeriodSkills(period) {
        return SKILL_ITEMS.filter(function (skill) { return period !== 'lunch' || skill !== '締め作業'; });
      }

      function getShiftWorkPeriods(record) {
        if (!record) { return []; }
        if (record.workType === 'all') { return ['lunch', 'dinner']; }
        if (record.workType === 'lunch' || record.workType === 'dinner') { return [record.workType]; }
        if (record.workType !== 'custom' || getShiftRecordMinutes(record) === 0) { return []; }
        const periods = [];
        if (record.startTime < '15:00' && record.endTime > '11:30') { periods.push('lunch'); }
        if (record.startTime < '22:00' && record.endTime > '17:00') { periods.push('dinner'); }
        return periods;
      }

      function getShiftRecordMinutes(record) {
        if (!record || record.workType === 'unavailable') { return 0; }
        const timePattern = /^([01][0-9]|2[0-3]):[0-5][0-9]$/;
        if (typeof record.startTime !== 'string' || typeof record.endTime !== 'string' ||
            !timePattern.test(record.startTime) || !timePattern.test(record.endTime)) { return 0; }
        const minutes = function (time) { return Number(time.slice(0, 2)) * 60 + Number(time.slice(3)); };
        return Math.max(0, minutes(record.endTime) - minutes(record.startTime));
      }

      function getShiftConsultationCandidates(detail, period) {
        const unavailable = new Set(detail.shifts.filter(function (record) { return record.workType === 'unavailable'; })
          .map(function (record) { return String(record.employeeId); }));
        const assigned = new Set(detail.shifts.filter(function (record) { return getShiftWorkPeriods(record).includes(period.period); })
          .map(function (record) { return String(record.employeeId); }));
        const monthMinutes = new Map();
        const prefix = detail.date.slice(0, 7) + '-';
        shiftMonthRecords.forEach(function (record) {
          if (record.date.indexOf(prefix) !== 0) { return; }
          const id = String(record.employeeId);
          monthMinutes.set(id, (monthMinutes.get(id) || 0) + getShiftRecordMinutes(record));
        });
        if (!period.shortage) { return []; }
        return shiftMonthEmployees.filter(function (employee) {
          const id = String(employee.id);
          return !employee.isDeleted && !employee.isManager && !unavailable.has(id) && !assigned.has(id);
        }).map(function (employee) {
          return { employee: employee, minutes: monthMinutes.get(String(employee.id)) || 0,
            skills: period.missingSkills.filter(function (skill) { return canPerformShiftSkill(employee, skill); }) };
        }).sort(function (a, b) {
          return b.skills.length - a.skills.length || a.minutes - b.minutes ||
            String(a.employee.id).localeCompare(String(b.employee.id), 'ja', { numeric: true });
        });
      }

      function getShiftEducationCandidates(detail) {
        const candidates = new Map();
        detail.periods.forEach(function (period) {
          period.members.forEach(function (teacher) {
            period.members.forEach(function (learner) {
              if (String(teacher.id) === String(learner.id)) { return; }
              const skills = getShiftPeriodSkills(period.period).filter(function (skill) {
                const rank = learner.skills && learner.skills[skill] || 'F';
                return canPerformShiftSkill(teacher, skill) && (rank === 'F' || rank === 'B');
              });
              if (!skills.length) { return; }
              const key = JSON.stringify([String(teacher.id), String(learner.id)]);
              const candidate = candidates.get(key) || { teacher: teacher, learner: learner, skills: [] };
              skills.forEach(function (skill) { if (!candidate.skills.includes(skill)) { candidate.skills.push(skill); } });
              candidates.set(key, candidate);
            });
          });
        });
        return Array.from(candidates.values());
      }

      function renderShiftCalendar() {
        document.getElementById('shift_month_label').textContent = shiftYear + '年' + shiftMonth + '月';
        const calendar = document.getElementById('shift_calendar');
        calendar.innerHTML = '';
        const firstWeekday = new Date(Date.UTC(shiftYear, shiftMonth - 1, 1)).getUTCDay();
        const lastDay = new Date(Date.UTC(shiftYear, shiftMonth, 0)).getUTCDate();
        const cellCount = Math.ceil((firstWeekday + lastDay) / 7) * 7;
        for (let i = 0; i < cellCount; i++) {
          const day = i - firstWeekday + 1;
          if (day < 1 || day > lastDay) {
            const empty = document.createElement('div');
            empty.className = 'shift-day-empty';
            calendar.appendChild(empty);
          } else {
            calendar.appendChild(createShiftDayCell(day, i % 7));
          }
        }
      }

      function createShiftDayCell(day, weekday) {
        const dateKey = buildShiftDateKey(shiftYear, shiftMonth, day);
        const detail = getShiftDateDetails(dateKey);
        const label = detail.status === 'closed' ? '定休日' :
          (detail.status === 'created' ? '作成済み' : '未作成');
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'shift-day-cell status-' + detail.status;
        cell.dataset.dateKey = dateKey;
        cell.classList.toggle('shift-closed', detail.status === 'closed');
        cell.classList.toggle('today', dateKey === shiftTodayKey);
        cell.classList.toggle('selected', dateKey === shiftSelectedDate);
        cell.setAttribute('aria-pressed', String(dateKey === shiftSelectedDate));
        cell.setAttribute('aria-label', shiftMonth + '月' + day + '日（' + SHIFT_WEEKDAY_LABELS[weekday] + '） ' + label +
          (detail.shortage ? ' 人数不足あり' : '') + (detail.excess ? ' 人数超過あり' : ''));
        const number = document.createElement('span');
        number.className = 'shift-day-number';
        number.textContent = String(day);
        const status = document.createElement('span');
        status.className = 'shift-day-status';
        status.textContent = detail.status === 'created' ? '' : label;
        cell.appendChild(number);
        cell.appendChild(status);
        detail.periods.forEach(function (period) {
          const half = document.createElement('span');
          half.className = 'shift-day-period period-' + period.period + (period.shortage ? ' status-shortage' : ' status-created');
          half.setAttribute('aria-hidden', 'true');
          half.title = SHIFT_WORK_LABELS[period.period] + '：' + period.count + '名' +
            (period.shortage ? '（' + period.shortage + '名不足）' : period.excess ? '（人数超過）' : '');
          if (period.excess) {
            const mark = document.createElement('span');
            mark.className = 'shift-excess-mark';
            mark.textContent = '!';
            half.appendChild(mark);
          }
          cell.appendChild(half);
        });
        if (detail.periods.length) {
          cell.setAttribute('aria-label', cell.getAttribute('aria-label') + ' ' + detail.periods.map(function (period) {
            return SHIFT_WORK_LABELS[period.period] + ' ' + period.count + '名' +
              (period.shortage ? ' ' + period.shortage + '名不足' : period.excess ? ' 人数超過' : ' 必要人数以上');
          }).join('、'));
        }
        cell.addEventListener('click', function () { selectShiftDate(dateKey); });
        return cell;
      }

      function selectShiftDate(dateKey) {
        shiftSelectedDate = dateKey;
        document.querySelectorAll('.shift-day-cell').forEach(function (cell) {
          const selected = cell.dataset.dateKey === dateKey;
          cell.classList.toggle('selected', selected);
          cell.setAttribute('aria-pressed', String(selected));
        });
        renderShiftDateDetail();
      }

      function shiftRecordLabel(record) {
        const label = SHIFT_WORK_LABELS[record.workType] || record.workType;
        if (record.workType === 'unavailable') { return label; }
        if (record.workType === 'all' && !record.startTime && !record.endTime) {
          return label + '（時間未確定）';
        }
        return label + ' ' + record.startTime + '～' + record.endTime;
      }

      function renderShiftDateDetail() {
        const container = document.getElementById('shift_date_detail');
        container.innerHTML = '';
        if (!shiftSelectedDate) {
          container.textContent = '日付を選択すると、その日のシフトを表示します。';
          return;
        }
        const detail = getShiftDateDetails(shiftSelectedDate);
        const heading = document.createElement('h3');
        heading.className = 'shift-detail-heading';
        const date = parseShiftDate(detail.date);
        heading.textContent = date.getUTCFullYear() + '年' + (date.getUTCMonth() + 1) + '月' + date.getUTCDate() +
          '日（' + SHIFT_WEEKDAY_LABELS[date.getUTCDay()] + '）';
        container.appendChild(heading);
        if (detail.status === 'closed') {
          const message = document.createElement('p');
          message.className = 'shift-detail-message';
          message.textContent = '定休日';
          container.appendChild(message);
          return;
        }
        const assignments = createShiftDetailSection(container, '当日のシフト', 'assignments', 'この日に勤務するスタッフの一覧です。');
        if (detail.status === 'uncreated') {
          appendShiftDetailMessage(assignments, '未作成：通常シフトが登録されていません。');
        }
        const names = new Map(shiftMonthEmployees.map(function (employee) { return [String(employee.id), employee.name]; }));
        const tableScroll = document.createElement('div');
        tableScroll.className = 'shift-detail-table-scroll';
        tableScroll.tabIndex = 0;
        tableScroll.setAttribute('role', 'region');
        tableScroll.setAttribute('aria-label', '当日のシフト一覧');
        const table = document.createElement('table');
        table.className = 'shift-detail-table';
        const head = document.createElement('thead');
        const header = document.createElement('tr');
        ['スタッフ名', '勤務区分', '勤務時間'].forEach(function (label) {
          const column = document.createElement('th');
          column.scope = 'col';
          column.textContent = label;
          header.appendChild(column);
        });
        head.appendChild(header);
        table.appendChild(head);
        const body = document.createElement('tbody');
        detail.shifts.forEach(function (record) {
          const row = document.createElement('tr');
          const name = document.createElement('th');
          name.scope = 'row';
          name.className = 'shift-detail-name';
          name.textContent = names.get(String(record.employeeId)) || '従業員ID: ' + record.employeeId;
          const type = document.createElement('td');
          appendShiftDetailMessage(type, SHIFT_WORK_LABELS[record.workType] || record.workType, 'span', 'shift-detail-tag')
            .dataset.workType = record.workType;
          const time = document.createElement('td');
          time.className = 'shift-detail-time';
          time.textContent = record.workType === 'unavailable' ? '—' :
            (record.startTime || record.endTime ? record.startTime + '～' + record.endTime : '時間未確定');
          row.appendChild(name);
          row.appendChild(type);
          row.appendChild(time);
          body.appendChild(row);
        });
        table.appendChild(body);
        tableScroll.appendChild(table);
        if (detail.shifts.length > 0) { assignments.appendChild(tableScroll); }

        if (detail.shortage) {
          const staffing = createShiftDetailSection(container, '勤務状況', 'staffing', '必要人数に対して不足している時間帯のみ表示しています。');
          detail.periods.forEach(function (period) {
            if (period.shortage) {
              const warning = document.createElement('p');
              warning.className = 'shift-detail-warning';
              appendShiftDetailMessage(warning, SHIFT_WORK_LABELS[period.period], 'span', 'shift-warning-period');
              appendShiftDetailMessage(warning, period.shortage + '名不足', 'strong');
              staffing.appendChild(warning);
            }
          });
        }
        const missingPeriods = detail.periods.filter(function (period) { return period.missingSkills.length > 0; });
        if (missingPeriods.length) {
          const skills = createShiftDetailSection(container, 'スキル確認', 'skills', 'この日に不足しているスキルのみ表示しています。');
          const columns = document.createElement('div');
          columns.className = 'shift-skill-columns';
          missingPeriods.forEach(function (period) {
            const group = document.createElement('div');
            group.className = 'shift-skill-group';
            appendShiftDetailMessage(group, SHIFT_WORK_LABELS[period.period], 'h5');
            const list = document.createElement('ul');
            period.missingSkills.forEach(function (skill) { appendShiftDetailMessage(list, skill + 'ができるスタッフがいません', 'li'); });
            group.appendChild(list);
            columns.appendChild(group);
          });
          skills.appendChild(columns);
        }
        const education = getShiftEducationCandidates(detail);
        if (education.length) {
          const section = createShiftDetailSection(container, '教育候補', 'education', 'この日に一緒に勤務するスタッフの中で、教育が可能な組み合わせです。');
          const list = document.createElement('ul');
          list.className = 'shift-education-list';
          education.forEach(function (candidate) {
            const item = document.createElement('li');
            const pair = document.createElement('div');
            pair.className = 'shift-education-pair';
            appendShiftDetailMessage(pair, candidate.teacher.name + 'さん', 'strong', 'shift-education-teacher');
            appendShiftDetailMessage(pair, '→', 'span', 'shift-education-arrow');
            appendShiftDetailMessage(pair, candidate.learner.name + 'さん', 'strong', 'shift-education-learner');
            item.appendChild(pair);
            const skills = document.createElement('div');
            skills.className = 'shift-education-skills';
            appendShiftDetailMessage(skills, '対象スキル：', 'span', 'shift-detail-note');
            candidate.skills.forEach(function (skill) { appendShiftDetailMessage(skills, skill, 'span', 'shift-detail-tag'); });
            item.appendChild(skills);
            list.appendChild(item);
          });
          section.appendChild(list);
        }
        if (detail.shortage) {
          const consultation = createShiftDetailSection(container, '追加シフト相談候補', 'consultation',
            '不足している時間帯の人数を補える可能性のあるスタッフです。（対象時間帯のシフト・出勤不可が未登録の方）');
          detail.periods.forEach(function (period) {
            if (!period.shortage) { return; }
            appendShiftDetailMessage(consultation, SHIFT_WORK_LABELS[period.period], 'h5');
            const candidates = getShiftConsultationCandidates(detail, period);
            if (candidates.length === 0) { appendShiftDetailMessage(consultation, '該当する相談候補はいません。'); return; }
            const candidatesList = document.createElement('ol');
            candidatesList.className = 'shift-candidate-list';
            candidatesList.setAttribute('role', 'list');
            candidates.forEach(function (candidate) {
              const item = document.createElement('li');
              appendShiftDetailMessage(item, candidate.employee.name + 'さん', 'span', 'shift-detail-name');
              if (candidate.skills.length) { appendShiftDetailMessage(item, candidate.skills.join('・') + 'の不足を補えます', 'p', 'shift-candidate-skills'); }
              const hours = Math.floor(candidate.minutes / 60) + '時間' + (candidate.minutes % 60 ? candidate.minutes % 60 + '分' : '');
              const time = document.createElement('div');
              time.className = 'shift-detail-time';
              appendShiftDetailMessage(time, '今月の勤務時間　', 'span');
              appendShiftDetailMessage(time, hours, 'strong');
              item.appendChild(time);
              candidatesList.appendChild(item);
            });
            consultation.appendChild(candidatesList);
          });
        }
      }

      function createShiftDetailSection(container, title, kind, description) {
        const section = document.createElement('section');
        section.className = 'shift-detail-section';
        section.dataset.section = kind;
        appendShiftDetailMessage(section, title, 'h4');
        appendShiftDetailMessage(section, description, 'p', 'shift-detail-description');
        container.appendChild(section);
        return section;
      }

      function appendShiftDetailMessage(container, text, tag, className) {
        const element = document.createElement(tag || 'p');
        if (className) { element.className = className; }
        element.textContent = text;
        container.appendChild(element);
        return element;
      }

      function showShiftMessage(message, isError) {
        showAppMessage('shift_message', message, isError);
      }

      function showShiftEditMessage(message, isError) {
        showAppMessage('shift_edit_message', message, isError);
      }

      function loadShiftWeek(weekStart) {
        if (shiftSaving) { return; }
        shiftWeekLoading = true;
        updateShiftEditControls();
        showShiftEditMessage('読み込み中...', false);
        const sessionId = loginSessionId;
        const requestId = ++shiftWeekRequestId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId) || requestId !== shiftWeekRequestId) { return; }
            shiftWeekLoading = false;
            shiftWeekStart = result.weekStart;
            shiftTodayKey = result.today;
            shiftWeekEmployees = result.employees;
            const lastDate = addShiftDays(shiftWeekStart, 6);
            shiftSavedRecords.forEach(function (record, key) {
              if (record.date >= shiftWeekStart && record.date <= lastDate) { shiftSavedRecords.delete(key); }
            });
            result.shifts.forEach(function (record) {
              shiftSavedRecords.set(shiftCellKey(record.employeeId, record.date), record);
            });
            showShiftEditMessage('', false);
            renderShiftWeek();
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || requestId !== shiftWeekRequestId) { return; }
            shiftWeekLoading = false;
            updateShiftEditControls();
            showShiftEditMessage('エラー: ' + error.message, true);
          })
          .getShiftWeek(weekStart, authToken);
      }

      function changeShiftWeek(offset) {
        if (shiftWeekLoading || shiftSaving) { return; }
        loadShiftWeek(shiftWeekStart ? addShiftDays(shiftWeekStart, offset * 7) : null);
      }

      function renderShiftWeek() {
        const table = document.getElementById('shift_week_table');
        table.innerHTML = '';
        if (!shiftWeekStart) { updateShiftEditControls(); return; }
        document.getElementById('shift_week_label').textContent =
          formatShiftDate(shiftWeekStart) + ' ～ ' + formatShiftDate(addShiftDays(shiftWeekStart, 6));
        const head = document.createElement('thead');
        const header = document.createElement('tr');
        const employeeHeader = document.createElement('th');
        employeeHeader.scope = 'col';
        employeeHeader.textContent = '従業員';
        header.appendChild(employeeHeader);
        for (let i = 0; i < 7; i++) {
          const dateKey = addShiftDays(shiftWeekStart, i);
          const date = parseShiftDate(dateKey);
          const column = document.createElement('th');
          column.scope = 'col';
          column.textContent = (date.getUTCMonth() + 1) + '/' + date.getUTCDate() + '（' + SHIFT_WEEKDAY_LABELS[date.getUTCDay()] + '）';
          if (isShiftClosedDate(dateKey)) {
            column.className = 'shift-closed';
            const closed = document.createElement('span');
            closed.className = 'shift-closed-label';
            closed.textContent = '定休日';
            column.appendChild(closed);
          }
          if (dateKey === shiftTodayKey) { column.setAttribute('aria-current', 'date'); }
          header.appendChild(column);
        }
        head.appendChild(header);
        table.appendChild(head);
        const body = document.createElement('tbody');
        shiftWeekEmployees.forEach(function (employee) {
          const row = document.createElement('tr');
          const name = document.createElement('th');
          name.scope = 'row';
          name.textContent = employee.name;
          const number = document.createElement('span');
          number.className = 'shift-employee-id';
          number.textContent = 'No. ' + (employee.number || employee.id);
          name.appendChild(number);
          row.appendChild(name);
          for (let i = 0; i < 7; i++) {
            const dateKey = addShiftDays(shiftWeekStart, i);
            const cell = document.createElement('td');
            if (isShiftClosedDate(dateKey)) {
              cell.className = 'shift-closed';
              cell.textContent = '定休日';
            } else {
              cell.appendChild(createShiftEditCell(employee, dateKey));
            }
            row.appendChild(cell);
          }
          body.appendChild(row);
        });
        if (shiftWeekEmployees.length === 0) {
          const row = document.createElement('tr');
          const empty = document.createElement('td');
          empty.colSpan = 8;
          empty.textContent = '有効な従業員が登録されていません。';
          row.appendChild(empty);
          body.appendChild(row);
        }
        table.appendChild(body);
        updateShiftEditControls();
      }

      function getShiftColorType(record) {
        if (record && record.workType === 'unavailable') { return 'unavailable'; }
        const periods = getShiftWorkPeriods(record);
        return periods.length === 2 ? 'all' : periods[0] || '';
      }

      function createShiftEditCell(employee, dateKey) {
        const key = shiftCellKey(employee.id, dateKey);
        const saved = shiftSavedRecords.get(key);
        const draft = shiftDrafts.get(key);
        const deleting = draft && draft.operation === 'delete';
        const record = deleting ? saved : (draft || saved);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'shift-edit-cell';
        const colorType = getShiftColorType(record);
        if (colorType) { button.classList.add('shift-color-' + colorType); }
        button.dataset.employeeId = String(employee.id);
        button.dataset.dateKey = dateKey;
        button.classList.toggle('is-draft', !!draft);
        button.classList.toggle('is-deleting', !!deleting);
        button.setAttribute('aria-pressed', String(!!draft));
        const label = document.createElement('span');
        label.className = 'shift-cell-label';
        label.textContent = record ? SHIFT_WORK_LABELS[record.workType] || record.workType : '—';
        button.appendChild(label);
        if (record && record.workType !== 'unavailable') {
          const time = document.createElement('span');
          time.className = 'shift-cell-time';
          time.textContent = record.startTime || record.endTime ? record.startTime + '～' + record.endTime : '時間未確定';
          button.appendChild(time);
        }

        button.setAttribute('aria-label', employee.name + ' ' + formatShiftDate(dateKey) + ' ' +
          (record ? shiftRecordLabel(record) : '未登録') + (draft ? (deleting ? ' 削除予定' : ' 下書き') : ''));
        button.addEventListener('click', function () { toggleShiftDraft(employee.id, dateKey); });
        return button;
      }

      function setShiftEditMode(mode) {
        if (shiftSaving || !['lunch', 'dinner', 'all', 'custom', 'unavailable', 'delete'].includes(mode)) { return; }
        shiftEditMode = shiftEditMode === mode ? null : mode;
        showShiftEditMessage('', false);
        updateShiftEditControls();
      }

      function updateShiftEditControls() {
        const busy = shiftWeekLoading || shiftSaving;

        document.getElementById('shift_week_prev_btn').disabled = busy;
        document.getElementById('shift_week_next_btn').disabled = busy;

        document.getElementById('shift_register_btn').disabled =
          busy || shiftDrafts.size === 0;

        document.getElementById('shift_register_btn').textContent =
          shiftSaving ? '登録中...' : '登録';

        document.getElementById('shift_time_inputs').style.display =
          shiftEditMode === 'custom' ? 'block' : 'none';

        document.querySelectorAll('#shift_time_inputs select').forEach(function (select) {
          select.disabled = shiftSaving;
        });

        document.querySelectorAll('[data-shift-mode]').forEach(function (button) {
          const selected = button.dataset.shiftMode === shiftEditMode;

          button.classList.toggle('selected', selected);
          button.setAttribute('aria-pressed', String(selected));
          button.disabled = shiftSaving;
        });

        document.querySelectorAll('.shift-edit-cell').forEach(function (button) {
          button.disabled = busy;
        });
      }

      function sameShiftAssignment(first, second) {
        return !!first && !!second && first.workType === second.workType &&
          first.startTime === second.startTime && first.endTime === second.endTime;
      }

      function toggleShiftDraft(employeeId, dateKey) {
        if (shiftSaving || shiftWeekLoading || !shiftWeekStart || isShiftClosedDate(dateKey)) { return; }
        if (shiftEditMode === null) {
          showShiftEditMessage('編集モードを選択してください。', true);
          return;
        }
        const key = shiftCellKey(employeeId, dateKey);
        const saved = shiftSavedRecords.get(key);
        const previous = shiftDrafts.get(key);
        let change = { employeeId: String(employeeId), date: dateKey, operation: 'upsert',
          workType: shiftEditMode, startTime: '', endTime: '' };
        if (shiftEditMode === 'delete') {
          if (!saved) {

            if (previous) { shiftDrafts.delete(key); }
            renderShiftWeek();
            return;
          }
          change = { employeeId: String(employeeId), date: dateKey, operation: 'delete' };
        } else if (shiftEditMode === 'lunch') {
          change.startTime = '11:30'; change.endTime = '15:00';
        } else if (shiftEditMode === 'dinner') {
          change.startTime = '17:00'; change.endTime = '22:00';
        } else if (shiftEditMode === 'all') {
          change.startTime = '11:30'; change.endTime = '22:00';
        } else if (shiftEditMode === 'custom') {
          change.startTime = document.getElementById('shift_start_hour').value + ':' + document.getElementById('shift_start_minute').value;
          change.endTime = document.getElementById('shift_end_hour').value + ':' + document.getElementById('shift_end_minute').value;
          if (!SHIFT_CUSTOM_TIME_PATTERN.test(change.startTime) || !SHIFT_CUSTOM_TIME_PATTERN.test(change.endTime) || change.endTime <= change.startTime) {
            showShiftEditMessage('終了時刻を開始時刻より後にしてください', true);
            return;
          }
        }
        const sameDraft = previous && previous.operation === change.operation &&
          (change.operation === 'delete' || sameShiftAssignment(previous, change));
        if (sameDraft || (change.operation === 'upsert' && sameShiftAssignment(saved, change))) {
          shiftDrafts.delete(key);
        } else {
          shiftDrafts.set(key, change);
        }
        showShiftEditMessage('', false);
        renderShiftWeek();

        document.querySelectorAll('.shift-edit-cell').forEach(function (button) {
          if (button.dataset.employeeId === String(employeeId) && button.dataset.dateKey === dateKey) { button.focus(); }
        });
      }

      function registerShiftDrafts() {
        if (shiftSaving || shiftWeekLoading || shiftDrafts.size === 0) { return; }
        const changes = Array.from(shiftDrafts.values()).map(function (change) { return Object.assign({}, change); });
        const sessionId = loginSessionId;
        shiftSaving = true;
        updateShiftEditControls();
        showShiftEditMessage('すべての週の下書きを登録しています...', false);
        google.script.run
          .withSuccessHandler(function () {
            if (!isSameLoginSession(sessionId)) { return; }
            changes.forEach(function (change) {
              const key = shiftCellKey(change.employeeId, change.date);
              if (change.operation === 'delete') { shiftSavedRecords.delete(key); }
              else { shiftSavedRecords.set(key, change); }
            });
            shiftDrafts.clear();
            shiftSaving = false;

            shiftMonthRequestId++;
            shiftMonthRecords = [];
            renderShiftWeek();
            showShiftEditMessage(changes.length + '件の変更を登録しました。', false);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) { return; }
            shiftSaving = false;
            updateShiftEditControls();
            showShiftEditMessage('登録できませんでした。下書きは保持されています。' + error.message, true);
          })
          .saveShiftDrafts(changes, authToken);
      }

      function closeIngredientModal(overlayId) {
        document.getElementById(overlayId).style.display = 'none';
        if (overlayId === 'order_item_overlay') {
          orderItemSelection = null;
        }
      }

      function handleIngredientOverlayClick(event) {

        if (event.target === event.currentTarget) {
          closeIngredientModal(event.currentTarget.id);
        }
      }

      function createIngredientOperationKey() {
        return 'op-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
      }

      let orderBoard = null;

      let orderView = 'cart';

      let orderCart = [];

      let orderItemSelection = null;

      let orderSelectedVendorId = '';

      let orderDrafts = [];

      let orderSendKey = '';

      let orderSending = false;

      function loadOrderBoard() {
        document.getElementById('order_body').style.display = 'none';
        showOrderMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (board) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showOrderMessage('', false);
            applyOrderBoard(board);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            document.getElementById('order_body').style.display = 'none';
            showOrderMessage('エラー: ' + error.message, true);
          })
          .getOrderBoard(authToken);
      }

      function applyOrderBoard(board) {
        orderBoard = board;
        document.getElementById('order_body').style.display = 'block';

        const keptCart = [];
        for (let i = 0; i < orderCart.length; i++) {
          if (findOrderItemById(orderCart[i].ingredientId)) {
            keptCart.push(orderCart[i]);
          }
        }
        orderCart = keptCart;

        if (orderSelectedVendorId !== '' && !findOrderVendorById(orderSelectedVendorId)) {
          orderSelectedVendorId = '';
        }
        renderOrderView();
      }

      function showOrderMessage(message, isError) {
        showAppMessage('order_message', message, isError);
      }

      function changeOrderView(viewName) {
        orderView = viewName;
        renderOrderView();
      }

      function renderOrderView() {
        document.getElementById('order_view_picker').style.display = orderView === 'confirm' ? 'none' : 'flex';
        const views = ['cart', 'confirm', 'upcoming', 'history', 'vendor'];
        for(let i = 0; i < views.length; i++) {
          document.getElementById('order_view_' + views[i]).style.display = (views[i] === orderView) ? 'block' : 'none';
        }

        const tabViews = ['cart', 'upcoming', 'history', 'vendor'];

        for(let i = 0; i < tabViews.length; i++) {
          const button = document.getElementById('order_view_btn_' + tabViews[i]);

          if(button) {
            button.classList.toggle('selected', tabViews[i] === orderView);
          }
        }

        if(!orderBoard) {
          return;
        }

        if(orderView === 'cart') {
          renderOrderCart();
        } else if (orderView === 'confirm') {
          refreshOrderConfirm();
        } else if (orderView === 'upcoming') {
          renderOrderUpcoming();
        } else if (orderView === 'history') {
          renderOrderHistory();
        } else if (orderView === 'vendor') {
          renderOrderVendor();
        }
      }

      function createOrderElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        if (text !== undefined && text !== null) {
          element.textContent = text;
        }
        return element;
      }

      function createOrderLinkButton(text, onClick) {
        const button = createOrderElement('button', 'order-link', text);
        button.type = 'button';
        button.addEventListener('click', onClick);
        return button;
      }

      function findOrderItemById(ingredientId) {
        for (let i = 0; i < orderBoard.items.length; i++) {
          if (orderBoard.items[i].id === ingredientId) {
            return orderBoard.items[i];
          }
        }
        return null;
      }

      function findOrderVendorById(vendorId) {
        for (let i = 0; i < orderBoard.vendors.length; i++) {
          if (orderBoard.vendors[i].id === vendorId) {
            return orderBoard.vendors[i];
          }
        }
        return null;
      }

      function findOrderCartItem(ingredientId) {
        for (let i = 0; i < orderCart.length; i++) {
          if (orderCart[i].ingredientId === ingredientId) {
            return orderCart[i];
          }
        }
        return null;
      }

      function roundOrderQuantity(quantity) {
        return Math.round(quantity * 10) / 10;
      }

      function renderOrderCart() {

        const list = document.getElementById('order_cart_list');
        list.innerHTML = '';

        if (orderCart.length === 0) {
          list.appendChild(createOrderElement('div', 'order-empty',
            '発注する食材がまだありません。「＋ 食材を追加」から選んでください。'));
          document.getElementById('order_cart_footer').style.display = 'none';
          return;
        }

        for (let i = 0; i < orderCart.length; i++) {
          const cartItem = orderCart[i];
          const item = findOrderItemById(cartItem.ingredientId);
          if (!item) {
            continue;
          }
          list.appendChild(createOrderCartCard(item, cartItem));
        }
        document.getElementById('order_cart_footer').style.display = 'flex';
      }

      function createOrderCartCard(item, cartItem) {
        const card = createOrderElement('div', 'order-cart-card');
        card.appendChild(createOrderElement('div', 'order-cart-name', item.name));

        const quantityBox = createOrderElement('div', 'order-cart-quantity');
        const minusBtn = createOrderElement('button', 'order-step-btn', '−');
        minusBtn.type = 'button';
        minusBtn.setAttribute('aria-label', item.name + 'の数量を減らす');
        minusBtn.addEventListener('click', function () { changeOrderQuantity(item.id, -1); });
        quantityBox.appendChild(minusBtn);

        const input = document.createElement('input');
        input.type = 'number';
        input.className = 'order-quantity-input';
        input.min = '0';
        input.step = '0.1';
        input.value = String(cartItem.quantity);
        input.setAttribute('aria-label', item.name + 'の数量');
        input.addEventListener('change', function () { setOrderQuantity(item.id, this.value); });
        quantityBox.appendChild(input);

        const plusBtn = createOrderElement('button', 'order-step-btn', '＋');
        plusBtn.type = 'button';
        plusBtn.setAttribute('aria-label', item.name + 'の数量を増やす');
        plusBtn.addEventListener('click', function () { changeOrderQuantity(item.id, 1); });
        quantityBox.appendChild(plusBtn);

        quantityBox.appendChild(createOrderElement('span', 'order-cart-unit', item.unit));
        card.appendChild(quantityBox);

        const vendorBox = createOrderElement('div', 'order-cart-vendor');
        vendorBox.appendChild(document.createTextNode('業者：'));
        if (item.vendorId === '') {
          vendorBox.appendChild(document.createTextNode('未設定'));
        } else {
          vendorBox.appendChild(createOrderLinkButton(item.vendorName, function () {
            openOrderVendorDetail(item.vendorId);
          }));
        }
        card.appendChild(vendorBox);

        const removeBtn = createOrderElement('button', 'order-remove-btn', '削除');
        removeBtn.type = 'button';
        removeBtn.addEventListener('click', function () { removeOrderCartItem(item.id); });
        card.appendChild(removeBtn);
        return card;
      }

      function changeOrderQuantity(ingredientId, delta) {
        const cartItem = findOrderCartItem(ingredientId);
        if (!cartItem) {
          return;
        }
        const next = roundOrderQuantity(cartItem.quantity + delta);
        if (next <= 0 || next > orderBoard.maxQuantity) {
          return;
        }
        cartItem.quantity = next;
        renderOrderCart();
      }

      function setOrderQuantity(ingredientId, value) {
        const cartItem = findOrderCartItem(ingredientId);
        if (!cartItem) {
          return;
        }
        const quantity = roundOrderQuantity(Number(value));
        if (isFinite(quantity) && quantity > 0 && quantity <= orderBoard.maxQuantity) {
          cartItem.quantity = quantity;
        }
        renderOrderCart();
      }

      function removeOrderCartItem(ingredientId) {
        const kept = [];
        for (let i = 0; i < orderCart.length; i++) {
          if (orderCart[i].ingredientId !== ingredientId) {
            kept.push(orderCart[i]);
          }
        }
        orderCart = kept;
        renderOrderCart();
      }

      function clearOrderCart() {
        orderCart = [];
        renderOrderCart();
      }

      function openOrderItemModal() {
        if (!orderBoard) {
          showOrderMessage('発注の情報を読み込めていません。発注管理を開き直してください', true);
          return;
        }
        orderItemSelection = new Set(orderCart.map(function (item) { return item.ingredientId; }));
        renderOrderItemChoices();
        document.getElementById('order_item_overlay').style.display = 'flex';
      }

      function applyOrderItemSelection() {
        if (!orderBoard || orderItemSelection === null) { return; }
        const nextCart = orderCart.filter(function (item) {
          return orderItemSelection.has(item.ingredientId) && findOrderItemById(item.ingredientId);
        });
        orderItemSelection.forEach(function (id) {
          const item = findOrderItemById(id);
          if (item && item.vendorId !== '' && !findOrderCartItem(id)) {
            nextCart.push({ 'ingredientId': id, 'quantity': 1 });
          }
        });
        orderCart = nextCart;
        closeIngredientModal('order_item_overlay');
        renderOrderCart();
      }

      function renderOrderItemChoices() {
        const container = document.getElementById('order_item_choices');
        container.innerHTML = '';
        if (orderItemSelection === null) { return; }

        let currentGroupName = null;
        let buttonsBox = null;
        let shownCount = 0;
        for (let i = 0; i < orderBoard.items.length; i++) {
          const item = orderBoard.items[i];
          const groupName = item.vendorId === '' ? '業者が未設定の食材（発注できません）' : item.vendorName;
          if (groupName !== currentGroupName) {
            container.appendChild(createOrderElement('div', 'order-item-group-name', groupName));
            buttonsBox = createOrderElement('div', 'order-item-buttons');
            container.appendChild(buttonsBox);
            currentGroupName = groupName;
          }

          const selected = orderItemSelection.has(item.id);
          const button = createOrderElement('button', 'order-item-btn' + (selected ? ' selected' : ''), item.name);
          button.setAttribute('aria-pressed', String(selected));
          button.type = 'button';
          if (item.vendorId === '') {
            button.disabled = true;
          } else {
            button.addEventListener('click', function () {
              if (orderItemSelection.has(item.id)) {
                orderItemSelection.delete(item.id);
              } else {
                orderItemSelection.add(item.id);
              }
              const selected = orderItemSelection.has(item.id);
              button.classList.toggle('selected', selected);
              button.setAttribute('aria-pressed', String(selected));
            });
          }
          buttonsBox.appendChild(button);
          shownCount++;
        }

        if (shownCount === 0) {
          container.appendChild(createOrderElement('div', 'order-empty', '選べる食材がありません。'));
        }
      }

      function refreshOrderConfirm() {
        const list = document.getElementById('order_confirm_list');
        list.innerHTML = '';
        document.getElementById('order_send_footer').style.display = 'none';
        orderDrafts = [];

        if (orderCart.length === 0) {
          showOrderConfirmMessage('発注する食材が選ばれていません。「発注する食材」から追加してください', false);
          return;
        }
        showOrderConfirmMessage('発注内容を作成中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showOrderConfirmMessage('', false);
            renderOrderConfirm(result.drafts);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showOrderConfirmMessage('エラー: ' + error.message, true);
          })
          .getOrderDrafts({
            'authToken': authToken,
            'items': orderCart
          });
      }

      function showOrderConfirmMessage(message, isError) {
        const messageEl = document.getElementById('order_confirm_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      function renderOrderConfirm(drafts) {
        orderDrafts = drafts;
        const list = document.getElementById('order_confirm_list');
        list.innerHTML = '';

        for (let i = 0; i < drafts.length; i++) {
          list.appendChild(createOrderConfirmCard(drafts[i]));
        }

        const footer = document.getElementById('order_send_footer');
        updateOrderSendButton();
        if (!orderSending) {
          showOrderSendStatus('', false);
        }
        footer.style.display = drafts.length > 0 ? 'flex' : 'none';
      }

      function createOrderConfirmCard(draft) {
        const card = createOrderElement('div', 'order-vendor-card');

        const title = createOrderElement('div', 'order-vendor-card-title');
        title.appendChild(createOrderLinkButton(draft.vendorName, function () {
          openOrderVendorDetail(draft.vendorId);
        }));
        card.appendChild(title);

        const lines = createOrderElement('ul', 'order-line-list order-confirm-lines');
        for (let i = 0; i < draft.lines.length; i++) {
          const li = document.createElement('li');
          li.appendChild(createOrderElement('span', '', draft.lines[i].name));
          li.appendChild(createOrderElement('span', 'order-line-quantity', draft.lines[i].quantityText));
          lines.appendChild(li);
        }
        card.appendChild(lines);

        card.appendChild(createOrderElement('div', 'order-mail-subject', '件名：' + draft.subject));
        card.appendChild(createOrderElement('pre', 'order-mail-preview', draft.body));

        if (!draft.canSend) {
          card.appendChild(createOrderElement('div', 'modal-error', draft.sendBlockReason));
        }
        return card;
      }

      function updateOrderSendButton() {
        const sendBtn = document.getElementById('order_send_btn');
        sendBtn.textContent = orderSending ? '送信中...' : (orderDrafts.length + '社へ発注する');
        sendBtn.disabled = orderSending;
      }

      function showOrderSendStatus(message, isError) {
        const statusEl = document.getElementById('order_send_status');
        statusEl.textContent = message;
        if (isError) {
          statusEl.classList.add('error');
        } else {
          statusEl.classList.remove('error');
        }
      }

      function submitOrderMails() {
        if (orderSending || orderDrafts.length === 0) {
          return;
        }
        if (orderSendKey === '') {
          orderSendKey = createIngredientOperationKey();
        }

        orderSending = true;
        updateOrderSendButton();
        showOrderSendStatus('', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            orderSending = false;
            updateOrderSendButton();
            orderSendKey = '';
            applyOrderAfterSend(result);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            orderSending = false;
            updateOrderSendButton();

            showOrderSendStatus('エラー: ' + error.message, true);
          })
          .sendOrderMails({
            'authToken': authToken,
            'operationKey': orderSendKey,
            'items': orderCart
          });
      }

      function applyOrderAfterSend(result) {
        const detail = result.detail;
        if (!detail) {

          orderCart = [];
        } else {
          const keptCart = [];
          for (let i = 0; i < orderCart.length; i++) {
            const item = findOrderItemById(orderCart[i].ingredientId);
            if (item && detail.sentVendorIds.indexOf(item.vendorId) === -1) {
              keptCart.push(orderCart[i]);
            }
          }
          orderCart = keptCart;
        }

        const hasFailure = !!(detail && detail.failures && detail.failures.length > 0);
        applyOrderBoard(result.board);
        showOrderMessage(result.message, hasFailure);

        if (!hasFailure && orderCart.length === 0) {
          changeOrderView('history');
        } else {
          showOrderSendStatus(result.message, hasFailure);
        }
      }

      let orderUpcomingToday = '';

      function getOrderToday() {
        const parts = new Intl.DateTimeFormat('en-US', { timeZone: CLOCK_TIME_ZONE,
          year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
        const values = {};
        parts.forEach(function (part) { values[part.type] = part.value; });
        return values.year + '/' + values.month + '/' + values.day;
      }

      function renderOrderUpcoming() {
        const body = document.getElementById('order_upcoming_tbody');
        body.innerHTML = '';
        orderUpcomingToday = getOrderToday();
        const orders = (orderBoard.upcoming || []).filter(function (order) {
          return !order.expectedDate || order.expectedDate >= orderUpcomingToday;
        });
        document.getElementById('order_upcoming_message').textContent = orders.length ? '' : '入荷予定の食材はありません。';
        document.getElementById('order_upcoming_scroll').hidden = orders.length === 0;
        orders.forEach(function (order) {
          const row = document.createElement('tr');
          [order.name, order.orderedAt, order.quantityText, order.expectedDate || '未設定', order.vendorName].forEach(function (value) {
            row.appendChild(createOrderElement('td', '', value));
          });
          body.appendChild(row);
        });
      }

      function refreshOrderUpcomingDate() {
        if (currentScreen === 'manager' && currentManagerSection === 'order' && orderView === 'upcoming' &&
            orderBoard && orderUpcomingToday !== getOrderToday()) { renderOrderUpcoming(); }
      }

      function renderOrderHistory() {
        const list = document.getElementById('order_history_list');
        list.innerHTML = '';
        document.getElementById('order_history_message').textContent =
          '新しい発注が上に表示されます（' + orderBoard.nowText + ' 時点）';

        if (orderBoard.history.length === 0) {
          list.appendChild(createOrderElement('div', 'order-empty', '発注の記録はまだありません。'));
          return;
        }
        for (let i = 0; i < orderBoard.history.length; i++) {
          list.appendChild(createOrderHistoryCard(orderBoard.history[i]));
        }
      }

      function createOrderHistoryCard(history) {
        const card = createOrderElement('div', 'order-history-card');

        const head = createOrderElement('div', 'order-history-head');
        head.appendChild(createOrderElement('span', 'order-history-date', history.orderedAtLabel));
        if (history.vendorId === '') {
          head.appendChild(createOrderElement('span', '', history.vendorName));
        } else {
          head.appendChild(createOrderLinkButton(history.vendorName, function () {
            openOrderVendorDetail(history.vendorId);
          }));
        }
        head.appendChild(createOrderElement('span', 'order-history-tag', history.channelText));
        card.appendChild(head);

        const lines = createOrderElement('ul', 'order-line-list');
        for (let i = 0; i < history.lines.length; i++) {
          const li = document.createElement('li');
          li.appendChild(createOrderElement('span', '', history.lines[i].name));
          li.appendChild(createOrderElement('span', 'order-line-quantity', history.lines[i].quantityText));
          lines.appendChild(li);
        }
        card.appendChild(lines);

        const meta = createOrderElement('div', 'order-history-meta');
        meta.appendChild(createOrderElement('div', '', '発注日時：' + history.orderedAt));
        meta.appendChild(createOrderElement('div', '', '発注者：' + (history.orderedBy === '' ? '記録なし' : history.orderedBy)));
        if (history.mailTo !== '') {
          meta.appendChild(createOrderElement('div', '', '送信先：' + history.mailTo));
        }
        if (history.expectedDate !== '') {
          meta.appendChild(createOrderElement('div', '', '入荷予定日：' + history.expectedDate));
        }
        meta.appendChild(createOrderElement('div', '', '状態：' + history.statusTexts.join('・')));
        card.appendChild(meta);
        return card;
      }

      function renderOrderVendor() {
        const vendor = findOrderVendorById(orderSelectedVendorId) || orderBoard.vendors[0];
        orderSelectedVendorId = vendor ? vendor.id : '';
        document.getElementById('order_vendor_message').textContent = vendor ? '' : '業者が登録されていません。';
        renderOrderVendorList();
        const detailEl = document.getElementById('order_vendor_detail');
        detailEl.innerHTML = '';
        if (vendor) { renderOrderVendorDetail(vendor); }
      }

      function renderOrderVendorList() {
        const listEl = document.getElementById('order_vendor_list');
        const scrollTop = listEl.scrollTop;
        listEl.innerHTML = '';
        for (let i = 0; i < orderBoard.vendors.length; i++) {
          const vendor = orderBoard.vendors[i];
          const selected = vendor.id === orderSelectedVendorId;
          const tile = createOrderElement('button', 'skill-employee-item order-vendor-tile' + (selected ? ' selected' : ''), vendor.name);
          tile.type = 'button';
          tile.setAttribute('aria-pressed', String(selected));
          tile.addEventListener('click', function () {
            openOrderVendorDetail(vendor.id);
            listEl.children[i].focus({ preventScroll: true });
          });
          listEl.appendChild(tile);
        }
        listEl.scrollTop = scrollTop;
      }

      function openOrderVendorDetail(vendorId) {
        orderSelectedVendorId = vendorId;
        changeOrderView('vendor');
      }

      function renderOrderVendorDetail(vendor) {
        const container = document.getElementById('order_vendor_detail');
        container.innerHTML = '';
        container.appendChild(createOrderElement('h4', 'order-view-heading', vendor.name));
        container.appendChild(createOrderVendorDetailGrid(vendor));
      }

      function createOrderVendorDetailGrid(vendor) {
        const rows = [
          ['業者名', vendor.name],
          ['住所', vendor.address],
          ['電話番号', vendor.phone],
          ['メールアドレス', vendor.email],
          ['営業時間', vendor.businessHours],
          ['定休日', vendor.closedDays],
          ['発注締切', vendor.deadlineText],
          ['通常納品日数', vendor.leadTimeText]
        ];
        const grid = createOrderElement('div', 'order-detail-grid');
        for (let i = 0; i < rows.length; i++) {
          grid.appendChild(createOrderElement('div', 'order-detail-label', rows[i][0]));
          const hasValue = (rows[i][1] !== undefined && rows[i][1] !== null && rows[i][1] !== '');
          grid.appendChild(createOrderElement('div', 'order-detail-value' + (hasValue ? '' : ' unset'),
            hasValue ? rows[i][1] : '未登録'));
        }
        return grid;
      }

    </script>
