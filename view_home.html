<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= HtmlService.createHtmlOutputFromFile('css').getContent(); ?>
    <?!= HtmlService.createTemplateFromFile('script').evaluate().getContent(); ?>
  </head>
  <body>
    <div class="app-header">
      <h1 class="app-title">店舗運営支援アプリ</h1>
      <button type="button" id="to_manager_btn" class="header-btn" onclick="showScreen('manager')">店長画面</button>
      <button type="button" id="to_employee_btn" class="header-btn" onclick="showScreen('employee')" style="display:none;">従業員画面に戻る</button>
    </div>

    <div id="employee_screen">
      <div class="main-layout">
        <div class="employee-list">
          <div class="employee-list-header">
            <h3>従業員一覧</h3>
            <button type="button" class="add-employee-btn" onclick="openAddEmployeeModal()">追加</button>
          </div>
          <ul>
            <?
            const employees = getEmployees();
            for (let i = 0; i <= employees.length - 1; i++) {
              const id = employees[i]['id'];
              const name = employees[i]['name'];
            ?>
            <li class="employee-item" data-emp-id="<?= id ?>" data-emp-name="<?= name ?>"><?= name ?></li>
            <? } ?>
          </ul>
        </div>
        <div id="right_panel" class="clock-panel" style="display:none;">
          <div class="selected-emp-name" id="selected_emp_name"></div>
          <div class="current-time" id="current_time"></div>
          <div class="clock-buttons">
            <button type="button" class="clock-btn clock-in" onclick="handleClockButtonClick('出勤')">出勤</button>
            <button type="button" class="clock-btn clock-out" onclick="handleClockButtonClick('退勤')">退勤</button>
          </div>
          <div class="break-buttons">
            <button type="button" class="break-btn break-start" onclick="handleClockButtonClick('休憩開始')">休憩開始</button>
            <button type="button" class="break-btn break-end" onclick="handleClockButtonClick('休憩終了')">休憩終了</button>
          </div>
          <div id="record_message"></div>
          <div id="today_work_card" class="today-work-card" style="display:none;">
            <h3 class="today-work-card-heading">本日の業務</h3>
            <div id="today_work_card_body"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="manager_screen" style="display:none;">
      <div class="manager-layout">
        <ul class="manager-sidebar">
          <li class="manager-nav-item selected" data-section="dashboard">ダッシュボード</li>
          <li class="manager-nav-item" data-section="attendance">勤怠管理</li>
          <li class="manager-nav-item" data-section="skill">スキル管理</li>
          <li class="manager-nav-item" data-section="shift">シフト</li>
          <li class="manager-nav-item" data-section="handover">引継ぎ</li>
          <li class="manager-nav-item" data-section="ingredient">食材管理</li>
        </ul>
        <div class="manager-main">
          <div id="section_dashboard" class="manager-section">
            <h2 class="manager-heading">店長ダッシュボード</h2>

            <div class="today-work-block">
              <h3 class="today-work-heading">本日の業務設定</h3>
              <div class="today-work-date" id="today_work_date"></div>
              <div class="attendance-message" id="today_work_message"></div>
              <table class="attendance-table today-work-table" id="today_work_table" style="display:none;">
                <thead>
                  <tr>
                    <th>氏名</th>
                    <th>ポジション</th>
                    <th>確認事項</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="today_work_tbody"></tbody>
              </table>
            </div>
          </div>

          <div id="section_attendance" class="manager-section" style="display:none;">
            <div class="manager-section-header">
              <h2 class="manager-heading">勤怠管理</h2>
              <button type="button" id="attendance_reload_btn" class="attendance-reload-btn" onclick="loadAttendances()">更新</button>
            </div>
            <div class="attendance-date" id="attendance_date"></div>
            <div class="attendance-message" id="attendance_message"></div>
            <table class="attendance-table" id="attendance_table" style="display:none;">
              <thead>
                <tr>
                  <th>氏名</th>
                  <th>出勤</th>
                  <th>退勤</th>
                  <th>休憩</th>
                  <th>実労働時間</th>
                  <th>概算給与</th>
                </tr>
              </thead>
              <tbody id="attendance_tbody"></tbody>
            </table>
          </div>

          <div id="section_skill" class="manager-section" style="display:none;">
            <h2 class="manager-heading">従業員スキル管理</h2>
            <div class="attendance-message" id="skill_message"></div>
            <table class="attendance-table skill-table" id="skill_table" style="display:none;">
              <thead>
                <tr>
                  <th>氏名</th>
                  <th>接客</th>
                  <th>レジ</th>
                  <th>バー</th>
                  <th>厨房</th>
                  <th>肉の仕込み</th>
                  <th>締め作業</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="skill_tbody"></tbody>
            </table>
          </div>

          <div id="section_preparing" class="manager-section" style="display:none;">
            <h2 class="manager-heading" id="preparing_heading"></h2>
            <div class="attendance-message">この機能は準備中です</div>
          </div>
        </div>
      </div>
    </div>

    <div id="add_employee_overlay" class="modal-overlay" onclick="handleOverlayClick(event)">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title">従業員を追加</span>
          <span class="modal-close" onclick="closeAddEmployeeModal()">×</span>
        </div>
        <label class="modal-label">姓</label>
        <input type="text" id="add_last_name" class="modal-input">
        <label class="modal-label">名</label>
        <input type="text" id="add_first_name" class="modal-input">
        <div id="add_employee_error" class="modal-error"></div>
        <div class="modal-footer">
          <button type="button" class="modal-cancel-btn" onclick="closeAddEmployeeModal()">キャンセル</button>
          <button type="button" id="add_employee_submit_btn" class="modal-submit-btn" onclick="submitAddEmployee()">登録</button>
        </div>
      </div>
    </div>
  </body>
</html>
