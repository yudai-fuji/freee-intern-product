<script>
      let selectedEmpId = null;
      let clockIntervalId = null;

      // ログイン状態。トークンは GAS が発行したものをそのまま持ち、店長専用の通信に添えて渡す
      let authToken = '';

      // ログインのたびに増やす通し番号。ログアウトをまたいで遅れて届いた通信結果を捨てるために使う
      let loginSessionId = 0;

      // 無操作の判定に使う時間（ミリ秒）
      const IDLE_NOTICE_MS = 14 * 60 * 1000;
      const IDLE_LOGOUT_MS = 15 * 60 * 1000;

      // 無操作時間を調べる間隔（ミリ秒）
      const IDLE_CHECK_INTERVAL_MS = 1000;

      // マウス移動で最終操作時刻を更新する間隔の下限（ミリ秒）
      const ACTIVITY_UPDATE_INTERVAL_MS = 1000;

      // 最後に操作した時刻（ブラウザ内だけで持ち、サーバーへは送らない）
      let lastActivityAt = 0;
      let idleTimerId = null;
      let isIdleNoticeShown = false;

      // 打刻がまだ無いことを表す表示文字列（code.js の UNRECORDED_LABEL と揃える）
      const UNRECORDED_LABEL = '未打刻';

      // ポジション候補（code.js の POSITION_ITEMS をそのまま埋め込み、二重管理しない）
      const POSITION_ITEMS = <?!= JSON.stringify(POSITION_ITEMS) ?>;

      // 役割名（config.js の定数をそのまま埋め込み、二重管理しない）
      const ROLE_MANAGER = <?!= JSON.stringify(ROLE_MANAGER) ?>;

      window.addEventListener('load', function () {
        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].addEventListener('click', function () {
            selectEmployee(this);
          });
        }

        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let j = 0; j < navItems.length; j++) {
          navItems[j].addEventListener('click', function () {
            showManagerSection(this);
          });
        }

        // 画面内の操作をここで一度だけ登録する。ログインのたびには登録しないので二重に動かない
        document.addEventListener('mousemove', function () { handleUserActivity(true); });
        document.addEventListener('click', function () { handleUserActivity(false); });
        document.addEventListener('keydown', function () { handleUserActivity(false); });
        // スクロールは要素ごとに起きて上まで伝わらないので、捕捉フェーズでまとめて受け取る
        document.addEventListener('scroll', function () { handleUserActivity(false); }, true);

        // パスコード欄では Enter キーでもログインできるようにする
        document.getElementById('login_passcode').addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            submitLogin();
          }
        });

        showScreen('login');
      });

      /**
       * ログイン画面・従業員画面・店長画面を切り替える
       * ページ遷移はせず表示/非表示を操作するだけなので、選択中の従業員などの状態は保持される
       * @param {string} screenName 'login' / 'employee' / 'manager'
       * @return {void} 戻り値なし
       */
      function showScreen(screenName) {
        const isLogin = (screenName === 'login');
        const isEmployee = (screenName === 'employee');
        document.getElementById('login_screen').style.display = isLogin ? 'flex' : 'none';
        document.getElementById('employee_screen').style.display = isEmployee ? 'block' : 'none';
        document.getElementById('manager_screen').style.display = (!isLogin && !isEmployee) ? 'block' : 'none';
        // ログアウトボタンはログイン後だけ、両画面とも同じ位置に出す
        document.getElementById('logout_btn').style.display = isLogin ? 'none' : 'inline-block';

        if (isLogin) {
          document.getElementById('login_passcode').focus();
          return;
        }

        // 店長画面を表示したとき、ダッシュボードが表示中なら本日の業務設定を読み直す
        if (!isEmployee && document.getElementById('section_dashboard').style.display !== 'none') {
          loadTodayWork();
        }
      }

      /**
       * 入力されたパスコードでログインする
       * 照合は GAS 側で行い、成功したときだけトークンと役割を受け取る
       * @return {void} 戻り値なし
       */
      function submitLogin() {
        const passcodeInput = document.getElementById('login_passcode');
        // 先頭の 0 を保持するため、数値に変換せず文字列のまま渡す
        const passcode = passcodeInput.value;
        const loginBtn = document.getElementById('login_btn');

        if (passcode === '') {
          showLoginError('パスコードを入力してください');
          return;
        }

        showLoginError('');
        loginBtn.disabled = true;

        google.script.run
          .withSuccessHandler(function (result) {
            loginBtn.disabled = false;
            if (!result.success) {
              showLoginError(result.message);
              passcodeInput.value = '';
              passcodeInput.focus();
              return;
            }
            startLoginSession(result.token, result.role);
          })
          .withFailureHandler(function (error) {
            loginBtn.disabled = false;
            showLoginError('エラー: ' + error.message);
          })
          .login(passcode);
      }

      /**
       * ログイン成功後に、役割に応じた画面と無操作時間の監視を用意する
       * @param {string} token GAS が発行したログイントークン
       * @param {string} role サーバー側で判定された役割
       * @return {void} 戻り値なし
       */
      function startLoginSession(token, role) {
        authToken = token;
        loginSessionId++;

        document.getElementById('login_passcode').value = '';
        showLoginError('');
        showScreen(role === ROLE_MANAGER ? 'manager' : 'employee');
        startIdleWatch(); // ログイン成功の時点から無操作時間を数え始める
      }

      /**
       * ログイン画面のエラー文言を出し分ける
       * @param {string} message 表示する文言（空文字で消す）
       * @return {void} 戻り値なし
       */
      function showLoginError(message) {
        document.getElementById('login_error').textContent = message;
      }

      /**
       * ログアウトの確認ダイアログを開く
       * @return {void} 戻り値なし
       */
      function openLogoutModal() {
        document.getElementById('logout_overlay').style.display = 'flex';
      }

      /**
       * ログアウトの確認ダイアログを閉じる（キャンセルのときは現在の画面に留まる）
       * @return {void} 戻り値なし
       */
      function closeLogoutModal() {
        document.getElementById('logout_overlay').style.display = 'none';
      }

      /**
       * ログアウトの確認ダイアログの背景クリックを受け取る
       * @param {Event} event クリックイベント
       * @return {void} 戻り値なし
       */
      function handleLogoutOverlayClick(event) {
        // 暗い背景そのものをクリックしたときだけ閉じる（モーダル本体のクリックは無視）
        if (event.target === event.currentTarget) {
          closeLogoutModal();
        }
      }

      /**
       * 確認ダイアログでログアウトが確定されたときの処理
       * @return {void} 戻り値なし
       */
      function confirmLogout() {
        closeLogoutModal();
        doLogout();
      }

      /**
       * ログイン状態と画面をログイン前に戻す（手動ログアウト・自動ログアウトの両方から呼ぶ）
       * 打刻の記録には一切触れないので、勤務中・休憩中の状態や保存済みデータは変わらない
       * @return {void} 戻り値なし
       */
      function doLogout() {
        const usedToken = authToken;
        authToken = '';
        loginSessionId++; // これ以降に遅れて届いた通信結果は画面へ反映しない

        stopIdleWatch();
        hideIdleNotice();
        closeAllModals();
        resetEmployeeScreen();
        resetManagerScreen();

        document.getElementById('login_passcode').value = '';
        showLoginError('');
        showScreen('login');

        // サーバー側のトークンも無効にする（結果は画面に影響しないので待たない）
        if (usedToken !== '') {
          google.script.run.logout(usedToken);
        }
      }

      /**
       * 開いているダイアログをすべて閉じる
       * @return {void} 戻り値なし
       */
      function closeAllModals() {
        const overlays = document.querySelectorAll('.modal-overlay');
        for (let i = 0; i < overlays.length; i++) {
          overlays[i].style.display = 'none';
        }
      }

      /**
       * 従業員画面の一時的な表示（選択中の従業員・打刻メッセージ・本日の業務）を消す
       * 打刻済みのデータには触れない
       * @return {void} 戻り値なし
       */
      function resetEmployeeScreen() {
        selectedEmpId = null;

        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove('selected');
        }

        if (clockIntervalId) {
          clearInterval(clockIntervalId);
          clockIntervalId = null;
        }

        document.getElementById('right_panel').style.display = 'none';
        document.getElementById('selected_emp_name').innerHTML = '';
        document.getElementById('record_message').innerHTML = '';
        hideTodayWorkCard();
      }

      /**
       * 店長画面の表示をダッシュボードに戻し、読み込み済みの内容を残さない
       * @return {void} 戻り値なし
       */
      function resetManagerScreen() {
        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let i = 0; i < navItems.length; i++) {
          const isDashboard = (navItems[i].dataset.section === 'dashboard');
          if (isDashboard) {
            navItems[i].classList.add('selected');
          } else {
            navItems[i].classList.remove('selected');
          }
        }

        const sections = document.querySelectorAll('.manager-section');
        for (let j = 0; j < sections.length; j++) {
          sections[j].style.display = (sections[j].id === 'section_dashboard') ? 'block' : 'none';
        }

        hideShiftDetail();
        shiftSelectedDate = null;
        ingredientBoard = null;
        document.getElementById('ingredient_body').style.display = 'none';
      }

      /**
       * 無操作時間の監視を始める
       * 始める前に必ず前のタイマーを止めるので、ログインを繰り返しても重複しない
       * @return {void} 戻り値なし
       */
      function startIdleWatch() {
        stopIdleWatch();
        lastActivityAt = Date.now();
        idleTimerId = setInterval(checkIdleTime, IDLE_CHECK_INTERVAL_MS);
      }

      /**
       * 無操作時間の監視を止める
       * @return {void} 戻り値なし
       */
      function stopIdleWatch() {
        if (idleTimerId) {
          clearInterval(idleTimerId);
          idleTimerId = null;
        }
      }

      /**
       * 最後の操作からの経過時間を調べ、予告通知と自動ログアウトを行う
       * 時刻の差で判定するため、途中で操作があっても数え間違えない
       * @return {void} 戻り値なし
       */
      function checkIdleTime() {
        if (authToken === '') {
          return;
        }

        const idleTime = Date.now() - lastActivityAt;
        if (idleTime >= IDLE_LOGOUT_MS) {
          doLogout(); // 確認ダイアログは出さずにパスコード入力画面へ戻す
          return;
        }
        if (idleTime >= IDLE_NOTICE_MS) {
          showIdleNotice();
        }
      }

      /**
       * 画面内の操作を受け取り、最後に操作した時刻を更新する
       * サーバーへは送らず、ブラウザ内だけで記録する
       * @param {boolean} isThrottled 回数を間引く操作（マウス移動）なら true
       * @return {void} 戻り値なし
       */
      function handleUserActivity(isThrottled) {
        if (authToken === '') {
          return;
        }

        const now = Date.now();
        // マウス移動は回数が多いので、前回の更新から一定時間あいたときだけ更新する
        if (isThrottled && (now - lastActivityAt) < ACTIVITY_UPDATE_INTERVAL_MS) {
          return;
        }

        lastActivityAt = now;
        if (isIdleNoticeShown) {
          hideIdleNotice(); // 通知が出ていたら操作ですぐ消し、この時点から数え直す
        }
      }

      /**
       * ログアウト予告の通知を表示する（すでに出ているときは何もしない）
       * @return {void} 戻り値なし
       */
      function showIdleNotice() {
        if (isIdleNoticeShown) {
          return;
        }
        isIdleNoticeShown = true;
        document.getElementById('idle_notice').classList.add('show');
      }

      /**
       * ログアウト予告の通知を消す
       * @return {void} 戻り値なし
       */
      function hideIdleNotice() {
        isIdleNoticeShown = false;
        document.getElementById('idle_notice').classList.remove('show');
      }

      /**
       * 通信を始めたときのログインが今も続いているかを調べる
       * ログアウト後に遅れて届いた結果で、以前の画面を出し直さないために使う
       * @param {number} sessionId 通信を始めた時点の loginSessionId
       * @return {boolean} 同じログインが続いていれば true
       */
      function isSameLoginSession(sessionId) {
        return authToken !== '' && sessionId === loginSessionId;
      }

      function selectEmployee(el) {
        selectedEmpId = el.dataset.empId;

        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove('selected');
        }
        el.classList.add('selected');

        document.getElementById('selected_emp_name').innerHTML = el.dataset.empName;
        document.getElementById('record_message').innerHTML = '';
        hideTodayWorkCard(); // 前の従業員の本日の業務情報を新しい従業員の画面に残さない
        document.getElementById('right_panel').style.display = 'block';
        startClock();
      }

      /**
       * 「本日の業務」カードを非表示にし、表示していたポジション・確認事項をクリアする
       * 従業員を切り替えた直後に必ず呼び出す
       */
      function hideTodayWorkCard() {
        document.getElementById('today_work_card').style.display = 'none';
        document.getElementById('today_work_card_body').innerHTML = '';
      }

      function startClock() {
        if (clockIntervalId) {
          clearInterval(clockIntervalId);
        }
        updateClock();
        clockIntervalId = setInterval(updateClock, 1000);
      }

      function updateClock() {
        const now = new Date();
        const pad = function (n) { return ('0' + n).slice(-2); };
        document.getElementById('current_time').innerHTML =
          pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function handleClockButtonClick(type) {
        if (!selectedEmpId) {
          return;
        }
        // 打刻ボタンを押した時点の従業員IDを保持しておく。本日の業務情報の取得が終わるまでの間に
        // 別の従業員へ選択が切り替えられても、この従業員ID宛の結果しか画面に反映しないようにするため
        const empIdAtClick = selectedEmpId;
        const sessionId = loginSessionId;
        document.getElementById('record_message').innerHTML = '登録中...';
        google.script.run
          .withSuccessHandler(function (message) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showRecordMessage(message);
            if (type === '出勤') {
              loadTodayWorkInfo(empIdAtClick);
            }
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showRecordError(error);
          })
          .recordClock(selectedEmpId, type);
      }

      function showRecordMessage(message) {
        document.getElementById('record_message').innerHTML = message;
      }

      function showRecordError(error) {
        document.getElementById('record_message').innerHTML = 'エラー: ' + error.message;
      }

      /**
       * 出勤成功後、本日の業務情報（ポジション・確認事項）を取得する
       * recordClock() 自体には手を加えず、打刻の成否とは別処理として扱う
       * 取得中に従業員が切り替えられていた場合は、結果が戻ってきても表示しない（安全のためのガード）
       */
      function loadTodayWorkInfo(empId) {
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (info) {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            renderTodayWorkCard(info);
          })
          .withFailureHandler(function () {
            if (!isSameLoginSession(sessionId) || selectedEmpId !== empId) {
              return;
            }
            showTodayWorkFetchError();
          })
          .getTodayWorkInfo(empId);
      }

      /**
       * 本日の業務カードへポジション・確認事項を描画する
       * ポジション・確認事項それぞれの有無に応じて表示内容を出し分ける
       */
      function renderTodayWorkCard(info) {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';

        const hasPosition = !!info.position;
        const hasNotices = info.notices && info.notices.length > 0;

        if (!hasPosition && !hasNotices) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'today-work-empty';
          emptyMsg.textContent = '本日の業務情報は登録されていません';
          body.appendChild(emptyMsg);
          card.style.display = 'block';
          return;
        }

        const positionLabel = document.createElement('div');
        positionLabel.className = 'today-work-label';
        positionLabel.textContent = '今日のポジション';
        body.appendChild(positionLabel);

        const positionValue = document.createElement('div');
        positionValue.className = 'today-work-position';
        positionValue.textContent = hasPosition ? info.position : '未設定';
        body.appendChild(positionValue);

        const noticesLabel = document.createElement('div');
        noticesLabel.className = 'today-work-label';
        noticesLabel.textContent = '確認事項';
        body.appendChild(noticesLabel);

        if (hasNotices) {
          const list = document.createElement('ul');
          list.className = 'today-work-notices-list';
          for (let i = 0; i < info.notices.length; i++) {
            const li = document.createElement('li');
            li.textContent = info.notices[i];
            list.appendChild(li);
          }
          body.appendChild(list);
        } else {
          const noNotice = document.createElement('div');
          noNotice.className = 'today-work-no-notice';
          noNotice.textContent = '本日の確認事項はありません';
          body.appendChild(noNotice);
        }

        card.style.display = 'block';
      }

      /**
       * 本日の業務情報の取得に失敗したことをカード内に表示する
       * 打刻自体は成功しているため、record_message（出勤の成功メッセージ）は書き換えない
       */
      function showTodayWorkFetchError() {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';
        const warning = document.createElement('div');
        warning.className = 'today-work-warning';
        warning.textContent = '⚠ 本日の業務情報を取得できませんでした';
        body.appendChild(warning);
        card.style.display = 'block';
      }

      function openAddEmployeeModal() {
        document.getElementById('add_last_name').value = '';
        document.getElementById('add_first_name').value = '';
        document.getElementById('add_employee_error').innerHTML = '';
        document.getElementById('add_employee_overlay').style.display = 'flex';
      }

      function closeAddEmployeeModal() {
        document.getElementById('add_employee_overlay').style.display = 'none';
      }

      function handleOverlayClick(event) {
        // 暗い背景そのものをクリックしたときだけ閉じる（モーダル本体のクリックは無視）
        if (event.target === event.currentTarget) {
          closeAddEmployeeModal();
        }
      }

      function submitAddEmployee() {
        const lastName = document.getElementById('add_last_name').value.trim();
        const firstName = document.getElementById('add_first_name').value.trim();
        const errorEl = document.getElementById('add_employee_error');

        if (lastName === '' || firstName === '') {
          errorEl.innerHTML = '姓と名を入力してください';
          return;
        }
        errorEl.innerHTML = '';

        const submitBtn = document.getElementById('add_employee_submit_btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '登録中...';

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function () {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            window.location.reload();
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            errorEl.innerHTML = error.message;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '登録';
          })
          .addEmployee(lastName, firstName);
      }

      /**
       * 店長画面のサイドバーで選ばれた機能をメイン領域に表示する
       * まだ実装していない機能は共通の「準備中」画面を見出しだけ差し替えて表示する
       */
      function showManagerSection(navItem) {
        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let i = 0; i < navItems.length; i++) {
          navItems[i].classList.remove('selected');
        }
        navItem.classList.add('selected');

        const sections = document.querySelectorAll('.manager-section');
        for (let j = 0; j < sections.length; j++) {
          sections[j].style.display = 'none';
        }

        const sectionName = navItem.dataset.section;
        if (sectionName === 'dashboard') {
          document.getElementById('section_dashboard').style.display = 'block';
          loadTodayWork(); // 開くたびに最新の本日の業務設定を読み直す
        } else if (sectionName === 'attendance') {
          document.getElementById('section_attendance').style.display = 'block';
          loadAttendances(); // 開くたびに最新の打刻を読み直す
        } else if (sectionName === 'skill') {
          document.getElementById('section_skill').style.display = 'block';
          loadSkills(); // 開くたびに最新のスキル情報を読み直す
        } else if (sectionName === 'shift') {
          document.getElementById('section_shift').style.display = 'block';
          loadShiftMonth(shiftYear, shiftMonth); // 開くたびに表示中の月のシフト状況を読み直す
        } else if (sectionName === 'ingredient') {
          document.getElementById('section_ingredient').style.display = 'block';
          loadIngredientBoard(); // 開くたびに最新の在庫・確認事項を読み直す
        } else {
          document.getElementById('preparing_heading').textContent = navItem.textContent;
          document.getElementById('section_preparing').style.display = 'block';
        }
      }

      /**
       * 店長ダッシュボードの本日の業務設定をサーバーから取得する
       */
      function loadTodayWork() {
        document.getElementById('today_work_table').style.display = 'none';
        showTodayWorkMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            renderTodayWork(result);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showTodayWorkError(error);
          })
          .getTodayWorkSettings(authToken);
      }

      /**

      function renderTodayWork(result) {

      /**
       * 本日の業務設定の1行分（氏名・ポジションselect・確認事項textarea・保存ボタン）を作る
       */
      function createTodayWorkRow(setting) {

      /**
       * 1人分の本日の業務（ポジション・確認事項）を保存する
       * 他の従業員の行には影響しない。保存ボタンを押した行だけをサーバーへ送信する

      function saveTodayWorkRow(empId, select, textarea, saveBtn, statusSpan) {

          .withSuccessHandler(function (message) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            saveBtn.disabled = false;
            statusSpan.textContent = message;
            statusSpan.classList.remove('error');
          })
          .withFailureHandler(function (error) {

            }

            statusSpan.textContent = 'エラー: ' + error.message;
            statusSpan.classList.add('error');

      function showTodayWorkError(error) {
        showTodayWorkMessage('エラー: ' + error.message, true);

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・従業員なし・エラー）を切り替える

      function showTodayWorkMessage(message, isError) {

        messageEl.textContent = message;

      /**
       * 本日の勤怠一覧をサーバーから取得する
       */
      function loadAttendances() {
        document.getElementById('attendance_reload_btn').disabled = true;
        document.getElementById('attendance_table').style.display = 'none';
        showAttendanceMessage('読み込み中...', false);

          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {

          .withFailureHandler(function (error) {

      /**
       * 取得した本日の勤怠一覧を表に描画する
       */
      function renderAttendances(result) {

      /**
       * 勤怠一覧のセルを作る

      function createAttendanceCell(text) {
        const cell = document.createElement('td');
        cell.textContent = text;
        if (text === UNRECORDED_LABEL) {
          cell.classList.add('unrecorded'); // 未打刻は店長がすぐ気付けるよう色を変える

      function showAttendanceError(error) {
        document.getElementById('attendance_reload_btn').disabled = false;
        document.getElementById('attendance_date').textContent = '';

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・打刻なし・エラー）を切り替える

      function showAttendanceMessage(message, isError) {

        if (isError) {

        } else {

      }

      // スキル項目・評価値（code.js の SKILL_ITEMS / SKILL_LEVELS と揃える）
      const SKILL_ITEMS = ['接客', 'レジ', 'バー', '厨房', '肉の仕込み', '締め作業'];
      const SKILL_LEVELS = ['◎', '○', '△', '×'];

      /**
       * 従業員スキル一覧をサーバーから取得する
       */
      function loadSkills() {
        document.getElementById('skill_table').style.display = 'none';
        showSkillMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (matrix) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            renderSkills(matrix);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showSkillError(error);
          })
          .getSkillMatrix(authToken);
      }

      /**
       * 取得したスキル一覧を表に描画する
       * 各行は select（◎/○/△/×）と、その行だけを保存する「保存」ボタンで構成する
       */
      function renderSkills(matrix) {
        const tbody = document.getElementById('skill_tbody');
        tbody.innerHTML = '';

        if (matrix.length === 0) {
          showSkillMessage('従業員名簿に従業員が登録されていません', false);
          return;
        }

        for (let i = 0; i < matrix.length; i++) {
          tbody.appendChild(createSkillRow(matrix[i]));
        }

        showSkillMessage('', false);
        document.getElementById('skill_table').style.display = 'table';
      }

      /**
       * スキル一覧の1行分（氏名・各スキルのselect＋更新日・保存ボタン）を作る
       * 評価と更新日は列を分けず、同じセルの中に縦に並べて表示する（画面が横に広がらないようにするため）
       */
      function createSkillRow(employeeSkill) {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        nameCell.textContent = employeeSkill.name;
        row.appendChild(nameCell);

        for (let i = 0; i < SKILL_ITEMS.length; i++) {
          const item = SKILL_ITEMS[i];
          const cell = document.createElement('td');
          cell.className = 'skill-cell';

          const select = document.createElement('select');
          for (let j = 0; j < SKILL_LEVELS.length; j++) {
            const option = document.createElement('option');
            option.value = SKILL_LEVELS[j];
            option.textContent = SKILL_LEVELS[j];
            select.appendChild(option);
          }
          select.value = employeeSkill.skills[item];
          select.dataset.skillItem = item;

          const dateLabel = document.createElement('div');
          dateLabel.className = 'skill-updated-at';
          dateLabel.dataset.skillItem = item;
          dateLabel.textContent = formatSkillUpdatedAtLabel(employeeSkill.updatedAt[item]);

          cell.appendChild(select);
          cell.appendChild(dateLabel);
          row.appendChild(cell);
        }

        const actionCell = document.createElement('td');
        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'skill-save-btn';
        saveBtn.textContent = '保存';
        const statusSpan = document.createElement('span');
        statusSpan.className = 'skill-row-status';
        saveBtn.addEventListener('click', function () {
          saveSkillRow(employeeSkill.id, row, saveBtn, statusSpan);
        });
        actionCell.appendChild(saveBtn);
        actionCell.appendChild(statusSpan);
        row.appendChild(actionCell);

        return row;
      }

      /**
       * 更新日（'yyyy/MM/dd'形式、未保存なら空文字）を「更新：8/19」のような表示用文字列にする
       */
      function formatSkillUpdatedAtLabel(dateStr) {
        if (!dateStr) {
          return '更新：-';
        }
        const parts = dateStr.split('/');
        if (parts.length !== 3) {
          return '更新：-';
        }
        return '更新：' + Number(parts[1]) + '/' + Number(parts[2]);
      }

      /**
       * 1行分のスキル評価をまとめて保存する
       * selectを変更しただけでは保存されず、この「保存」ボタンを押した時点でまとめて送信する
       */
      function saveSkillRow(empId, row, saveBtn, statusSpan) {
        const selects = row.querySelectorAll('select');
        const skillValues = [];
        for (let i = 0; i < selects.length; i++) {
          skillValues.push(selects[i].value);
        }

        saveBtn.disabled = true;
        statusSpan.textContent = '保存中...';
        statusSpan.classList.remove('error');

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            saveBtn.disabled = false;
            statusSpan.textContent = result.message;
            statusSpan.classList.remove('error');
            updateSkillRowDates(row, result.updatedAt);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            saveBtn.disabled = false;
            statusSpan.textContent = 'エラー: ' + error.message;
            statusSpan.classList.add('error');
          })
          .saveEmployeeSkills(empId, skillValues, authToken);
      }

      /**
       * 保存後、サーバーから返ってきた最新の更新日で行内の表示を書き換える
       * （評価が変わっていない項目の更新日はサーバー側でも変更されていないので、そのまま同じ日付が返る）
       */
      function updateSkillRowDates(row, updatedAt) {
        const dateLabels = row.querySelectorAll('.skill-updated-at');
        for (let i = 0; i < dateLabels.length; i++) {
          const item = dateLabels[i].dataset.skillItem;
          dateLabels[i].textContent = formatSkillUpdatedAtLabel(updatedAt[item]);
        }
      }

      function showSkillError(error) {
        showSkillMessage('エラー: ' + error.message, true);
      }

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・従業員なし・エラー）を切り替える
       */
      function showSkillMessage(message, isError) {
        const messageEl = document.getElementById('skill_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      // 店長画面：シフト作成
      // カレンダーで表示中の年月。初回はサーバーが返す今日の年月に合わせるため null から始める
      let shiftYear = null;
      let shiftMonth = null;
      let shiftSelectedDate = null; // 選択中の日付キー（'yyyy/MM/dd'）
      let shiftMonthDays = {}; // 日付キーごとの { status, warnings }
      let shiftTodayKey = ''; // サーバー側で判定した今日の日付キー
      let shiftDayEmployees = []; // 編集欄の従業員selectに出す一覧
      let shiftDayRequestId = 0; // 日別データの取得が前後したとき、古い結果を捨てるための番号
      let isShiftSaving = false; // 二重保存を防ぐ

      const SHIFT_WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

      /**
       * 指定した年月のシフト状況（日付ごとの状態と確認事項）をサーバーから取得する
       * year・month に null を渡した場合は、サーバー側で今日を含む月が選ばれる
       */
      function loadShiftMonth(year, month) {
        setShiftMonthButtonsDisabled(true);
        showShiftMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            setShiftMonthButtonsDisabled(false);
            shiftYear = result.year;
            shiftMonth = result.month;
            shiftTodayKey = result.today;
            shiftMonthDays = result.days;

            // 表示中の月から外れた日付を選んだままにしない
            if (shiftSelectedDate !== null &&
                shiftSelectedDate.indexOf(buildShiftMonthPrefix(result.year, result.month)) !== 0) {
              shiftSelectedDate = null;
              hideShiftDetail();
            }

            showShiftMessage('', false);
            renderShiftCalendar();
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            // 通信に失敗しても前月・翌月ボタンは押せる状態に戻す（表示中の年月は変更しない）
            setShiftMonthButtonsDisabled(false);
            showShiftMessage('エラー: ' + error.message, true);
          })
          .getShiftMonth(year, month, authToken);
      }

      function setShiftMonthButtonsDisabled(disabled) {
        document.getElementById('shift_prev_btn').disabled = disabled;
        document.getElementById('shift_next_btn').disabled = disabled;
      }

      /**
       * 前月・翌月ボタンで表示月を切り替え、その月のデータを取り直す
       */
      function changeShiftMonth(offset) {
        if (shiftYear === null || shiftMonth === null) {
          // 最初の読み込みに失敗して表示中の年月が分からない状態。
          // ボタンが何も起きないまま終わらないよう、今月の取得からやり直す
          loadShiftMonth(null, null);
          return;
        }
        let nextYear = shiftYear;
        let nextMonth = shiftMonth + offset;
        if (nextMonth < 1) {
          nextMonth = 12;
          nextYear = nextYear - 1;
        } else if (nextMonth > 12) {
          nextMonth = 1;
          nextYear = nextYear + 1;
        }
        loadShiftMonth(nextYear, nextMonth);
      }

      function buildShiftMonthPrefix(year, month) {
        return year + '/' + ('0' + month).slice(-2) + '/';
      }

      function buildShiftDateKey(year, month, day) {
        return buildShiftMonthPrefix(year, month) + ('0' + day).slice(-2);
      }

      /**
       * 表示中の月の日付セルを日曜〜土曜の7列で描画する
       * 月初より前・月末より後のセルは空欄にする
       */
      function renderShiftCalendar() {
        document.getElementById('shift_month_label').textContent = shiftYear + '年' + shiftMonth + '月';

        const calendar = document.getElementById('shift_calendar');
        calendar.innerHTML = '';

        const firstWeekday = new Date(shiftYear, shiftMonth - 1, 1).getDay(); // 0=日曜
        const lastDay = new Date(shiftYear, shiftMonth, 0).getDate(); // 翌月0日＝当月末日
        const cellCount = Math.ceil((firstWeekday + lastDay) / 7) * 7;

        for (let i = 0; i < cellCount; i++) {
          const day = i - firstWeekday + 1;
          if (day < 1 || day > lastDay) {
            const empty = document.createElement('div');
            empty.className = 'shift-day-empty';
            calendar.appendChild(empty);
            continue;
          }
          calendar.appendChild(createShiftDayCell(day, i % 7));
        }
      }

      /**
       * 日付セル1つ分（日付・状態の印・要確認の吹き出し）を作る
       */
      function createShiftDayCell(day, weekdayIndex) {
        const dateKey = buildShiftDateKey(shiftYear, shiftMonth, day);
        const dayData = shiftMonthDays[dateKey];
        const status = dayData ? dayData.status : 'uncreated';
        const warnings = (dayData && dayData.warnings) ? dayData.warnings : [];

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'shift-day-cell';
        cell.dataset.dateKey = dateKey;
        if (status === 'warning') {
          cell.classList.add('warning');
        }
        if (dateKey === shiftTodayKey) {
          cell.classList.add('today');
        }
        const isSelected = (dateKey === shiftSelectedDate);
        if (isSelected) {
          cell.classList.add('selected');
        }
        cell.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        cell.setAttribute('aria-label', shiftMonth + '月' + day + '日 ' + getShiftStatusText(status, warnings.length));

        const number = document.createElement('span');
        number.className = 'shift-day-number';
        number.textContent = String(day);
        cell.appendChild(number);

        const statusBox = document.createElement('span');
        statusBox.className = 'shift-day-status';

        const mark = document.createElement('span');
        mark.className = 'shift-mark shift-mark-' + status;
        mark.textContent = getShiftMarkText(status);
        statusBox.appendChild(mark);

        const label = document.createElement('span');
        label.className = 'shift-day-label';
        label.textContent = getShiftLabelText(status, warnings.length);
        statusBox.appendChild(label);

        cell.appendChild(statusBox);

        if (status === 'warning') {
          const tooltip = createShiftTooltip(dateKey, warnings, weekdayIndex);
          cell.setAttribute('aria-describedby', tooltip.id);
          cell.appendChild(tooltip);
        }

        cell.addEventListener('click', function () {
          selectShiftDate(dateKey);
        });

        return cell;
      }

      function getShiftMarkText(status) {
        if (status === 'ok') {
          return '○';
        }
        if (status === 'warning') {
          return '△！';
        }
        return '—';
      }

      function getShiftLabelText(status, warningCount) {
        if (status === 'warning') {
          return warningCount + '件';
        }
        if (status === 'uncreated') {
          return '未作成';
        }
        return '';
      }

      function getShiftStatusText(status, warningCount) {
        if (status === 'ok') {
          return '作成済み・問題なし';
        }
        if (status === 'warning') {
          return '要確認 ' + warningCount + '件';
        }
        return '未作成';
      }

      /**
       * 要確認の日に付ける吹き出しを作る
       * セルは button なので、マウスを乗せたときだけでなくキーボードでフォーカスしたときにも表示される
       */
      function createShiftTooltip(dateKey, warnings, weekdayIndex) {
        const tooltip = document.createElement('span');
        tooltip.className = 'shift-tooltip';
        tooltip.id = 'shift_tooltip_' + dateKey.replace(/\//g, '');
        tooltip.setAttribute('role', 'tooltip');
        if (weekdayIndex === 0) {
          tooltip.classList.add('shift-tooltip-start'); // 日曜の列は左端に寄せる
        } else if (weekdayIndex === 6) {
          tooltip.classList.add('shift-tooltip-end'); // 土曜の列は右端に寄せる
        }
        for (let i = 0; i < warnings.length; i++) {
          tooltip.appendChild(createShiftWarningItem(warnings[i]));
        }
        return tooltip;
      }

      /**
       * 確認事項1件分（時間帯・内容・理由）を作る
       * button の中（吹き出し）にも置けるよう、div ではなく span で組み立てる
       */
      function createShiftWarningItem(warning) {
        const item = document.createElement('span');
        item.className = 'shift-warning-item';

        const time = document.createElement('span');
        time.className = 'shift-warning-time';
        time.textContent = warning.time;
        item.appendChild(time);

        const title = document.createElement('span');
        title.className = 'shift-warning-title';
        title.textContent = warning.title;
        item.appendChild(title);

        const reason = document.createElement('span');
        reason.className = 'shift-warning-reason';
        reason.textContent = warning.reason;
        item.appendChild(reason);

        return item;
      }

      /**
       * 日付を選択状態にし、その日の編集欄を読み込む
       */
      function selectShiftDate(dateKey) {
        shiftSelectedDate = dateKey;

        const cells = document.querySelectorAll('.shift-day-cell');
        for (let i = 0; i < cells.length; i++) {
          const isSelected = (cells[i].dataset.dateKey === dateKey);
          if (isSelected) {
            cells[i].classList.add('selected');
          } else {
            cells[i].classList.remove('selected');
          }
          cells[i].setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        }

        loadShiftDay(dateKey);
      }

      /**
       * 選択した日のシフト割当・必要人数条件・従業員一覧をサーバーから取得する
       * 取得中に別の日付へ切り替えられた場合は、戻ってきた結果を反映しない
       */
      function loadShiftDay(dateKey) {
        shiftDayRequestId++;
        const requestId = shiftDayRequestId;
        const sessionId = loginSessionId;

        document.getElementById('shift_detail').style.display = 'block';
        document.getElementById('shift_detail_body').style.display = 'none';
        document.getElementById('shift_detail_heading').textContent = formatShiftDateLabel(dateKey) + 'のシフト';
        document.getElementById('shift_detail_warnings').innerHTML = '';
        showShiftDetailMessage('読み込み中...', false);
        showShiftSaveStatus('', false);

        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId) || requestId !== shiftDayRequestId) {
              return;
            }
            renderShiftDay(result);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId) || requestId !== shiftDayRequestId) {
              return;
            }
            showShiftDetailMessage('エラー: ' + error.message, true);
          })
          .getShiftDay(dateKey, authToken);
      }

      /**
       * 取得した1日分のシフトを編集欄に描画する
       */
      function renderShiftDay(result) {
        shiftDayEmployees = result.employees;
        renderShiftWarnings(result.warnings);

        const assignmentTbody = document.getElementById('shift_assignment_tbody');
        assignmentTbody.innerHTML = '';
        for (let i = 0; i < result.assignments.length; i++) {
          assignmentTbody.appendChild(createShiftAssignmentRow(result.assignments[i]));
        }
        refreshShiftEmptyRow(assignmentTbody, 6, 'シフトの割当はまだありません');

        const requirementTbody = document.getElementById('shift_requirement_tbody');
        requirementTbody.innerHTML = '';
        for (let r = 0; r < result.requirements.length; r++) {
          requirementTbody.appendChild(createShiftRequirementRow(result.requirements[r]));
        }
        refreshShiftEmptyRow(requirementTbody, 5, '必要人数条件はまだありません');

        showShiftDetailMessage('', false);
        document.getElementById('shift_detail_body').style.display = 'block';
      }

      /**
       * 確認事項を編集欄にも表示する
       * ホバーできない環境では吹き出しを読めないため、同じ内容をここに出す
       */
      function renderShiftWarnings(warnings) {
        const container = document.getElementById('shift_detail_warnings');
        container.innerHTML = '';
        if (!warnings || warnings.length === 0) {
          return;
        }

        const heading = document.createElement('div');
        heading.className = 'shift-warning-heading';
        heading.textContent = '確認事項（' + warnings.length + '件）';
        container.appendChild(heading);

        for (let i = 0; i < warnings.length; i++) {
          container.appendChild(createShiftWarningItem(warnings[i]));
        }
      }

      /**
       * 行が1件も無いときだけ、表に「まだありません」の1行を出す
       */
      function refreshShiftEmptyRow(tbody, columnCount, message) {
        const emptyRow = tbody.querySelector('.shift-empty-row');
        const hasRow = (tbody.querySelector('.shift-row') !== null);

        if (hasRow) {
          if (emptyRow) {
            tbody.removeChild(emptyRow);
          }
          return;
        }
        if (emptyRow) {
          return;
        }

        const row = document.createElement('tr');
        row.className = 'shift-empty-row';
        const cell = document.createElement('td');
        cell.className = 'shift-table-empty';
        cell.colSpan = columnCount;
        cell.textContent = message;
        row.appendChild(cell);
        tbody.appendChild(row);
      }

      /**
       * シフト割当の1行分（従業員・出勤・退勤・ポジション・備考・削除）を作る
       */
      function createShiftAssignmentRow(assignment) {
        const row = document.createElement('tr');
        row.className = 'shift-row';

        const employeeOptions = [];
        for (let i = 0; i < shiftDayEmployees.length; i++) {
          employeeOptions.push({
            'value': String(shiftDayEmployees[i].id),
            'label': shiftDayEmployees[i].name
          });
        }

        row.appendChild(createShiftCell(
          createShiftSelect('shift-employee-select', employeeOptions, assignment.employeeId, '未選択')));
        row.appendChild(createShiftCell(createShiftTimeInput('shift-start-time', assignment.startTime)));
        row.appendChild(createShiftCell(createShiftTimeInput('shift-end-time', assignment.endTime)));
        row.appendChild(createShiftCell(
          createShiftSelect('shift-position-select', getShiftPositionOptions(), assignment.position, '未選択')));

        const noteInput = document.createElement('input');
        noteInput.type = 'text';
        noteInput.className = 'shift-note-input';
        noteInput.value = assignment.note;
        row.appendChild(createShiftCell(noteInput));

        row.appendChild(createShiftCell(
          createShiftDeleteButton(row, 6, 'シフトの割当はまだありません')));

        return row;
      }

      /**
       * 必要人数条件の1行分（開始・終了・ポジション・必要人数・削除）を作る
       */
      function createShiftRequirementRow(requirement) {
        const row = document.createElement('tr');
        row.className = 'shift-row';

        row.appendChild(createShiftCell(createShiftTimeInput('shift-requirement-start-time', requirement.startTime)));
        row.appendChild(createShiftCell(createShiftTimeInput('shift-requirement-end-time', requirement.endTime)));
        row.appendChild(createShiftCell(
          createShiftSelect('shift-requirement-position-select', getShiftPositionOptions(), requirement.position, '未選択')));

        const countInput = document.createElement('input');
        countInput.type = 'number';
        countInput.className = 'shift-required-count-input';
        countInput.min = '1';
        countInput.step = '1';
        countInput.value = String(requirement.requiredCount);
        row.appendChild(createShiftCell(countInput));

        row.appendChild(createShiftCell(
          createShiftDeleteButton(row, 5, '必要人数条件はまだありません')));

        return row;
      }

      function createShiftCell(child) {
        const cell = document.createElement('td');
        cell.appendChild(child);
        return cell;
      }

      function createShiftTimeInput(className, value) {
        const input = document.createElement('input');
        input.type = 'time';
        input.className = className;
        input.value = value;
        return input;
      }

      function getShiftPositionOptions() {
        const options = [];
        for (let i = 0; i < POSITION_ITEMS.length; i++) {
          options.push({ 'value': POSITION_ITEMS[i], 'label': POSITION_ITEMS[i] });
        }
        return options;
      }

      /**
       * 選択肢のselectを作る
       * 保存済みの値が選択肢に無い場合（名簿から消えた従業員など）は、その値の選択肢を足して
       * 画面を開いただけで内容が別の値に変わってしまわないようにする
       */
      function createShiftSelect(className, options, selectedValue, placeholder) {
        const select = document.createElement('select');
        select.className = className;
        const currentValue = selectedValue ? String(selectedValue) : '';

        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = placeholder;
        select.appendChild(emptyOption);

        let hasCurrentValue = false;
        for (let i = 0; i < options.length; i++) {
          const option = document.createElement('option');
          option.value = options[i].value;
          option.textContent = options[i].label;
          select.appendChild(option);
          if (options[i].value === currentValue) {
            hasCurrentValue = true;
          }
        }

        if (currentValue !== '' && !hasCurrentValue) {
          const unknownOption = document.createElement('option');
          unknownOption.value = currentValue;
          unknownOption.textContent = currentValue + '（選択肢にありません）';
          select.appendChild(unknownOption);
        }

        select.value = currentValue;
        return select;
      }

      function createShiftDeleteButton(row, columnCount, emptyMessage) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'shift-delete-btn';
        button.textContent = '削除';
        button.addEventListener('click', function () {
          const tbody = row.parentNode;
          tbody.removeChild(row);
          refreshShiftEmptyRow(tbody, columnCount, emptyMessage);
        });
        return button;
      }

      function addShiftAssignmentRow() {
        const tbody = document.getElementById('shift_assignment_tbody');
        tbody.appendChild(createShiftAssignmentRow({
          'employeeId': '',
          'startTime': '',
          'endTime': '',
          'position': '',
          'note': ''
        }));
        refreshShiftEmptyRow(tbody, 6, 'シフトの割当はまだありません');
      }

      function addShiftRequirementRow() {
        const tbody = document.getElementById('shift_requirement_tbody');
        tbody.appendChild(createShiftRequirementRow({
          'startTime': '',
          'endTime': '',
          'position': '',
          'requiredCount': 1
        }));
        refreshShiftEmptyRow(tbody, 5, '必要人数条件はまだありません');
      }

      function collectShiftAssignments() {
        const rows = document.getElementById('shift_assignment_tbody').querySelectorAll('.shift-row');
        const assignments = [];
        for (let i = 0; i < rows.length; i++) {
          assignments.push({
            'employeeId': rows[i].querySelector('.shift-employee-select').value,
            'startTime': rows[i].querySelector('.shift-start-time').value,
            'endTime': rows[i].querySelector('.shift-end-time').value,
            'position': rows[i].querySelector('.shift-position-select').value,
            'note': rows[i].querySelector('.shift-note-input').value
          });
        }
        return assignments;
      }

      function collectShiftRequirements() {
        const rows = document.getElementById('shift_requirement_tbody').querySelectorAll('.shift-row');
        const requirements = [];
        for (let i = 0; i < rows.length; i++) {
          requirements.push({
            'startTime': rows[i].querySelector('.shift-requirement-start-time').value,
            'endTime': rows[i].querySelector('.shift-requirement-end-time').value,
            'position': rows[i].querySelector('.shift-requirement-position-select').value,
            'requiredCount': rows[i].querySelector('.shift-required-count-input').value
          });
        }
        return requirements;
      }

      /**
       * 保存前にブラウザ側でも入力を確認する（同じ内容をサーバー側でも検証する）
       * 問題があればエラーメッセージ、問題が無ければ空文字を返す
       * 人員不足や勤務時間の重複は保存できる確認事項なので、ここでは止めない
       */
      function validateShiftRowsOnClient(assignments, requirements) {
        for (let i = 0; i < assignments.length; i++) {
          const label = 'シフト割当' + (i + 1) + '行目：';
          if (assignments[i].employeeId === '') {
            return label + '従業員を選択してください';
          }
          if (assignments[i].position === '') {
            return label + 'ポジションを選択してください';
          }
          if (assignments[i].startTime === '') {
            return label + '出勤時刻を入力してください';
          }
          if (assignments[i].endTime === '') {
            return label + '退勤時刻を入力してください';
          }
          // 'HH:mm' は桁が揃っているので、文字列のまま比較しても時刻の前後を判定できる
          if (assignments[i].startTime >= assignments[i].endTime) {
            return label + '出勤時刻は退勤時刻より前にしてください';
          }
        }

        for (let r = 0; r < requirements.length; r++) {
          const label = '必要人数条件' + (r + 1) + '行目：';
          if (requirements[r].position === '') {
            return label + 'ポジションを選択してください';
          }
          if (requirements[r].startTime === '') {
            return label + '開始時刻を入力してください';
          }
          if (requirements[r].endTime === '') {
            return label + '終了時刻を入力してください';
          }
          if (requirements[r].startTime >= requirements[r].endTime) {
            return label + '開始時刻は終了時刻より前にしてください';
          }
          const requiredCount = Number(requirements[r].requiredCount);
          if (!isFinite(requiredCount) || Math.floor(requiredCount) !== requiredCount || requiredCount < 1) {
            return label + '必要人数は1以上の整数で入力してください';
          }
        }

        return '';
      }

      /**
       * 選択中の日のシフトをまとめて保存する
       * 保存中はボタンを無効化し、保存が終わったら表示中の月を取り直して印を更新する
       */
      function submitShiftDay() {
        if (isShiftSaving || shiftSelectedDate === null) {
          return;
        }

        const assignments = collectShiftAssignments();
        const requirements = collectShiftRequirements();
        const errorMessage = validateShiftRowsOnClient(assignments, requirements);
        if (errorMessage !== '') {
          showShiftSaveStatus(errorMessage, true);
          return;
        }

        isShiftSaving = true;
        const saveBtn = document.getElementById('shift_save_btn');
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';
        showShiftSaveStatus('', false);

        const savedDateKey = shiftSelectedDate;
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            finishShiftSaving();
            showShiftSaveStatus(result.message, false);
            // 保存した日の確認事項と、カレンダーの印（○／△！）を最新の内容に更新する
            if (shiftSelectedDate === savedDateKey) {
              renderShiftWarnings(result.warnings);
            }
            loadShiftMonth(shiftYear, shiftMonth);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            finishShiftSaving();
            showShiftSaveStatus('エラー: ' + error.message, true);
          })
          .saveShiftDay(savedDateKey, assignments, requirements, authToken);
      }

      function finishShiftSaving() {
        isShiftSaving = false;
        const saveBtn = document.getElementById('shift_save_btn');
        saveBtn.disabled = false;
        saveBtn.textContent = 'この日のシフトを保存';
      }

      function hideShiftDetail() {
        document.getElementById('shift_detail').style.display = 'none';
        document.getElementById('shift_detail_body').style.display = 'none';
        document.getElementById('shift_detail_warnings').innerHTML = '';
        document.getElementById('shift_assignment_tbody').innerHTML = '';
        document.getElementById('shift_requirement_tbody').innerHTML = '';
        showShiftSaveStatus('', false);
      }

      /**
       * 日付キー（'yyyy/MM/dd'）を「2026年9月2日（水）」のような表示用文字列にする
       */
      function formatShiftDateLabel(dateKey) {
        const parts = dateKey.split('/');
        const year = Number(parts[0]);
        const month = Number(parts[1]);
        const day = Number(parts[2]);
        const weekday = SHIFT_WEEKDAY_LABELS[new Date(year, month - 1, day).getDay()];
        return year + '年' + month + '月' + day + '日（' + weekday + '）';
      }

      /**
       * カレンダーの上に出す一行メッセージ（読み込み中・エラー）を切り替える
       */
      function showShiftMessage(message, isError) {
        const messageEl = document.getElementById('shift_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 編集欄の代わりに出す一行メッセージ（読み込み中・エラー）を切り替える
       */
      function showShiftDetailMessage(message, isError) {
        const messageEl = document.getElementById('shift_detail_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 保存ボタンの横に出す状態（保存中・完了・エラー）を切り替える
       */
      function showShiftSaveStatus(message, isError) {
        const statusEl = document.getElementById('shift_save_status');
        statusEl.textContent = message;
        if (isError) {
          statusEl.classList.add('error');
        } else {
          statusEl.classList.remove('error');
        }
      }

      // 店長画面：食材管理
      // サーバーから受け取った最新の食材管理情報。保存のたびに丸ごと入れ替える
      let ingredientBoard = null;
      // 表示中のタブ（原材料／仕込み済み）と保存状態の絞り込み（空文字はすべて）
      let ingredientCategory = '原材料';
      let ingredientStorageFilter = '';
      // 操作ごとの「操作キー」。再送しても在庫が二重に動かないよう、保存が成功するまで同じ値を使う
      const ingredientOperationKeys = {};
      // 各モーダルが対象にしている在庫明細
      let ingredientTargetLot = null;

      /**
       * 食材管理の情報をサーバーから取得する
       */
      function loadIngredientBoard() {
        document.getElementById('ingredient_reload_btn').disabled = true;
        showIngredientMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (board) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            document.getElementById('ingredient_reload_btn').disabled = false;
            showIngredientMessage('', false);
            applyIngredientBoard(board);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            document.getElementById('ingredient_reload_btn').disabled = false;
            document.getElementById('ingredient_body').style.display = 'none';
            showIngredientMessage('エラー: ' + error.message, true);
          })
          .getIngredientBoard(authToken);
      }

      /**
       * 受け取った食材管理情報で画面を作り直す
       */
      function applyIngredientBoard(board) {
        ingredientBoard = board;
        document.getElementById('ingredient_body').style.display = 'block';
        renderIngredientAlerts();
        renderIngredientTable();
      }

      function showIngredientMessage(message, isError) {
        const messageEl = document.getElementById('ingredient_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 画面上部の確認事項（期限未設定・期限接近・残量不足・発注）を描画する
       * 色だけで区別せず、見出しと本文の言葉でも状態が分かるようにする
       */
      function renderIngredientAlerts() {
        const container = document.getElementById('ingredient_alerts');
        container.innerHTML = '';

        const groups = [
          { 'key': 'expiryUnset', 'title': '期限が未設定・不明', 'level': 'check' },
          { 'key': 'expiryNear', 'title': '期限切れ・期限が近い', 'level': 'warning' },
          { 'key': 'lowStock', 'title': '残量不足', 'level': 'warning' },
          { 'key': 'order', 'title': '発注の確認', 'level': 'info' },
          { 'key': 'pending', 'title': '保存が完了していない明細', 'level': 'warning' }
        ];

        let total = 0;
        for (let i = 0; i < groups.length; i++) {
          const items = ingredientBoard.alerts[groups[i].key] || [];
          if (items.length === 0) {
            continue;
          }
          total = total + items.length;
          container.appendChild(createIngredientAlertCard(groups[i], items));
        }

        if (total === 0) {
          const emptyCard = document.createElement('div');
          emptyCard.className = 'ingredient-alert-card ingredient-alert-none';
          emptyCard.textContent = '確認が必要な食材はありません（' + ingredientBoard.nowText + ' 時点）';
          container.appendChild(emptyCard);
        }
      }

      /**
       * 確認事項の1グループ分のカードを作る
       */
      function createIngredientAlertCard(group, items) {
        const card = document.createElement('div');
        card.className = 'ingredient-alert-card ingredient-alert-' + group.level;

        const heading = document.createElement('div');
        heading.className = 'ingredient-alert-heading';
        heading.textContent = group.title + '：' + items.length + '件';
        card.appendChild(heading);

        const list = document.createElement('ul');
        list.className = 'ingredient-alert-list';
        for (let i = 0; i < items.length; i++) {
          const item = document.createElement('li');
          const title = document.createElement('span');
          title.className = 'ingredient-alert-title';
          title.textContent = items[i].title;
          item.appendChild(title);
          const detail = document.createElement('span');
          detail.className = 'ingredient-alert-detail';
          detail.textContent = items[i].detail;
          item.appendChild(detail);

          // 発注の記録は、誤って登録したときに取り消せるようにする（在庫は動かない）
          if (group.key === 'order' && items[i].orderId) {
            const orderId = items[i].orderId;
            item.appendChild(createIngredientRowButton('発注の記録を取り消す', function () {
              cancelIngredientOrderRecord(orderId);
            }));
          }
          list.appendChild(item);
        }
        card.appendChild(list);
        return card;
      }

      /**
       * 発注の記録を取り消す（実際の注文には関係せず、在庫も増減しない）
       */
      function cancelIngredientOrderRecord(orderId) {
        showIngredientMessage('発注の記録を取り消しています...', false);
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            applyIngredientBoard(result.board);
            showIngredientMessage(result.message, false);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showIngredientMessage('エラー: ' + error.message, true);
          })
          .cancelIngredientOrder({
            'operationKey': createIngredientOperationKey(),
            'orderId': orderId,
            'actorEmpId': selectedEmpId ? String(selectedEmpId) : '',
            'authToken': authToken
          });
      }

      /**
       * タブと絞り込みに合う在庫明細だけを取り出す
       */
      function getIngredientVisibleLots() {
        const lots = [];
        for (let i = 0; i < ingredientBoard.lots.length; i++) {
          const lot = ingredientBoard.lots[i];
          if (lot.category !== ingredientCategory) {
            continue;
          }
          if (ingredientStorageFilter !== '' && lot.storageState !== ingredientStorageFilter) {
            continue;
          }
          lots.push(lot);
        }
        return lots;
      }

      /**
       * 在庫一覧の表を描画する（原材料と仕込み済みで列の構成が変わる）
       */
      function renderIngredientTable() {
        const thead = document.getElementById('ingredient_thead');
        const tbody = document.getElementById('ingredient_tbody');
        thead.innerHTML = '';
        tbody.innerHTML = '';

        const isRawMaterial = (ingredientCategory === '原材料');
        const columns = isRawMaterial
          ? ['食材名', '残量の目安', '保存状態', '表示期限／使用期限', '冷凍した日時', '操作']
          : ['食材名', '残量の目安', '仕込み日時', '使用期限', '保存状態', '確認事項', '操作'];

        const headRow = document.createElement('tr');
        for (let i = 0; i < columns.length; i++) {
          const th = document.createElement('th');
          th.textContent = columns[i];
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);

        const lots = getIngredientVisibleLots();
        const listMessage = document.getElementById('ingredient_list_message');
        if (lots.length === 0) {
          document.getElementById('ingredient_table').style.display = 'none';
          listMessage.textContent = '表示できる在庫がありません。「入荷を記録」「仕込みを記録」から登録してください';
          listMessage.classList.remove('error');
          return;
        }
        listMessage.textContent = '';

        for (let i = 0; i < lots.length; i++) {
          tbody.appendChild(createIngredientRow(lots[i], isRawMaterial));
        }
        document.getElementById('ingredient_table').style.display = 'table';
      }

      /**
       * 在庫一覧の1行分を作る
       */
      function createIngredientRow(lot, isRawMaterial) {
        const row = document.createElement('tr');
        row.appendChild(createIngredientNameCell(lot));
        row.appendChild(createIngredientTextCell(lot.quantityText));

        if (isRawMaterial) {
          row.appendChild(createIngredientTextCell(lot.storageState));
          row.appendChild(createIngredientExpiryCell(lot));
          row.appendChild(createIngredientTextCell(lot.frozenText));
        } else {
          row.appendChild(createIngredientTextCell(lot.preparedAtText));
          row.appendChild(createIngredientExpiryCell(lot));
          row.appendChild(createIngredientTextCell(lot.storageState));
          row.appendChild(createIngredientIssueCell(lot));
        }
        row.appendChild(createIngredientActionCell(lot));
        return row;
      }

      function createIngredientTextCell(text) {
        const cell = document.createElement('td');
        cell.textContent = (text === '' || text === undefined || text === null) ? '-' : text;
        return cell;
      }

      /**
       * 食材名のセル。原材料一覧では確認事項も小さく添える
       */
      function createIngredientNameCell(lot) {
        const cell = document.createElement('td');
        const name = document.createElement('div');
        name.className = 'ingredient-name';
        name.textContent = lot.name;
        cell.appendChild(name);

        if (ingredientCategory === '原材料' && lot.issues.length > 0) {
          const note = document.createElement('div');
          note.className = 'ingredient-row-issue';
          note.textContent = lot.issues.join(' / ');
          cell.appendChild(note);
        }
        return cell;
      }

      /**
       * 期限のセル。状態は色だけでなく文言でも示す
       */
      function createIngredientExpiryCell(lot) {
        const cell = document.createElement('td');
        const label = document.createElement('span');
        label.className = 'ingredient-expiry ingredient-expiry-' + getIngredientExpiryClass(lot.expiry.state);
        label.textContent = lot.expiry.label;
        cell.appendChild(label);
        return cell;
      }

      function getIngredientExpiryClass(state) {
        if (state === '期限切れ') {
          return 'expired';
        }
        if (state === '期限接近') {
          return 'soon';
        }
        if (state === '要確認') {
          return 'unknown';
        }
        return 'ok';
      }

      function createIngredientIssueCell(lot) {
        const cell = document.createElement('td');
        cell.textContent = lot.issues.length === 0 ? '特になし' : lot.issues.join(' / ');
        if (lot.issues.length > 0) {
          cell.classList.add('ingredient-row-issue');
        }
        return cell;
      }

      /**
       * 操作ボタン（残量更新・詳細・冷凍／解凍）のセルを作る
       */
      function createIngredientActionCell(lot) {
        const cell = document.createElement('td');
        cell.className = 'ingredient-action-cell';

        cell.appendChild(createIngredientRowButton('残量更新', function () {
          openIngredientAmountModal(lot.id);
        }));
        cell.appendChild(createIngredientRowButton('詳細', function () {
          openIngredientDetailModal(lot.id);
        }));
        if (lot.storageState === '冷蔵') {
          cell.appendChild(createIngredientRowButton('冷凍に移す', function () {
            openIngredientFreezeModal(lot.id);
          }));
        } else {
          cell.appendChild(createIngredientRowButton(lot.storageState === '冷凍' ? '解凍する' : '解凍の完了', function () {
            openIngredientThawModal(lot.id);
          }));
        }
        return cell;
      }

      function createIngredientRowButton(label, handler) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ingredient-row-btn';
        button.textContent = label;
        button.addEventListener('click', handler);
        return button;
      }

      /**
       * タブ（原材料／仕込み済み）を切り替える
       */
      function selectIngredientCategory(button) {
        const tabs = document.querySelectorAll('.ingredient-tab');
        for (let i = 0; i < tabs.length; i++) {
          tabs[i].classList.remove('selected');
        }
        button.classList.add('selected');
        ingredientCategory = button.dataset.category;
        renderIngredientTable();
      }

      /**
       * 保存状態（冷蔵・冷凍・解凍中）の絞り込みを切り替える
       */
      function selectIngredientStorage(button) {
        const filters = document.querySelectorAll('.ingredient-filter');
        for (let i = 0; i < filters.length; i++) {
          filters[i].classList.remove('selected');
        }
        button.classList.add('selected');
        ingredientStorageFilter = button.dataset.storage;
        renderIngredientTable();
      }

      /**
       * 在庫IDから表示中の明細を探す
       */
      function findIngredientLotById(lotId) {
        for (let i = 0; i < ingredientBoard.lots.length; i++) {
          if (ingredientBoard.lots[i].id === lotId) {
            return ingredientBoard.lots[i];
          }
        }
        return null;
      }

      // 食材管理のモーダル共通処理

      /**
       * モーダルを開く
       * 開くたびに新しい操作キーを作り、保存が成功するまでは同じキーを使い続ける
       * （通信が途中で切れて再送になっても、サーバー側で同じ操作と分かり在庫が二重に動かない）
       */
      function openIngredientModal(overlayId, keyName) {
        if (!ingredientBoard) {
          showIngredientMessage('食材の情報を読み込めていません。「更新」を押してください', true);
          return false;
        }
        ingredientOperationKeys[keyName] = createIngredientOperationKey();
        document.getElementById(overlayId).style.display = 'flex';
        return true;
      }

      function closeIngredientModal(overlayId) {
        document.getElementById(overlayId).style.display = 'none';
      }

      function handleIngredientOverlayClick(event) {
        // 暗い背景そのものをクリックしたときだけ閉じる（モーダル本体のクリックは無視）
        if (event.target === event.currentTarget) {
          event.currentTarget.style.display = 'none';
        }
      }

      /**
       * 1回の保存を表す操作キーを作る
       */
      function createIngredientOperationKey() {
        return 'op-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
      }

      /**
       * サーバーへ保存し、成功したら最新の内容で画面を作り直す
       * 保存中はボタンを押せなくし、失敗したときは入力を残したままエラーだけを出す
       */
      function runIngredientSave(config) {
        const submitBtn = document.getElementById(config.submitBtnId);
        const errorEl = document.getElementById(config.errorId);
        if (submitBtn.disabled) {
          return; // 保存中の連打は無視する
        }
        errorEl.textContent = '';

        let payload;
        try {
          payload = config.buildPayload();
        } catch (error) {
          errorEl.textContent = error.message;
          return;
        }
        payload.operationKey = ingredientOperationKeys[config.keyName];
        payload.actorEmpId = selectedEmpId ? String(selectedEmpId) : '';
        // 店長専用の保存なので、サーバー側で権限を確認できるようトークンを添える
        payload.authToken = authToken;

        const originalLabel = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = '保存中...';

        const sessionId = loginSessionId;
        const runner = google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            submitBtn.disabled = false;
            submitBtn.textContent = originalLabel;
            ingredientOperationKeys[config.keyName] = createIngredientOperationKey();
            if (config.keepOpen !== true) {
              closeIngredientModal(config.overlayId);
            }
            applyIngredientBoard(result.board);
            showIngredientMessage(result.message, false);
            if (config.onSuccess) {
              config.onSuccess();
            }
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            submitBtn.disabled = false;
            submitBtn.textContent = originalLabel;
            // 保存できていないので成功の表示はせず、入力内容はそのまま残す
            errorEl.textContent = 'エラー: ' + error.message;
          });
        runner[config.method](payload);
      }

      /**
       * select の選択肢を作り直す
       * @param {string} selectId 対象のselectのid
       * @param {Array<Object>} options { value, label } の配列
       * @param {string} selectedValue 選んでおく値
       * @param {string} placeholder 先頭に出す未選択の文言（不要なら空文字）
       */
      function fillIngredientSelect(selectId, options, selectedValue, placeholder) {
        const select = document.getElementById(selectId);
        select.innerHTML = '';
        if (placeholder !== '') {
          const emptyOption = document.createElement('option');
          emptyOption.value = '';
          emptyOption.textContent = placeholder;
          select.appendChild(emptyOption);
        }
        for (let i = 0; i < options.length; i++) {
          const option = document.createElement('option');
          option.value = options[i].value;
          option.textContent = options[i].label;
          select.appendChild(option);
        }
        select.value = (selectedValue === undefined || selectedValue === null) ? '' : selectedValue;
      }

      /**
       * 値と表示が同じ選択肢の配列を作る
       */
      function toIngredientOptions(values) {
        const options = [];
        for (let i = 0; i < values.length; i++) {
          options.push({ 'value': values[i], 'label': values[i] });
        }
        return options;
      }

      /**
       * 食材マスタの選択肢を作る
       * @param {string} category '原材料' か '仕込み済み'。空文字ならすべて
       */
      function getIngredientMasterOptions(category) {
        const options = [];
        for (let i = 0; i < ingredientBoard.masters.length; i++) {
          const master = ingredientBoard.masters[i];
          if (!master.active) {
            continue;
          }
          if (category !== '' && master.category !== category) {
            continue;
          }
          options.push({ 'value': master.id, 'label': master.name });
        }
        return options;
      }

      function findIngredientMasterById(ingredientId) {
        for (let i = 0; i < ingredientBoard.masters.length; i++) {
          if (ingredientBoard.masters[i].id === ingredientId) {
            return ingredientBoard.masters[i];
          }
        }
        return null;
      }

      function findIngredientSupplierById(supplierId) {
        for (let i = 0; i < ingredientBoard.suppliers.length; i++) {
          if (ingredientBoard.suppliers[i].id === supplierId) {
            return ingredientBoard.suppliers[i];
          }
        }
        return null;
      }

      /**
       * 食材を選び直したとき、その食材の既定単位を単位のselectに反映する
       */
      function applyIngredientDefaultUnit(ingredientSelectId, unitSelectId) {
        const master = findIngredientMasterById(document.getElementById(ingredientSelectId).value);
        if (master && master.defaultUnit !== '') {
          document.getElementById(unitSelectId).value = master.defaultUnit;
        }
      }

      // 入力欄で使う日付・日時の文字列を作る（ブラウザの表示は端末の時計、保存時はGAS側で日本時間として扱う）
      function formatIngredientInputDate(date) {
        const pad = function (n) { return ('0' + n).slice(-2); };
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
      }

      function formatIngredientInputDateTime(date) {
        const pad = function (n) { return ('0' + n).slice(-2); };
        return formatIngredientInputDate(date) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
      }

      /**
       * 日時の入力欄に「いま」を入れる（過去の日時に直すこともできる）
       */
      function setIngredientNow(inputId) {
        document.getElementById(inputId).value = formatIngredientInputDateTime(new Date());
      }

      /**
       * 入力必須の項目が空でないかを確かめる
       */
      function requireIngredientValue(inputId, label) {
        const value = document.getElementById(inputId).value;
        if (value === '' || value === null) {
          throw new Error(label + 'を入力してください');
        }
        return value;
      }

      // 入荷を記録

      function openIngredientReceiveModal() {
        if (!openIngredientModal('ingredient_receive_overlay', 'receive')) {
          return;
        }
        const pendingOrders = [];
        for (let i = 0; i < ingredientBoard.orders.length; i++) {
          const order = ingredientBoard.orders[i];
          if (order.status === '発注済み') {
            pendingOrders.push({
              'value': order.id,
              'label': order.name + ' ' + order.quantity + order.unit +
                '（入荷予定 ' + (order.expectedDate === '' ? '未設定' : order.expectedDate) + '）'
            });
          }
        }
        fillIngredientSelect('receive_order', pendingOrders, '', '発注と結び付けない');
        fillIngredientSelect('receive_ingredient', getIngredientMasterOptions(''), '', '食材を選んでください');
        fillIngredientSelect('receive_unit', toIngredientOptions(ingredientBoard.units), '', '');
        fillIngredientSelect('receive_expiry_kind', toIngredientOptions(ingredientBoard.expiryKinds), '表示期限', '');
        document.getElementById('receive_quantity').value = '';
        document.getElementById('receive_date').value = formatIngredientInputDate(new Date());
        document.getElementById('receive_storage').value = '冷蔵';
        document.getElementById('receive_expiry_date').value = '';
        document.getElementById('receive_note').value = '';
        document.getElementById('receive_error').textContent = '';
        toggleIngredientExpiryDateInput();
      }

      /**
       * 期限の種類が「不明」のときは期限日を入力できないようにする
       */
      function toggleIngredientExpiryDateInput() {
        const isUnknown = (document.getElementById('receive_expiry_kind').value === '不明');
        const dateInput = document.getElementById('receive_expiry_date');
        dateInput.disabled = isUnknown;
        if (isUnknown) {
          dateInput.value = '';
        }
      }

      /**
       * 発注済みを選んだとき、食材・数量・単位を入荷の入力欄に写す
       */
      function applyIngredientOrderToReceiveForm() {
        const orderId = document.getElementById('receive_order').value;
        if (orderId === '') {
          return;
        }
        for (let i = 0; i < ingredientBoard.orders.length; i++) {
          const order = ingredientBoard.orders[i];
          if (order.id !== orderId) {
            continue;
          }
          document.getElementById('receive_ingredient').value = order.ingredientId;
          document.getElementById('receive_quantity').value = order.quantity;
          document.getElementById('receive_unit').value = order.unit;
          return;
        }
      }

      function submitIngredientReceive() {
        runIngredientSave({
          'overlayId': 'ingredient_receive_overlay',
          'errorId': 'receive_error',
          'submitBtnId': 'receive_submit_btn',
          'keyName': 'receive',
          'method': 'saveIngredientReceive',
          'buildPayload': function () {
            return {
              'ingredientId': requireIngredientValue('receive_ingredient', '食材'),
              'quantity': requireIngredientValue('receive_quantity', '数量'),
              'unit': document.getElementById('receive_unit').value,
              'receivedDate': requireIngredientValue('receive_date', '入荷日'),
              'storageState': document.getElementById('receive_storage').value,
              'expiryKind': document.getElementById('receive_expiry_kind').value,
              'expiryDate': document.getElementById('receive_expiry_date').value,
              'note': document.getElementById('receive_note').value,
              'orderId': document.getElementById('receive_order').value
            };
          }
        });
      }

      // 仕込みを記録

      function openIngredientPrepModal() {
        if (!openIngredientModal('ingredient_prep_overlay', 'prep')) {
          return;
        }
        fillIngredientSelect('prep_ingredient', getIngredientMasterOptions('仕込み済み'), '', '仕込み品を選んでください');
        fillIngredientSelect('prep_unit', toIngredientOptions(ingredientBoard.units), '', '');
        document.getElementById('prep_quantity').value = '';
        document.getElementById('prep_prepared_at').value = formatIngredientInputDateTime(new Date());
        document.getElementById('prep_prepared_unknown').checked = false;
        document.getElementById('prep_use_by').value = '';
        document.getElementById('prep_storage').value = '冷蔵';
        document.getElementById('prep_note').value = '';
        document.getElementById('prep_error').textContent = '';
        document.getElementById('prep_consume_tbody').innerHTML = '';
        toggleIngredientPreparedUnknown();
      }

      /**
       * 仕込み日時が「不明」のときは日時の入力欄を使えないようにする
       */
      function toggleIngredientPreparedUnknown() {
        const isUnknown = document.getElementById('prep_prepared_unknown').checked;
        document.getElementById('prep_prepared_at').disabled = isUnknown;
      }

      /**
       * 仕込みで使った原材料の行を1行増やす
       */
      function addIngredientConsumeRow() {
        const tbody = document.getElementById('prep_consume_tbody');
        const row = document.createElement('tr');
