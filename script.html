<script>
      let selectedEmpId = null;
      let clockIntervalId = null;

      // 打刻がまだ無いことを表す表示文字列（code.js の UNRECORDED_LABEL と揃える）
      const UNRECORDED_LABEL = '未打刻';

      // ポジション候補（code.js の POSITION_ITEMS をそのまま埋め込み、二重管理しない）
      const POSITION_ITEMS = <?!= JSON.stringify(POSITION_ITEMS) ?>;

      window.addEventListener('load', function () {
        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].addEventListener('click', function () {
            selectEmployee(this);
          });
        }

        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let j = 0; j < navItems.length; j++) {
          navItems[j].addEventListener('click', function () {
            showManagerSection(this);
          });
        }
      });

      /**
       * 従業員画面と店長画面を切り替える
       * ページ遷移はせず表示/非表示を操作するだけなので、選択中の従業員などの状態は保持される
       */
      function showScreen(screenName) {
        const isEmployee = (screenName === 'employee');
        document.getElementById('employee_screen').style.display = isEmployee ? 'block' : 'none';
        document.getElementById('manager_screen').style.display = isEmployee ? 'none' : 'block';
        document.getElementById('to_manager_btn').style.display = isEmployee ? 'inline-block' : 'none';
        document.getElementById('to_employee_btn').style.display = isEmployee ? 'none' : 'inline-block';

        // 従業員画面から店長画面へ切り替えたとき、ダッシュボードが表示中なら本日の業務設定を読み直す
        if (!isEmployee && document.getElementById('section_dashboard').style.display !== 'none') {
          loadTodayWork();
        }
      }

      function selectEmployee(el) {
        selectedEmpId = el.dataset.empId;

        const items = document.querySelectorAll('.employee-item');
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove('selected');
        }
        el.classList.add('selected');

        document.getElementById('selected_emp_name').innerHTML = el.dataset.empName;
        document.getElementById('record_message').innerHTML = '';
        hideTodayWorkCard(); // 前の従業員の本日の業務情報を新しい従業員の画面に残さない
        document.getElementById('right_panel').style.display = 'block';
        startClock();
      }

      /**
       * 「本日の業務」カードを非表示にし、表示していたポジション・確認事項をクリアする
       * 従業員を切り替えた直後に必ず呼び出す
       */
      function hideTodayWorkCard() {
        document.getElementById('today_work_card').style.display = 'none';
        document.getElementById('today_work_card_body').innerHTML = '';
      }

      function startClock() {
        if (clockIntervalId) {
          clearInterval(clockIntervalId);
        }
        updateClock();
        clockIntervalId = setInterval(updateClock, 1000);
      }

      function updateClock() {
        const now = new Date();
        const pad = function (n) { return ('0' + n).slice(-2); };
        document.getElementById('current_time').innerHTML =
          pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function handleClockButtonClick(type) {
        if (!selectedEmpId) {
          return;
        }
        // 打刻ボタンを押した時点の従業員IDを保持しておく。本日の業務情報の取得が終わるまでの間に
        // 別の従業員へ選択が切り替えられても、この従業員ID宛の結果しか画面に反映しないようにするため
        const empIdAtClick = selectedEmpId;
        document.getElementById('record_message').innerHTML = '登録中...';
        google.script.run
          .withSuccessHandler(function (message) {
            showRecordMessage(message);
            if (type === '出勤') {
              loadTodayWorkInfo(empIdAtClick);
            }
          })
          .withFailureHandler(showRecordError)
          .recordClock(selectedEmpId, type);
      }

      function showRecordMessage(message) {
        document.getElementById('record_message').innerHTML = message;
      }

      function showRecordError(error) {
        document.getElementById('record_message').innerHTML = 'エラー: ' + error.message;
      }

      /**
       * 出勤成功後、本日の業務情報（ポジション・確認事項）を取得する
       * recordClock() 自体には手を加えず、打刻の成否とは別処理として扱う
       * 取得中に従業員が切り替えられていた場合は、結果が戻ってきても表示しない（安全のためのガード）
       */
      function loadTodayWorkInfo(empId) {
        google.script.run
          .withSuccessHandler(function (info) {
            if (selectedEmpId !== empId) {
              return;
            }
            renderTodayWorkCard(info);
          })
          .withFailureHandler(function () {
            if (selectedEmpId !== empId) {
              return;
            }
            showTodayWorkFetchError();
          })
          .getTodayWorkInfo(empId);
      }

      /**
       * 本日の業務カードへポジション・確認事項を描画する
       * ポジション・確認事項それぞれの有無に応じて表示内容を出し分ける
       */
      function renderTodayWorkCard(info) {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';

        const hasPosition = !!info.position;
        const hasNotices = info.notices && info.notices.length > 0;

        if (!hasPosition && !hasNotices) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'today-work-empty';
          emptyMsg.textContent = '本日の業務情報は登録されていません';
          body.appendChild(emptyMsg);
          card.style.display = 'block';
          return;
        }

        const positionLabel = document.createElement('div');
        positionLabel.className = 'today-work-label';
        positionLabel.textContent = '今日のポジション';
        body.appendChild(positionLabel);

        const positionValue = document.createElement('div');
        positionValue.className = 'today-work-position';
        positionValue.textContent = hasPosition ? info.position : '未設定';
        body.appendChild(positionValue);

        const noticesLabel = document.createElement('div');
        noticesLabel.className = 'today-work-label';
        noticesLabel.textContent = '確認事項';
        body.appendChild(noticesLabel);

        if (hasNotices) {
          const list = document.createElement('ul');
          list.className = 'today-work-notices-list';
          for (let i = 0; i < info.notices.length; i++) {
            const li = document.createElement('li');
            li.textContent = info.notices[i];
            list.appendChild(li);
          }
          body.appendChild(list);
        } else {
          const noNotice = document.createElement('div');
          noNotice.className = 'today-work-no-notice';
          noNotice.textContent = '本日の確認事項はありません';
          body.appendChild(noNotice);
        }

        card.style.display = 'block';
      }

      /**
       * 本日の業務情報の取得に失敗したことをカード内に表示する
       * 打刻自体は成功しているため、record_message（出勤の成功メッセージ）は書き換えない
       */
      function showTodayWorkFetchError() {
        const card = document.getElementById('today_work_card');
        const body = document.getElementById('today_work_card_body');
        body.innerHTML = '';
        const warning = document.createElement('div');
        warning.className = 'today-work-warning';
        warning.textContent = '⚠ 本日の業務情報を取得できませんでした';
        body.appendChild(warning);
        card.style.display = 'block';
      }

      function openAddEmployeeModal() {
        document.getElementById('add_last_name').value = '';
        document.getElementById('add_first_name').value = '';
        document.getElementById('add_employee_error').innerHTML = '';
        document.getElementById('add_employee_overlay').style.display = 'flex';
      }

      function closeAddEmployeeModal() {
        document.getElementById('add_employee_overlay').style.display = 'none';
      }

      function handleOverlayClick(event) {
        // 暗い背景そのものをクリックしたときだけ閉じる（モーダル本体のクリックは無視）
        if (event.target === event.currentTarget) {
          closeAddEmployeeModal();
        }
      }

      function submitAddEmployee() {
        const lastName = document.getElementById('add_last_name').value.trim();
        const firstName = document.getElementById('add_first_name').value.trim();
        const errorEl = document.getElementById('add_employee_error');

        if (lastName === '' || firstName === '') {
          errorEl.innerHTML = '姓と名を入力してください';
          return;
        }
        errorEl.innerHTML = '';

        const submitBtn = document.getElementById('add_employee_submit_btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '登録中...';

        google.script.run
          .withSuccessHandler(function () {
            window.location.reload();
          })
          .withFailureHandler(function (error) {
            errorEl.innerHTML = error.message;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '登録';
          })
          .addEmployee(lastName, firstName);
      }

      /**
       * 店長画面のサイドバーで選ばれた機能をメイン領域に表示する
       * まだ実装していない機能は共通の「準備中」画面を見出しだけ差し替えて表示する
       */
      function showManagerSection(navItem) {
        const navItems = document.querySelectorAll('.manager-nav-item');
        for (let i = 0; i < navItems.length; i++) {
          navItems[i].classList.remove('selected');
        }
        navItem.classList.add('selected');

        const sections = document.querySelectorAll('.manager-section');
        for (let j = 0; j < sections.length; j++) {
          sections[j].style.display = 'none';
        }

        const sectionName = navItem.dataset.section;
        if (sectionName === 'dashboard') {
          document.getElementById('section_dashboard').style.display = 'block';
          loadTodayWork(); // 開くたびに最新の本日の業務設定を読み直す
        } else if (sectionName === 'attendance') {
          document.getElementById('section_attendance').style.display = 'block';
          loadAttendances(); // 開くたびに最新の打刻を読み直す
        } else if (sectionName === 'skill') {
          document.getElementById('section_skill').style.display = 'block';
          loadSkills(); // 開くたびに最新のスキル情報を読み直す
        } else {
          document.getElementById('preparing_heading').textContent = navItem.textContent;
          document.getElementById('section_preparing').style.display = 'block';
        }
      }

      /**
       * 店長ダッシュボードの本日の業務設定をサーバーから取得する
       */
      function loadTodayWork() {
        document.getElementById('today_work_table').style.display = 'none';
        showTodayWorkMessage('読み込み中...', false);

        google.script.run
          .withSuccessHandler(renderTodayWork)
          .withFailureHandler(showTodayWorkError)
          .getTodayWorkSettings();
      }

      /**
       * 取得した本日の業務設定を表に描画する
       */
      function renderTodayWork(result) {
        document.getElementById('today_work_date').textContent = result.date;

        const tbody = document.getElementById('today_work_tbody');
        tbody.innerHTML = '';

        if (result.settings.length === 0) {
          showTodayWorkMessage('従業員名簿に従業員が登録されていません', false);
          return;
        }

        for (let i = 0; i < result.settings.length; i++) {
          tbody.appendChild(createTodayWorkRow(result.settings[i]));
        }

        showTodayWorkMessage('', false);
        document.getElementById('today_work_table').style.display = 'table';
      }

      /**
       * 本日の業務設定の1行分（氏名・ポジションselect・確認事項textarea・保存ボタン）を作る
       */
      function createTodayWorkRow(setting) {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        nameCell.textContent = setting.name;
        row.appendChild(nameCell);

        const positionCell = document.createElement('td');
        const select = document.createElement('select');
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = '未設定';
        select.appendChild(emptyOption);
        for (let i = 0; i < POSITION_ITEMS.length; i++) {
          const option = document.createElement('option');
          option.value = POSITION_ITEMS[i];
          option.textContent = POSITION_ITEMS[i];
          select.appendChild(option);
        }
        select.value = setting.position;
        positionCell.appendChild(select);
        row.appendChild(positionCell);

        const noticesCell = document.createElement('td');
        const textarea = document.createElement('textarea');
        textarea.className = 'today-work-notices-input';
        textarea.rows = 3;
        textarea.value = setting.noticesText;
        noticesCell.appendChild(textarea);
        row.appendChild(noticesCell);

        const actionCell = document.createElement('td');
        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'today-work-save-btn';
        saveBtn.textContent = '保存';
        const statusSpan = document.createElement('span');
        statusSpan.className = 'today-work-row-status';
        saveBtn.addEventListener('click', function () {
          saveTodayWorkRow(setting.id, select, textarea, saveBtn, statusSpan);
        });
        actionCell.appendChild(saveBtn);
        actionCell.appendChild(statusSpan);
        row.appendChild(actionCell);

        return row;
      }

      /**
       * 1人分の本日の業務（ポジション・確認事項）を保存する
       * 他の従業員の行には影響しない。保存ボタンを押した行だけをサーバーへ送信する
       */
      function saveTodayWorkRow(empId, select, textarea, saveBtn, statusSpan) {
        saveBtn.disabled = true;
        statusSpan.textContent = '保存中...';
        statusSpan.classList.remove('error');

        google.script.run
          .withSuccessHandler(function (message) {
            saveBtn.disabled = false;
            statusSpan.textContent = message;
            statusSpan.classList.remove('error');
          })
          .withFailureHandler(function (error) {
            saveBtn.disabled = false;
            statusSpan.textContent = 'エラー: ' + error.message;
            statusSpan.classList.add('error');
          })
          .saveTodayWork(empId, select.value, textarea.value);
      }

      function showTodayWorkError(error) {
        showTodayWorkMessage('エラー: ' + error.message, true);
      }

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・従業員なし・エラー）を切り替える
       */
      function showTodayWorkMessage(message, isError) {
        const messageEl = document.getElementById('today_work_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 本日の勤怠一覧をサーバーから取得する
       */
      function loadAttendances() {
        document.getElementById('attendance_reload_btn').disabled = true;
        document.getElementById('attendance_table').style.display = 'none';
        showAttendanceMessage('読み込み中...', false);

        google.script.run
          .withSuccessHandler(renderAttendances)
          .withFailureHandler(showAttendanceError)
          .getTodayAttendances();
      }

      /**
       * 取得した本日の勤怠一覧を表に描画する
       */
      function renderAttendances(result) {
        document.getElementById('attendance_reload_btn').disabled = false;
        document.getElementById('attendance_date').textContent = result.date;

        const tbody = document.getElementById('attendance_tbody');
        tbody.innerHTML = '';

        if (result.attendances.length === 0) {
          showAttendanceMessage('本日の打刻はまだありません', false);
          return;
        }

        for (let i = 0; i < result.attendances.length; i++) {
          const attendance = result.attendances[i];
          const row = document.createElement('tr');
          row.appendChild(createAttendanceCell(attendance.name));
          row.appendChild(createAttendanceCell(attendance.clockIn));
          row.appendChild(createAttendanceCell(attendance.clockOut));
          row.appendChild(createAttendanceCell(attendance.breakTime));
          row.appendChild(createAttendanceCell(attendance.workingTime));
          row.appendChild(createAttendanceCell(attendance.estimatedWage));
          tbody.appendChild(row);
        }

        showAttendanceMessage('', false);
        document.getElementById('attendance_table').style.display = 'table';
      }

      /**
       * 勤怠一覧のセルを作る
       * 氏名はシートに入力された値なので、HTMLとして解釈されないよう textContent で入れる
       */
      function createAttendanceCell(text) {
        const cell = document.createElement('td');
        cell.textContent = text;
        if (text === UNRECORDED_LABEL) {
          cell.classList.add('unrecorded'); // 未打刻は店長がすぐ気付けるよう色を変える
        }
        return cell;
      }

      function showAttendanceError(error) {
        document.getElementById('attendance_reload_btn').disabled = false;
        document.getElementById('attendance_date').textContent = '';
        showAttendanceMessage('エラー: ' + error.message, true);
      }

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・打刻なし・エラー）を切り替える
       */
      function showAttendanceMessage(message, isError) {
        const messageEl = document.getElementById('attendance_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      // スキル項目・評価値（code.js の SKILL_ITEMS / SKILL_LEVELS と揃える）
      const SKILL_ITEMS = ['接客', 'レジ', 'バー', '厨房', '肉の仕込み', '締め作業'];
      const SKILL_LEVELS = ['◎', '○', '△', '×'];

      /**
       * 従業員スキル一覧をサーバーから取得する
       */
      function loadSkills() {
        document.getElementById('skill_table').style.display = 'none';
        showSkillMessage('読み込み中...', false);

        google.script.run
          .withSuccessHandler(renderSkills)
          .withFailureHandler(showSkillError)
          .getSkillMatrix();
      }

      /**
       * 取得したスキル一覧を表に描画する
       * 各行は select（◎/○/△/×）と、その行だけを保存する「保存」ボタンで構成する
       */
      function renderSkills(matrix) {
        const tbody = document.getElementById('skill_tbody');
        tbody.innerHTML = '';

        if (matrix.length === 0) {
          showSkillMessage('従業員名簿に従業員が登録されていません', false);
          return;
        }

        for (let i = 0; i < matrix.length; i++) {
          tbody.appendChild(createSkillRow(matrix[i]));
        }

        showSkillMessage('', false);
        document.getElementById('skill_table').style.display = 'table';
      }

      /**
       * スキル一覧の1行分（氏名・各スキルのselect＋更新日・保存ボタン）を作る
       * 評価と更新日は列を分けず、同じセルの中に縦に並べて表示する（画面が横に広がらないようにするため）
       */
      function createSkillRow(employeeSkill) {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        nameCell.textContent = employeeSkill.name;
        row.appendChild(nameCell);

        for (let i = 0; i < SKILL_ITEMS.length; i++) {
          const item = SKILL_ITEMS[i];
          const cell = document.createElement('td');
          cell.className = 'skill-cell';

          const select = document.createElement('select');
          for (let j = 0; j < SKILL_LEVELS.length; j++) {
            const option = document.createElement('option');
            option.value = SKILL_LEVELS[j];
            option.textContent = SKILL_LEVELS[j];
            select.appendChild(option);
          }
          select.value = employeeSkill.skills[item];
          select.dataset.skillItem = item;

          const dateLabel = document.createElement('div');
          dateLabel.className = 'skill-updated-at';
          dateLabel.dataset.skillItem = item;
          dateLabel.textContent = formatSkillUpdatedAtLabel(employeeSkill.updatedAt[item]);

          cell.appendChild(select);
          cell.appendChild(dateLabel);
          row.appendChild(cell);
        }

        const actionCell = document.createElement('td');
        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'skill-save-btn';
        saveBtn.textContent = '保存';
        const statusSpan = document.createElement('span');
        statusSpan.className = 'skill-row-status';
        saveBtn.addEventListener('click', function () {
          saveSkillRow(employeeSkill.id, row, saveBtn, statusSpan);
        });
        actionCell.appendChild(saveBtn);
        actionCell.appendChild(statusSpan);
        row.appendChild(actionCell);

        return row;
      }

      /**
       * 更新日（'yyyy/MM/dd'形式、未保存なら空文字）を「更新：8/19」のような表示用文字列にする
       */
      function formatSkillUpdatedAtLabel(dateStr) {
        if (!dateStr) {
          return '更新：-';
        }
        const parts = dateStr.split('/');
        if (parts.length !== 3) {
          return '更新：-';
        }
        return '更新：' + Number(parts[1]) + '/' + Number(parts[2]);
      }

      /**
       * 1行分のスキル評価をまとめて保存する
       * selectを変更しただけでは保存されず、この「保存」ボタンを押した時点でまとめて送信する
       */
      function saveSkillRow(empId, row, saveBtn, statusSpan) {
        const selects = row.querySelectorAll('select');
        const skillValues = [];
        for (let i = 0; i < selects.length; i++) {
          skillValues.push(selects[i].value);
        }

        saveBtn.disabled = true;
        statusSpan.textContent = '保存中...';
        statusSpan.classList.remove('error');

        google.script.run
          .withSuccessHandler(function (result) {
            saveBtn.disabled = false;
            statusSpan.textContent = result.message;
            statusSpan.classList.remove('error');
            updateSkillRowDates(row, result.updatedAt);
          })
          .withFailureHandler(function (error) {
            saveBtn.disabled = false;
            statusSpan.textContent = 'エラー: ' + error.message;
            statusSpan.classList.add('error');
          })
          .saveEmployeeSkills(empId, skillValues);
      }

      /**
       * 保存後、サーバーから返ってきた最新の更新日で行内の表示を書き換える
       * （評価が変わっていない項目の更新日はサーバー側でも変更されていないので、そのまま同じ日付が返る）
       */
      function updateSkillRowDates(row, updatedAt) {
        const dateLabels = row.querySelectorAll('.skill-updated-at');
        for (let i = 0; i < dateLabels.length; i++) {
          const item = dateLabels[i].dataset.skillItem;
          dateLabels[i].textContent = formatSkillUpdatedAtLabel(updatedAt[item]);
        }
      }

      function showSkillError(error) {
        showSkillMessage('エラー: ' + error.message, true);
      }

      /**
       * 表の代わりに出す一行メッセージ（読み込み中・従業員なし・エラー）を切り替える
       */
      function showSkillMessage(message, isError) {
        const messageEl = document.getElementById('skill_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }
    </script>
