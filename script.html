      function collectShiftAssignments() {
        const rows = document.getElementById('shift_assignment_tbody').querySelectorAll('.shift-row');
        const assignments = [];
        for (let i = 0; i < rows.length; i++) {
          assignments.push({
            'employeeId': rows[i].querySelector('.shift-employee-select').value,
            'startTime': rows[i].querySelector('.shift-start-time').value,
            'endTime': rows[i].querySelector('.shift-end-time').value,
            'position': rows[i].querySelector('.shift-position-select').value,
            'note': rows[i].querySelector('.shift-note-input').value
          });
        }
        return assignments;
      }

      function collectShiftRequirements() {
        const rows = document.getElementById('shift_requirement_tbody').querySelectorAll('.shift-row');
        const requirements = [];
        for (let i = 0; i < rows.length; i++) {
          requirements.push({
            'startTime': rows[i].querySelector('.shift-requirement-start-time').value,
            'endTime': rows[i].querySelector('.shift-requirement-end-time').value,
            'position': rows[i].querySelector('.shift-requirement-position-select').value,
            'requiredCount': rows[i].querySelector('.shift-required-count-input').value
          });
        }
        return requirements;
      }

      /**
       * 保存前にブラウザ側でも入力を確認する（同じ内容をサーバー側でも検証する）
       * 問題があればエラーメッセージ、問題が無ければ空文字を返す
       * 人員不足や勤務時間の重複は保存できる確認事項なので、ここでは止めない
       */
      function validateShiftRowsOnClient(assignments, requirements) {
        for (let i = 0; i < assignments.length; i++) {
          const label = 'シフト割当' + (i + 1) + '行目：';
          if (assignments[i].employeeId === '') {
            return label + '従業員を選択してください';
          }
          if (assignments[i].position === '') {
            return label + 'ポジションを選択してください';
          }
          if (assignments[i].startTime === '') {
            return label + '出勤時刻を入力してください';
          }
          if (assignments[i].endTime === '') {
            return label + '退勤時刻を入力してください';
          }
          // 'HH:mm' は桁が揃っているので、文字列のまま比較しても時刻の前後を判定できる
          if (assignments[i].startTime >= assignments[i].endTime) {
            return label + '出勤時刻は退勤時刻より前にしてください';
          }
        }

        for (let r = 0; r < requirements.length; r++) {
          const label = '必要人数条件' + (r + 1) + '行目：';
          if (requirements[r].position === '') {
            return label + 'ポジションを選択してください';
          }
          if (requirements[r].startTime === '') {
            return label + '開始時刻を入力してください';
          }
          if (requirements[r].endTime === '') {
            return label + '終了時刻を入力してください';
          }
          if (requirements[r].startTime >= requirements[r].endTime) {
            return label + '開始時刻は終了時刻より前にしてください';
          }
          const requiredCount = Number(requirements[r].requiredCount);
          if (!isFinite(requiredCount) || Math.floor(requiredCount) !== requiredCount || requiredCount < 1) {
            return label + '必要人数は1以上の整数で入力してください';
          }
        }

        return '';
      }

      /**
       * 選択中の日のシフトをまとめて保存する
       * 保存中はボタンを無効化し、保存が終わったら表示中の月を取り直して印を更新する
       */
      function submitShiftDay() {
        if (isShiftSaving || shiftSelectedDate === null) {
          return;
        }

        const assignments = collectShiftAssignments();
        const requirements = collectShiftRequirements();
        const errorMessage = validateShiftRowsOnClient(assignments, requirements);
        if (errorMessage !== '') {
          showShiftSaveStatus(errorMessage, true);
          return;
        }

        isShiftSaving = true;
        const saveBtn = document.getElementById('shift_save_btn');
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';
        showShiftSaveStatus('', false);

        const savedDateKey = shiftSelectedDate;
        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            finishShiftSaving();
            // 保存した日の割当・確認事項と、カレンダーの印（○／△！）を最新の内容に更新する
            // 交代が済んだ枠の「交代が必要」の表示も、ここで描き直されて消える
            if (shiftSelectedDate === savedDateKey) {
              renderShiftDay(result);
            }
            showShiftSaveStatus(result.message, false);
            loadShiftMonth(shiftYear, shiftMonth);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            finishShiftSaving();
            showShiftSaveStatus('エラー: ' + error.message, true);
          })
          .saveShiftDay(savedDateKey, assignments, requirements, authToken);
      }

      function finishShiftSaving() {
        isShiftSaving = false;
        const saveBtn = document.getElementById('shift_save_btn');
        saveBtn.disabled = false;
        saveBtn.textContent = 'この日のシフトを保存';
      }

      function hideShiftDetail() {
        document.getElementById('shift_detail').style.display = 'none';
        document.getElementById('shift_detail_body').style.display = 'none';
        document.getElementById('shift_detail_warnings').innerHTML = '';
        document.getElementById('shift_assignment_tbody').innerHTML = '';
        document.getElementById('shift_requirement_tbody').innerHTML = '';
        showShiftSaveStatus('', false);
      }

      /**
       * 日付キー（'yyyy/MM/dd'）を「2026年9月2日（水）」のような表示用文字列にする
       */
      function formatShiftDateLabel(dateKey) {
        const parts = dateKey.split('/');
        const year = Number(parts[0]);
        const month = Number(parts[1]);
        const day = Number(parts[2]);
        const weekday = SHIFT_WEEKDAY_LABELS[new Date(year, month - 1, day).getDay()];
        return year + '年' + month + '月' + day + '日（' + weekday + '）';
      }

      /**
       * カレンダーの上に出す一行メッセージ（読み込み中・エラー）を切り替える
       */
      function showShiftMessage(message, isError) {
        const messageEl = document.getElementById('shift_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 編集欄の代わりに出す一行メッセージ（読み込み中・エラー）を切り替える
       */
      function showShiftDetailMessage(message, isError) {
        const messageEl = document.getElementById('shift_detail_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 保存ボタンの横に出す状態（保存中・完了・エラー）を切り替える
       */
      function showShiftSaveStatus(message, isError) {
        const statusEl = document.getElementById('shift_save_status');
        statusEl.textContent = message;
        if (isError) {
          statusEl.classList.add('error');
        } else {
          statusEl.classList.remove('error');
        }
      }

      // 店長画面：発注管理で使う共通のダイアログ操作
      // 「食材を追加」と「業者・発注条件の設定」の2つのダイアログから呼ぶ

      function closeIngredientModal(overlayId) {
        document.getElementById(overlayId).style.display = 'none';
      }

      function handleIngredientOverlayClick(event) {
        // 暗い背景そのものをクリックしたときだけ閉じる（モーダル本体のクリックは無視）
        if (event.target === event.currentTarget) {
          event.currentTarget.style.display = 'none';
        }
      }

      /**
       * 1回の保存を表す操作キーを作る
       * 通信が途中で切れて再送になっても、サーバー側で同じ操作と分かるようにするために使う
       */
      function createIngredientOperationKey() {
        return 'op-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
      }

      /**
       * select の選択肢を作り直す
       * @param {string} selectId 対象のselectのid
       * @param {Array<Object>} options { value, label } の配列
       * @param {string} selectedValue 選んでおく値
       * @param {string} placeholder 先頭に出す未選択の文言（不要なら空文字）
       */
      function fillIngredientSelect(selectId, options, selectedValue, placeholder) {
        const select = document.getElementById(selectId);
        select.innerHTML = '';
        if (placeholder !== '') {
          const emptyOption = document.createElement('option');
          emptyOption.value = '';
          emptyOption.textContent = placeholder;
          select.appendChild(emptyOption);
        }
        for (let i = 0; i < options.length; i++) {
          const option = document.createElement('option');
          option.value = options[i].value;
          option.textContent = options[i].label;
          select.appendChild(option);
        }
        select.value = (selectedValue === undefined || selectedValue === null) ? '' : selectedValue;
      }

      // 店長画面：発注管理
      // サーバーから受け取った最新の発注管理情報（業者・食材・発注履歴）。送信のたびに丸ごと入れ替える
      let orderBoard = null;

      // ドロップダウンで選んでいる表示項目。'cart' / 'confirm' / 'history' / 'vendor' のどれか1つだけを表示する
      let orderView = 'cart';

      // これから発注する食材（[{ ingredientId, quantity }]）。送信できるまで画面の中だけで持つ
      let orderCart = [];

      // 「この業者へ発注」で絞り込んでいる業者ID（空文字ならすべての業者から選べる）
      let orderVendorFilterId = '';

      // 業者詳細で開いている業者ID（空文字なら業者の一覧を出す）
      let orderSelectedVendorId = '';

      // 業者詳細で「取扱食材を見る」を開いているか
      let orderVendorItemsOpen = false;

      // 確認画面で組み立てた、業者ごとの発注メール
      let orderDrafts = [];

      // 送信1回分の操作キー。通信のやり直しで同じメールを二重に送らないために使う
      let orderSendKey = '';

      // 送信中かどうか。送信中に確認内容を描き直しても、送信ボタンを押せる状態に戻さないために使う
      let orderSending = false;

      /**
       * 発注管理の情報をサーバーから取得する
       * @return {void} 戻り値なし
       */
      function loadOrderBoard() {
        document.getElementById('order_reload_btn').disabled = true;
        showOrderMessage('読み込み中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (board) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            document.getElementById('order_reload_btn').disabled = false;
            showOrderMessage('', false);
            applyOrderBoard(board);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            document.getElementById('order_reload_btn').disabled = false;
            document.getElementById('order_body').style.display = 'none';
            showOrderMessage('エラー: ' + error.message, true);
          })
          .getOrderBoard(authToken);
      }

      /**
       * 受け取った発注管理情報で画面を作り直す
       * 一覧から消えた食材は、発注する食材からも外す
       * @param {Object} board サーバーから届いた発注管理情報
       * @return {void} 戻り値なし
       */
      function applyOrderBoard(board) {
        orderBoard = board;
        document.getElementById('order_body').style.display = 'block';

        const keptCart = [];
        for (let i = 0; i < orderCart.length; i++) {
          if (findOrderItemById(orderCart[i].ingredientId)) {
            keptCart.push(orderCart[i]);
          }
        }
        orderCart = keptCart;

        if (orderSelectedVendorId !== '' && !findOrderVendorById(orderSelectedVendorId)) {
          orderSelectedVendorId = '';
        }
        renderOrderView();
      }

      function showOrderMessage(message, isError) {
        const messageEl = document.getElementById('order_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 表示項目を切り替える
       * 4つの表示のうち、選ばれた1つだけを出す
       * @param {string} viewName 'cart' / 'confirm' / 'history' / 'vendor'
       * @return {void} 戻り値なし
       */
      function changeOrderView(viewName) {
        orderView = viewName;
        document.getElementById('order_view_select').value = viewName;
        renderOrderView();
      }

      /**
       * いま選ばれている表示項目だけを描き直す
       * @return {void} 戻り値なし
       */
      function renderOrderView() {
        const views = ['cart', 'confirm', 'history', 'vendor'];
        for (let i = 0; i < views.length; i++) {
          document.getElementById('order_view_' + views[i]).style.display = (views[i] === orderView) ? 'block' : 'none';
        }
        if (!orderBoard) {
          return;
        }
        if (orderView === 'cart') {
          renderOrderCart();
        } else if (orderView === 'confirm') {
          refreshOrderConfirm();
        } else if (orderView === 'history') {
          renderOrderHistory();
        } else if (orderView === 'vendor') {
          renderOrderVendor();
        }
      }

      /**
       * 要素を1つ作る（class名と表示文字をまとめて指定する）
       */
      function createOrderElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        if (text !== undefined && text !== null) {
          element.textContent = text;
        }
        return element;
      }

      /**
       * 押すと別の表示に移る文字（業者名など）を作る
       */
      function createOrderLinkButton(text, onClick) {
        const button = createOrderElement('button', 'order-link', text);
        button.type = 'button';
        button.addEventListener('click', onClick);
        return button;
      }

      function findOrderItemById(ingredientId) {
        for (let i = 0; i < orderBoard.items.length; i++) {
          if (orderBoard.items[i].id === ingredientId) {
            return orderBoard.items[i];
          }
        }
        return null;
      }

      function findOrderVendorById(vendorId) {
        for (let i = 0; i < orderBoard.vendors.length; i++) {
          if (orderBoard.vendors[i].id === vendorId) {
            return orderBoard.vendors[i];
          }
        }
        return null;
      }

      function findOrderCartItem(ingredientId) {
        for (let i = 0; i < orderCart.length; i++) {
          if (orderCart[i].ingredientId === ingredientId) {
            return orderCart[i];
          }
        }
        return null;
      }

      // 数量は小数第1位までにそろえる（キロ単位の食材を 0.5 きざみで発注できるようにする）
      function roundOrderQuantity(quantity) {
        return Math.round(quantity * 10) / 10;
      }

      // 発注する食材

      /**
       * 発注する食材の一覧を描き直す
       * @return {void} 戻り値なし
       */
      function renderOrderCart() {
        renderOrderCartFilter();

        const list = document.getElementById('order_cart_list');
        list.innerHTML = '';

        if (orderCart.length === 0) {
          list.appendChild(createOrderElement('div', 'order-empty',
            '発注する食材がまだありません。「＋ 食材を追加」から選んでください。'));
          document.getElementById('order_cart_footer').style.display = 'none';
          return;
        }

        for (let i = 0; i < orderCart.length; i++) {
          const cartItem = orderCart[i];
          const item = findOrderItemById(cartItem.ingredientId);
          if (!item) {
            continue;
          }
          list.appendChild(createOrderCartCard(item, cartItem));
        }
        document.getElementById('order_cart_footer').style.display = 'flex';
      }

      /**
       * 発注する食材1件分のカードを作る
       */
      function createOrderCartCard(item, cartItem) {
        const card = createOrderElement('div', 'order-cart-card');
        card.appendChild(createOrderElement('div', 'order-cart-name', item.name));

        const quantityBox = createOrderElement('div', 'order-cart-quantity');
        const minusBtn = createOrderElement('button', 'order-step-btn', '−');
        minusBtn.type = 'button';
        minusBtn.setAttribute('aria-label', item.name + 'の数量を減らす');
        minusBtn.addEventListener('click', function () { changeOrderQuantity(item.id, -1); });
        quantityBox.appendChild(minusBtn);

        const input = document.createElement('input');
        input.type = 'number';
        input.className = 'order-quantity-input';
        input.min = '0';
        input.step = '0.1';
        input.value = String(cartItem.quantity);
        input.setAttribute('aria-label', item.name + 'の数量');
        input.addEventListener('change', function () { setOrderQuantity(item.id, this.value); });
        quantityBox.appendChild(input);

        const plusBtn = createOrderElement('button', 'order-step-btn', '＋');
        plusBtn.type = 'button';
        plusBtn.setAttribute('aria-label', item.name + 'の数量を増やす');
        plusBtn.addEventListener('click', function () { changeOrderQuantity(item.id, 1); });
        quantityBox.appendChild(plusBtn);

        quantityBox.appendChild(createOrderElement('span', 'order-cart-unit', item.unit));
        card.appendChild(quantityBox);

        // 業者は食材マスタの設定から自動で決まる。押すとその業者の詳細を開く
        const vendorBox = createOrderElement('div', 'order-cart-vendor');
        vendorBox.appendChild(document.createTextNode('業者：'));
        if (item.vendorId === '') {
          vendorBox.appendChild(document.createTextNode('未設定'));
        } else {
          vendorBox.appendChild(createOrderLinkButton(item.vendorName, function () {
            openOrderVendorDetail(item.vendorId);
          }));
        }
        card.appendChild(vendorBox);

        const removeBtn = createOrderElement('button', 'order-remove-btn', '削除');
        removeBtn.type = 'button';
        removeBtn.addEventListener('click', function () { removeOrderCartItem(item.id); });
        card.appendChild(removeBtn);
        return card;
      }

      /**
       * 「この業者へ発注」で絞り込んでいるときの案内を出す
       */
      function renderOrderCartFilter() {
        const box = document.getElementById('order_cart_filter');
        box.innerHTML = '';
        const vendor = orderVendorFilterId === '' ? null : findOrderVendorById(orderVendorFilterId);
        if (!vendor) {
          box.style.display = 'none';
          return;
        }
        box.appendChild(createOrderElement('span', '', vendor.name + ' の取扱食材から追加できます'));
        box.appendChild(createOrderLinkButton('絞り込みを解除', function () {
          orderVendorFilterId = '';
          renderOrderCart();
        }));
        box.style.display = 'flex';
      }

      /**
       * 発注する食材を1件追加する（すでにあるときは数量を1つ増やす）
       * @param {string} ingredientId 食材ID
       * @return {void} 戻り値なし
       */
      function addOrderCartItem(ingredientId) {
        const item = findOrderItemById(ingredientId);
        if (!item) {
          return;
        }
        const cartItem = findOrderCartItem(ingredientId);
        if (cartItem) {
          changeOrderQuantity(ingredientId, 1);
        } else {
          orderCart.push({ 'ingredientId': ingredientId, 'quantity': 1 });
        }
        if (orderView === 'cart') {
          renderOrderCart();
        }
      }

      /**
       * ＋ / − ボタンで数量を変える
       * 0以下にはしない（やめるときは削除ボタンを使う）
       */
      function changeOrderQuantity(ingredientId, delta) {
        const cartItem = findOrderCartItem(ingredientId);
        if (!cartItem) {
          return;
        }
        const next = roundOrderQuantity(cartItem.quantity + delta);
        if (next <= 0 || next > orderBoard.maxQuantity) {
          return;
        }
        cartItem.quantity = next;
        renderOrderCart();
      }

      /**
       * 数量欄に直接入力された値を反映する
       */
      function setOrderQuantity(ingredientId, value) {
        const cartItem = findOrderCartItem(ingredientId);
        if (!cartItem) {
          return;
        }
        const quantity = roundOrderQuantity(Number(value));
        if (isFinite(quantity) && quantity > 0 && quantity <= orderBoard.maxQuantity) {
          cartItem.quantity = quantity;
        }
        renderOrderCart(); // 入力できない値だったときは、いまの数量に戻す
      }

      function removeOrderCartItem(ingredientId) {
        const kept = [];
        for (let i = 0; i < orderCart.length; i++) {
          if (orderCart[i].ingredientId !== ingredientId) {
            kept.push(orderCart[i]);
          }
        }
        orderCart = kept;
        renderOrderCart();
      }

      function clearOrderCart() {
        orderCart = [];
        renderOrderCart();
      }

      // 食材を追加するダイアログ

      /**
       * 食材を選ぶダイアログを開く
       * @param {string} vendorId 先に絞り込んでおく業者ID（空文字ならすべての業者）
       * @return {void} 戻り値なし
       */
      function openOrderItemModal(vendorId) {
        if (!orderBoard) {
          showOrderMessage('発注の情報を読み込めていません。「更新」を押してください', true);
          return;
        }
        const options = [];
        for (let i = 0; i < orderBoard.vendors.length; i++) {
          options.push({ 'value': orderBoard.vendors[i].id, 'label': orderBoard.vendors[i].name });
        }
        const selectedVendorId = (vendorId !== undefined && vendorId !== '') ? vendorId : orderVendorFilterId;
        fillIngredientSelect('order_item_vendor', options, selectedVendorId, 'すべての業者');
        document.getElementById('order_item_error').textContent = '';
        renderOrderItemChoices();
        document.getElementById('order_item_overlay').style.display = 'flex';
      }

      /**
       * ダイアログの中に、選べる食材を業者ごとに並べる
       * @return {void} 戻り値なし
       */
      function renderOrderItemChoices() {
        const container = document.getElementById('order_item_choices');
        container.innerHTML = '';
        const vendorId = document.getElementById('order_item_vendor').value;

        let currentGroupName = null;
        let buttonsBox = null;
        let shownCount = 0;
        for (let i = 0; i < orderBoard.items.length; i++) {
          const item = orderBoard.items[i];
          if (vendorId !== '' && item.vendorId !== vendorId) {
            continue;
          }
          const groupName = item.vendorId === '' ? '業者が未設定の食材（発注できません）' : item.vendorName;
          if (groupName !== currentGroupName) {
            container.appendChild(createOrderElement('div', 'order-item-group-name', groupName));
            buttonsBox = createOrderElement('div', 'order-item-buttons');
            container.appendChild(buttonsBox);
            currentGroupName = groupName;
          }

          const inCart = findOrderCartItem(item.id);
          const button = createOrderElement('button', 'order-item-btn' + (inCart ? ' added' : ''),
            item.name + (inCart ? '（追加済み ' + inCart.quantity + item.unit + '）' : '　' + item.unit));
          button.type = 'button';
          if (item.vendorId === '') {
            button.disabled = true; // 業者が決まっていない食材は、どこへ発注するか判断できないので選べない
          } else {
            button.addEventListener('click', function () {
              addOrderCartItem(item.id);
              renderOrderItemChoices();
            });
          }
          buttonsBox.appendChild(button);
          shownCount++;
        }

        if (shownCount === 0) {
          container.appendChild(createOrderElement('div', 'order-empty', '選べる食材がありません。'));
        }
      }

      // 発注内容確認

      /**
       * いまの発注内容を業者ごとにまとめ直し、送るメールの内容をサーバーに組み立ててもらう
       * 確認した内容とそのまま同じメールを送るため、文面は画面では作らない
       * @return {void} 戻り値なし
       */
      function refreshOrderConfirm() {
        const list = document.getElementById('order_confirm_list');
        list.innerHTML = '';
        document.getElementById('order_send_footer').style.display = 'none';
        orderDrafts = [];

        if (orderCart.length === 0) {
          showOrderConfirmMessage('発注する食材が選ばれていません。「発注する食材」から追加してください', false);
          return;
        }
        showOrderConfirmMessage('発注内容を作成中...', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showOrderConfirmMessage('', false);
            renderOrderConfirm(result.drafts);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            showOrderConfirmMessage('エラー: ' + error.message, true);
          })
          .getOrderDrafts({
            'authToken': authToken,
            'items': orderCart,
            'deliveryDate': document.getElementById('order_delivery_date').value,
            'note': document.getElementById('order_extra_note').value
          });
      }

      function showOrderConfirmMessage(message, isError) {
        const messageEl = document.getElementById('order_confirm_message');
        messageEl.textContent = message;
        if (isError) {
          messageEl.classList.add('error');
        } else {
          messageEl.classList.remove('error');
        }
      }

      /**
       * 業者ごとにまとめた発注内容と、送るメールの内容を描く
       * @param {Array<Object>} drafts サーバーが組み立てた業者ごとの発注メール
       * @return {void} 戻り値なし
       */
      function renderOrderConfirm(drafts) {
        orderDrafts = drafts;
        const list = document.getElementById('order_confirm_list');
        list.innerHTML = '';

        for (let i = 0; i < drafts.length; i++) {
          list.appendChild(createOrderConfirmCard(drafts[i]));
        }

        const footer = document.getElementById('order_send_footer');
        updateOrderSendButton();
        if (!orderSending) {
          showOrderSendStatus('', false);
        }
        footer.style.display = drafts.length > 0 ? 'flex' : 'none';
      }

      /**
       * 業者1社分の確認カードを作る
       */
      function createOrderConfirmCard(draft) {
        const card = createOrderElement('div', 'order-vendor-card');

        const title = createOrderElement('div', 'order-vendor-card-title');
        title.appendChild(createOrderLinkButton(draft.vendorName, function () {
          openOrderVendorDetail(draft.vendorId);
        }));
        card.appendChild(title);

        const meta = createOrderElement('div', 'order-vendor-meta');
        meta.appendChild(createOrderElement('div', '', '送信先：' + (draft.to === '' ? '未登録' : draft.to)));
        if (draft.orderNote !== '') {
          meta.appendChild(createOrderElement('div', '', '発注時の注意事項：' + draft.orderNote));
        }
        card.appendChild(meta);

        const lines = createOrderElement('ul', 'order-line-list');
        for (let i = 0; i < draft.lines.length; i++) {
          const li = document.createElement('li');
          li.appendChild(createOrderElement('span', '', draft.lines[i].name));
          li.appendChild(createOrderElement('span', 'order-line-quantity', draft.lines[i].quantityText));
          lines.appendChild(li);
        }
        card.appendChild(lines);

        if (draft.appliedRuleTexts.length > 0) {
          const ruleList = createOrderElement('ul', 'order-rule-list');
          for (let i = 0; i < draft.appliedRuleTexts.length; i++) {
            ruleList.appendChild(createOrderElement('li', '', draft.appliedRuleTexts[i]));
          }
          card.appendChild(ruleList);
        }

        card.appendChild(createOrderElement('div', 'order-mail-subject', '件名：' + draft.subject));
        card.appendChild(createOrderElement('pre', 'order-mail-preview', draft.body));

        if (!draft.canSend) {
          card.appendChild(createOrderElement('div', 'modal-error', draft.sendBlockReason));
        }
        return card;
      }

      /**
       * 送信ボタンの文言と押せるかどうかを、いまの状態に合わせる
       * 例：2業者なら「2社へ発注する」と表示する
       * @return {void} 戻り値なし
       */
      function updateOrderSendButton() {
        const sendBtn = document.getElementById('order_send_btn');
        sendBtn.textContent = orderSending ? '送信中...' : (orderDrafts.length + '社へ発注する');
        sendBtn.disabled = orderSending;
      }

      function showOrderSendStatus(message, isError) {
        const statusEl = document.getElementById('order_send_status');
        statusEl.textContent = message;
        if (isError) {
          statusEl.classList.add('error');
        } else {
          statusEl.classList.remove('error');
        }
      }

      /**
       * 業者ごとの発注メールを送り、送れた分を発注履歴に保存する
       * @return {void} 戻り値なし
       */
      function submitOrderMails() {
        if (orderSending || orderDrafts.length === 0) {
          return; // 送信中の連打は無視する
        }
        if (orderSendKey === '') {
          orderSendKey = createIngredientOperationKey();
        }

        orderSending = true;
        updateOrderSendButton();
        showOrderSendStatus('', false);

        const sessionId = loginSessionId;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            orderSending = false;
            updateOrderSendButton();
            orderSendKey = ''; // 送信が終わったので、次の発注では新しい操作キーを使う
            applyOrderAfterSend(result);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            orderSending = false;
            updateOrderSendButton();
            // 送れていないので発注内容はそのまま残し、同じ操作キーでやり直せるようにする
            showOrderSendStatus('エラー: ' + error.message, true);
          })
          .sendOrderMails({
            'authToken': authToken,
            'operationKey': orderSendKey,
            'items': orderCart,
            'deliveryDate': document.getElementById('order_delivery_date').value,
            'note': document.getElementById('order_extra_note').value
          });
      }

      /**
       * 送信結果を画面に反映する
       * 送れた業者の食材だけを発注一覧から外し、送れなかった分は残す
       * @param {Object} result サーバーから届いた送信結果
       * @return {void} 戻り値なし
       */
      function applyOrderAfterSend(result) {
        const detail = result.detail;
        if (!detail) {
          // 同じ送信が二重に届いたとき（サーバーはメールを送り直していない）
          orderCart = [];
        } else {
          const keptCart = [];
          for (let i = 0; i < orderCart.length; i++) {
            const item = findOrderItemById(orderCart[i].ingredientId);
            if (item && detail.sentVendorIds.indexOf(item.vendorId) === -1) {
              keptCart.push(orderCart[i]);
            }
          }
          orderCart = keptCart;
        }

        const hasFailure = !!(detail && detail.failures && detail.failures.length > 0);
        applyOrderBoard(result.board);
        showOrderMessage(result.message, hasFailure);

        if (!hasFailure && orderCart.length === 0) {
          document.getElementById('order_delivery_date').value = '';
          document.getElementById('order_extra_note').value = '';
          changeOrderView('history'); // 保存された発注履歴をそのまま確認できるようにする
        } else {
          showOrderSendStatus(result.message, hasFailure);
        }
      }

      // 発注履歴

      /**
       * 発注履歴を新しい順に描く
       * @return {void} 戻り値なし
       */
      function renderOrderHistory() {
        const list = document.getElementById('order_history_list');
        list.innerHTML = '';
        document.getElementById('order_history_message').textContent =
          '新しい発注が上に表示されます（' + orderBoard.nowText + ' 時点）';

        if (orderBoard.history.length === 0) {
          list.appendChild(createOrderElement('div', 'order-empty', '発注の記録はまだありません。'));
          return;
        }
        for (let i = 0; i < orderBoard.history.length; i++) {
          list.appendChild(createOrderHistoryCard(orderBoard.history[i]));
        }
      }

      /**
       * 発注履歴1件分のカードを作る
       */
      function createOrderHistoryCard(history) {
        const card = createOrderElement('div', 'order-history-card');

        const head = createOrderElement('div', 'order-history-head');
        head.appendChild(createOrderElement('span', 'order-history-date', history.orderedAtLabel));
        if (history.vendorId === '') {
          head.appendChild(createOrderElement('span', '', history.vendorName));
        } else {
          head.appendChild(createOrderLinkButton(history.vendorName, function () {
            openOrderVendorDetail(history.vendorId);
          }));
        }
        head.appendChild(createOrderElement('span', 'order-history-tag', history.channelText));
        card.appendChild(head);

        const lines = createOrderElement('ul', 'order-line-list');
        for (let i = 0; i < history.lines.length; i++) {
          const li = document.createElement('li');
          li.appendChild(createOrderElement('span', '', history.lines[i].name));
          li.appendChild(createOrderElement('span', 'order-line-quantity', history.lines[i].quantityText));
          lines.appendChild(li);
        }
        card.appendChild(lines);

        const meta = createOrderElement('div', 'order-history-meta');
        meta.appendChild(createOrderElement('div', '', '発注日時：' + history.orderedAt));
        meta.appendChild(createOrderElement('div', '', '発注者：' + (history.orderedBy === '' ? '記録なし' : history.orderedBy)));
        if (history.mailTo !== '') {
          meta.appendChild(createOrderElement('div', '', '送信先：' + history.mailTo));
        }
        if (history.expectedDate !== '') {
          meta.appendChild(createOrderElement('div', '', '入荷予定日：' + history.expectedDate));
        }
        meta.appendChild(createOrderElement('div', '', '状態：' + history.statusTexts.join('・')));
        card.appendChild(meta);
        return card;
      }

      // 業者詳細

      /**
       * 業者一覧か、選んだ業者の詳細のどちらかを出す
       * @return {void} 戻り値なし
       */
      function renderOrderVendor() {
        const listEl = document.getElementById('order_vendor_list');
        const detailEl = document.getElementById('order_vendor_detail');
        const vendor = orderSelectedVendorId === '' ? null : findOrderVendorById(orderSelectedVendorId);

        if (vendor) {
          listEl.style.display = 'none';
          detailEl.style.display = 'block';
          document.getElementById('order_vendor_heading').textContent = '業者詳細';
          document.getElementById('order_vendor_message').textContent = '';
          renderOrderVendorDetail(vendor);
          return;
        }

        detailEl.style.display = 'none';
        listEl.style.display = 'flex';
        document.getElementById('order_vendor_heading').textContent = '業者詳細';
        document.getElementById('order_vendor_message').textContent = '業者を選ぶと、連絡先と発注の条件を表示します';
        renderOrderVendorList();
      }

      function renderOrderVendorList() {
        const listEl = document.getElementById('order_vendor_list');
        listEl.innerHTML = '';
        if (orderBoard.vendors.length === 0) {
          listEl.appendChild(createOrderElement('div', 'order-empty',
            '業者が登録されていません。「業者・発注条件」から登録してください。'));
          return;
        }
        for (let i = 0; i < orderBoard.vendors.length; i++) {
          const vendor = orderBoard.vendors[i];
          const tile = createOrderElement('button', 'order-vendor-tile');
          tile.type = 'button';
          tile.appendChild(createOrderElement('div', 'order-vendor-tile-name', vendor.name));
          const meta = createOrderElement('div', 'order-vendor-tile-meta');
          meta.appendChild(createOrderElement('div', '', '電話：' + (vendor.phone === '' ? '未登録' : vendor.phone)));
          meta.appendChild(createOrderElement('div', '', '主な取扱商品：' + (vendor.mainItems === '' ? '未登録' : vendor.mainItems)));
          tile.appendChild(meta);
          tile.addEventListener('click', function () { openOrderVendorDetail(vendor.id); });
          listEl.appendChild(tile);
        }
      }

      /**
       * 業者詳細を開く（ほかの表示から業者名を押したときにも使う）
       * @param {string} vendorId 業者ID
       * @return {void} 戻り値なし
       */
      function openOrderVendorDetail(vendorId) {
        orderSelectedVendorId = vendorId;
        orderVendorItemsOpen = false;
        changeOrderView('vendor');
      }

      /**
       * 選んだ業者の詳細・取扱食材・直近の発注を描く
       * @param {Object} vendor 業者
       * @return {void} 戻り値なし
       */
      function renderOrderVendorDetail(vendor) {
        const container = document.getElementById('order_vendor_detail');
        container.innerHTML = '';
        container.appendChild(createOrderElement('h4', 'order-view-heading', vendor.name));

        const actions = createOrderElement('div', 'order-detail-actions');
        const backBtn = createOrderElement('button', 'ingredient-action-btn ingredient-action-sub', '業者一覧へ戻る');
        backBtn.type = 'button';
        backBtn.addEventListener('click', function () {
          orderSelectedVendorId = '';
          renderOrderVendor();
        });
        actions.appendChild(backBtn);

        const orderBtn = createOrderElement('button', 'ingredient-action-btn', 'この業者へ発注');
        orderBtn.type = 'button';
        orderBtn.addEventListener('click', function () { startOrderForVendor(vendor.id); });
        actions.appendChild(orderBtn);

        const itemsBtn = createOrderElement('button', 'ingredient-action-btn ingredient-action-sub',
          orderVendorItemsOpen ? '取扱食材を閉じる' : '取扱食材を見る');
        itemsBtn.type = 'button';
        itemsBtn.addEventListener('click', function () {
          orderVendorItemsOpen = !orderVendorItemsOpen;
          renderOrderVendorDetail(vendor);
        });
        actions.appendChild(itemsBtn);
        container.appendChild(actions);

        container.appendChild(createOrderVendorDetailGrid(vendor));

        if (orderVendorItemsOpen) {
          container.appendChild(createOrderElement('h4', 'order-subheading', '取扱食材'));
          container.appendChild(createOrderVendorItemList(vendor));
        }

        container.appendChild(createOrderElement('h4', 'order-subheading', '直近の発注'));
        container.appendChild(createOrderVendorRecentHistory(vendor));
      }

      /**
       * 業者の登録内容を表にする（未登録の項目は「未登録」と出し、推測で埋めない）
       */
      function createOrderVendorDetailGrid(vendor) {
        const rows = [
          ['業者名', vendor.name],
          ['住所', vendor.address],
          ['電話番号', vendor.phone],
          ['メールアドレス', vendor.email],
          ['発注メールの送信先', vendor.mailToText],
          ['営業時間', vendor.businessHours],
          ['定休日', vendor.closedDays],
          ['発注締切', vendor.deadlineText],
          ['通常納品日数', vendor.leadTimeText],
          ['配送曜日', vendor.deliveryDaysText],
          ['主な取扱商品', vendor.mainItems],
          ['発注時の注意事項', vendor.orderNote],
          ['備考', vendor.note]
        ];
        const grid = createOrderElement('div', 'order-detail-grid');
        for (let i = 0; i < rows.length; i++) {
          grid.appendChild(createOrderElement('div', 'order-detail-label', rows[i][0]));
          const hasValue = (rows[i][1] !== undefined && rows[i][1] !== null && rows[i][1] !== '');
          grid.appendChild(createOrderElement('div', 'order-detail-value' + (hasValue ? '' : ' unset'),
            hasValue ? rows[i][1] : '未登録'));
        }
        return grid;
      }

      /**
       * その業者に紐付いている食材の一覧を作る
       */
      function createOrderVendorItemList(vendor) {
        const box = createOrderElement('div', 'order-item-buttons');
        let count = 0;
        for (let i = 0; i < orderBoard.items.length; i++) {
          const item = orderBoard.items[i];
          if (item.vendorId !== vendor.id) {
            continue;
          }
          const inCart = findOrderCartItem(item.id);
          const button = createOrderElement('button', 'order-item-btn' + (inCart ? ' added' : ''),
            item.name + '　' + item.unit + (item.productCode === '' ? '' : '（' + item.productCode + '）'));
          button.type = 'button';
          button.addEventListener('click', function () {
            addOrderCartItem(item.id);
            renderOrderVendorDetail(vendor);
          });
          box.appendChild(button);
          count++;
        }
        if (count === 0) {
          return createOrderElement('div', 'order-empty',
            'この業者に紐付いた食材がありません。「業者・発注条件」で食材に業者を設定してください。');
        }
        return box;
      }

      /**
       * その業者への直近の発注を作る
       */
      function createOrderVendorRecentHistory(vendor) {
        const box = createOrderElement('div', 'order-history-list');
        let count = 0;
        for (let i = 0; i < orderBoard.history.length; i++) {
          const history = orderBoard.history[i];
          if (history.vendorId !== vendor.id || count >= orderBoard.recentHistoryCount) {
            continue;
          }
          box.appendChild(createOrderHistoryCard(history));
          count++;
        }
        if (count === 0) {
          return createOrderElement('div', 'order-empty', 'この業者への発注の記録はまだありません。');
        }
        return box;
      }

      /**
       * 業者詳細から発注へ移る
       * その業者の食材だけを選べる状態にして、食材を追加するダイアログを開く
       * @param {string} vendorId 業者ID
       * @return {void} 戻り値なし
       */
      function startOrderForVendor(vendorId) {
        orderVendorFilterId = vendorId;
        changeOrderView('cart');
        openOrderItemModal(vendorId);
      }

      // 業者・発注条件の設定
      // 発注に必要なマスタ（業者の連絡先・発注条件と、食材の業者・発注単位・商品コード）だけを編集する

      // 業者と食材は別々の保存なので、操作キーもそれぞれ用意する
      const orderSettingKeys = {};

      /**
       * 「業者・発注条件の設定」ダイアログを開く
       * 開くたびに新しい操作キーを作り、保存が成功するまでは同じキーを使い続ける
       * @return {void} 戻り値なし
       */
      function openOrderSettingModal() {
        if (!orderBoard) {
          showOrderMessage('発注の情報を読み込めていません。「更新」を押してください', true);
          return;
        }
        orderSettingKeys.supplier = createIngredientOperationKey();
        orderSettingKeys.master = createIngredientOperationKey();

        const settings = orderBoard.settings;
        buildOrderWeekdayCheckboxes('supplier_order_days');
        buildOrderWeekdayCheckboxes('supplier_ship_days');
        buildOrderWeekdayCheckboxes('supplier_delivery_days');
        buildOrderWeekdayCheckboxes('supplier_pickup_days');
        fillIngredientSelect('supplier_lead_count', toOrderOptions(settings.leadTimeCounts), '営業日', '');
        fillIngredientSelect('master_order_unit', toOrderOptions(settings.orderUnits), '', '発注単位を設定しない');
        refreshOrderSettingSelects();
        document.getElementById('supplier_error').textContent = '';
        document.getElementById('master_error').textContent = '';
        document.getElementById('order_setting_overlay').style.display = 'flex';
      }

      /**
       * 値と表示が同じ選択肢の配列を作る
       */
      function toOrderOptions(values) {
        const options = [];
        for (let i = 0; i < values.length; i++) {
          options.push({ 'value': values[i], 'label': values[i] });
        }
        return options;
      }

      /**
       * 未入力なら保存せずにエラーにする
       */
      function requireOrderValue(inputId, label) {
        const value = document.getElementById(inputId).value;
        if (value === '' || value === null) {
          throw new Error(label + 'を入力してください');
        }
        return value;
      }

      /**
       * 設定ダイアログの「編集する業者」「編集する食材」の選択肢を作り直す
       * @return {void} 戻り値なし
       */
      function refreshOrderSettingSelects() {
        const settings = orderBoard.settings;

        const supplierOptions = [];
        for (let i = 0; i < settings.suppliers.length; i++) {
          supplierOptions.push({ 'value': settings.suppliers[i].id, 'label': settings.suppliers[i].name });
        }
        const currentSupplierId = document.getElementById('supplier_select').value;
        fillIngredientSelect('supplier_select', supplierOptions, currentSupplierId, '新しい業者を追加');
        fillIngredientSelect('master_supplier', supplierOptions, '', '業者を設定しない');

        const masterOptions = [];
        for (let i = 0; i < settings.masters.length; i++) {
          const master = settings.masters[i];
          masterOptions.push({
            'value': master.id,
            'label': master.name + (master.active ? '' : '（発注しない）')
          });
        }
        const currentMasterId = document.getElementById('master_select').value;
        fillIngredientSelect('master_select', masterOptions, currentMasterId, '新しい食材を追加');

        applyOrderSupplierToForm();
        applyOrderMasterToForm();
      }

      /**
       * 曜日のチェックボックスを作る
       */
      function buildOrderWeekdayCheckboxes(containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const labels = orderBoard.settings.weekdayLabels;
        for (let i = 0; i < labels.length; i++) {
          const label = document.createElement('label');
          label.className = 'ingredient-weekday';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = labels[i];
          label.appendChild(checkbox);
          const text = document.createElement('span');
          text.textContent = labels[i];
          label.appendChild(text);
          container.appendChild(label);
        }
      }

      /**
       * 曜日のチェックボックスに保存済みの設定を反映する
       */
      function setOrderWeekdayCheckboxes(containerId, weekdayText) {
        const selected = (weekdayText === '' || weekdayText === undefined) ? [] : weekdayText.split('・');
        const checkboxes = document.getElementById(containerId).querySelectorAll('input');
        for (let i = 0; i < checkboxes.length; i++) {
          checkboxes[i].checked = (selected.indexOf(checkboxes[i].value) !== -1);
        }
      }

      /**
       * チェックされた曜日を配列で取り出す
       */
      function collectOrderWeekdays(containerId) {
        const days = [];
        const checkboxes = document.getElementById(containerId).querySelectorAll('input');
        for (let i = 0; i < checkboxes.length; i++) {
          if (checkboxes[i].checked) {
            days.push(checkboxes[i].value);
          }
        }
        return days;
      }

      /**
       * 設定ダイアログの中から業者1件を探す
       */
      function findOrderSettingSupplierById(supplierId) {
        const suppliers = orderBoard.settings.suppliers;
        for (let i = 0; i < suppliers.length; i++) {
          if (suppliers[i].id === supplierId) {
            return suppliers[i];
          }
        }
        return null;
      }

      /**
       * 設定ダイアログの中から食材1件を探す
       */
      function findOrderSettingMasterById(ingredientId) {
        const masters = orderBoard.settings.masters;
        for (let i = 0; i < masters.length; i++) {
          if (masters[i].id === ingredientId) {
            return masters[i];
          }
        }
        return null;
      }

      /**
       * 選んだ業者の設定を入力欄に反映する
       */
      function applyOrderSupplierToForm() {
        const supplier = findOrderSettingSupplierById(document.getElementById('supplier_select').value);
        document.getElementById('supplier_name').value = supplier ? supplier.name : '';
        document.getElementById('supplier_deadline').value = supplier ? supplier.deadlineTime : '';
        document.getElementById('supplier_lead_time').value = (supplier && supplier.leadTimeDays !== null) ? supplier.leadTimeDays : '';
        document.getElementById('supplier_lead_count').value = (supplier && supplier.leadTimeCount !== '') ? supplier.leadTimeCount : '営業日';
        document.getElementById('supplier_closed_dates').value = supplier ? supplier.closedDatesText : '';
        document.getElementById('supplier_note').value = supplier ? supplier.note : '';
        document.getElementById('supplier_address').value = supplier ? supplier.address : '';
        document.getElementById('supplier_phone').value = supplier ? supplier.phone : '';
        document.getElementById('supplier_email').value = supplier ? supplier.email : '';
        document.getElementById('supplier_business_hours').value = supplier ? supplier.businessHours : '';
        document.getElementById('supplier_closed_days').value = supplier ? supplier.closedDays : '';
        document.getElementById('supplier_main_items').value = supplier ? supplier.mainItems : '';
        document.getElementById('supplier_order_note').value = supplier ? supplier.orderNote : '';
        setOrderWeekdayCheckboxes('supplier_order_days', supplier ? supplier.orderDaysText : '');
        setOrderWeekdayCheckboxes('supplier_ship_days', supplier ? supplier.shipDaysText : '');
        setOrderWeekdayCheckboxes('supplier_delivery_days', supplier ? supplier.deliveryDaysText : '');
        setOrderWeekdayCheckboxes('supplier_pickup_days', supplier ? supplier.pickupDaysText : '');
        document.getElementById('supplier_plan_text').textContent = supplier
          ? supplier.planText : '業者を保存すると、次に納品できる日と発注締切を表示します';
      }

      /**
       * 選んだ食材の設定を入力欄に反映する
       */
      function applyOrderMasterToForm() {
        const master = findOrderSettingMasterById(document.getElementById('master_select').value);
        document.getElementById('master_name').value = master ? master.name : '';
        document.getElementById('master_supplier').value = master ? master.supplierId : '';
        document.getElementById('master_order_unit').value = master ? master.orderUnit : '';
        document.getElementById('master_product_code').value = master ? master.productCode : '';
        document.getElementById('master_active').checked = master ? master.active : true;
      }

      function submitOrderSupplier() {
        runOrderSettingSave({
          'errorId': 'supplier_error',
          'submitBtnId': 'supplier_submit_btn',
          'keyName': 'supplier',
          'method': 'saveIngredientSupplier',
          'buildPayload': function () {
            return {
              'supplierId': document.getElementById('supplier_select').value,
              'name': requireOrderValue('supplier_name', '業者名'),
              'deadlineTime': document.getElementById('supplier_deadline').value,
              'orderDays': collectOrderWeekdays('supplier_order_days'),
              'shipDays': collectOrderWeekdays('supplier_ship_days'),
              'deliveryDays': collectOrderWeekdays('supplier_delivery_days'),
              'pickupDays': collectOrderWeekdays('supplier_pickup_days'),
              'leadTimeDays': document.getElementById('supplier_lead_time').value,
              'leadTimeCount': document.getElementById('supplier_lead_count').value,
              'closedDates': document.getElementById('supplier_closed_dates').value,
              'note': document.getElementById('supplier_note').value,
              'address': document.getElementById('supplier_address').value,
              'phone': document.getElementById('supplier_phone').value,
              'email': document.getElementById('supplier_email').value,
              'businessHours': document.getElementById('supplier_business_hours').value,
              'closedDays': document.getElementById('supplier_closed_days').value,
              'mainItems': document.getElementById('supplier_main_items').value,
              'orderNote': document.getElementById('supplier_order_note').value
            };
          }
        });
      }

      function submitOrderMaster() {
        runOrderSettingSave({
          'errorId': 'master_error',
          'submitBtnId': 'master_submit_btn',
          'keyName': 'master',
          'method': 'saveIngredientMaster',
          'buildPayload': function () {
            return {
              'ingredientId': document.getElementById('master_select').value,
              'name': requireOrderValue('master_name', '食材名'),
              'supplierId': document.getElementById('master_supplier').value,
              'orderUnit': document.getElementById('master_order_unit').value,
              'productCode': document.getElementById('master_product_code').value,
              'active': document.getElementById('master_active').checked
            };
          }
        });
      }

      /**
       * 設定をサーバーへ保存し、成功したら最新の発注管理情報で画面を作り直す
       * 保存中はボタンを押せなくし、失敗したときは入力を残したままエラーだけを出す
       * ダイアログは続けて編集できるよう開いたままにする
       * @param {Object} config 保存するボタン・入力内容・呼び出すGAS関数
       * @return {void} 戻り値なし
       */
      function runOrderSettingSave(config) {
        const submitBtn = document.getElementById(config.submitBtnId);
        const errorEl = document.getElementById(config.errorId);
        if (submitBtn.disabled) {
          return; // 保存中の連打は無視する
        }
        errorEl.textContent = '';

        let payload;
        try {
          payload = config.buildPayload();
        } catch (error) {
          errorEl.textContent = error.message;
          return;
        }
        payload.operationKey = orderSettingKeys[config.keyName];
        // 店長専用の保存なので、サーバー側で権限を確認できるようトークンを添える
        payload.authToken = authToken;

        const originalLabel = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = '保存中...';

        const sessionId = loginSessionId;
        const runner = google.script.run
          .withSuccessHandler(function (result) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            submitBtn.disabled = false;
            submitBtn.textContent = originalLabel;
            orderSettingKeys[config.keyName] = createIngredientOperationKey();
            applyOrderBoard(result.board);
            refreshOrderSettingSelects();
            showOrderMessage(result.message, false);
          })
          .withFailureHandler(function (error) {
            if (!isSameLoginSession(sessionId)) {
              return;
            }
            submitBtn.disabled = false;
            submitBtn.textContent = originalLabel;
            // 保存できていないので成功の表示はせず、入力内容はそのまま残す
            errorEl.textContent = 'エラー: ' + error.message;
          });
        runner[config.method](payload);
      }
    </script>
