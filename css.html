<style>
  body {
    margin: 0;
    padding: 30px;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    color: #333;
  }
  .app-header {
    position: relative;
    margin-bottom: 40px;
  }
  .app-title {
    font-size: 48px;
    text-align: center;
    margin: 0;
  }
  .header-btn {
    position: absolute;
    top: 0;
    right: 0;
  }
  .main-layout {
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  gap: 40px;
  align-items: start;
  }
  .employee-list {
    width: 280px;
  }
  .employee-list h3 {
    font-size: 20px;
    margin-bottom: 10px;
  }
  .employee-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .employee-list-header h3 {
    margin-bottom: 0;
  }
  .employee-list ul {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 590px;
    overflow-y: auto;
  }
  .employee-item {
    padding: 18px;
    font-size: 22px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    text-align: center;
    user-select: none;
  }
  .employee-item:hover,
  .manager-nav-item:hover {
    background-color: #f0f4fa;
  }
  .employee-item.selected,
  .manager-nav-item.selected {
    background-color: #3f6fd1;
    color: #fff;
    border-color: #3f6fd1;
  }
  .clock-panel {
  width: 400px;
  text-align: center;
  grid-column: 2;
  justify-self: center;
  }
  .selected-emp-name {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .current-time {
    font-size: 56px;
    font-weight: bold;
    margin-bottom: 40px;
    font-variant-numeric: tabular-nums;
  }
  .clock-buttons {
    display: flex;
    justify-content: center;
    gap: 30px;
  }
  .clock-btn {
    font-size: 32px;
    padding: 30px 50px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
  }
  .clock-in {
    background-color: #43a047;
  }
  .clock-in:hover {
    background-color: #388e3c;
  }
  .clock-out {
    background-color: #e53935;
  }
  .clock-out:hover {
    background-color: #d32f2f;
  }
  .break-buttons {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
  }
  .break-btn {
    font-size: 15px;
    padding: 8px 22px;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
    background-color: #f5f5f5;
    color: #555;
  }
  .break-btn:hover {
    background-color: #e8e8e8;
  }
  .break-btn:active {
    background-color: #dcdcdc;
  }
  #record_message {
    margin-top: 24px;
    font-size: 18px;
    min-height: 24px;
  }
  .add-employee-btn,
  .attendance-reload-btn,
  .header-btn {
    padding: 6px 20px;
    font-size: 20px;
    background-color: #e8e8e8;
    color: #444;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
  }
  .add-employee-btn:hover,
  .attendance-reload-btn:hover,
  .header-btn:hover {
    background-color: #dcdcdc;
  }
  .add-employee-btn:active,
  .attendance-reload-btn:active,
  .header-btn:active {
    background-color: #c8c8c8;
    transform: translateY(2px);
  }
  /* 店長画面 */
  .manager-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 40px;
    align-items: start;
  }
  .manager-sidebar {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .manager-nav-item {
    padding: 14px 18px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
  }
  .manager-heading {
    font-size: 28px;
    margin: 0;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-box {
    background-color: #fff;
    border-radius: 12px;
    padding: 30px;
    width: 360px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .modal-title {
    font-size: 22px;
    font-weight: bold;
  }
  .modal-close {
    font-size: 24px;
    line-height: 1;
    color: #888;
    cursor: pointer;
  }
  .modal-close:hover {
    color: #333;
  }
  .modal-label {
    display: block;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .modal-input {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .modal-error {
    min-height: 20px;
    margin-bottom: 6px;
    font-size: 14px;
    color: #e53935;
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .modal-cancel-btn {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #f0f0f0;
    color: #444;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
  }
  .modal-cancel-btn:hover {
    background-color: #e0e0e0;
  }
  .modal-submit-btn {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #3f6fd1;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .modal-submit-btn:hover {
    background-color: #35609c;
  }
  .modal-submit-btn:disabled {
    background-color: #9db3dc;
    cursor: not-allowed;
  }
  /* 店長画面：勤怠管理 */
  .manager-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 960px;
  }
  .attendance-reload-btn:disabled {
    color: #999;
    cursor: not-allowed;
  }
  .attendance-date {
    font-size: 18px;
    color: #666;
    margin-top: 12px;
  }
  .attendance-message {
    font-size: 18px;
    color: #666;
    margin-top: 16px;
    min-height: 24px;
  }
  .attendance-message.error {
    color: #e53935;
  }
  .attendance-table {
    width: 100%;
    max-width: 960px;
    border-collapse: collapse;
    margin-top: 4px;
  }
  .attendance-table th,
  .attendance-table td {
    border: 1px solid #ccc;
    padding: 12px 16px;
    font-size: 18px;
    text-align: left;
  }
  .attendance-table th {
    background-color: #f0f4fa;
  }
  /* 時刻と労働時間は桁を揃えて読みやすくする */
  .attendance-table td:not(:first-child) {
    font-variant-numeric: tabular-nums;
  }
  .attendance-table td.unrecorded {
    color: #e53935;
  }
  /* 店長画面：スキル管理 */
  .skill-table select {
    font-size: 16px;
    padding: 4px 8px;
  }
  /* 評価セルの中に評価（select）と更新日を縦に並べる。列を分けないことで横幅の増加を抑える */
  .skill-table td.skill-cell {
    text-align: center;
  }
  .skill-table .skill-updated-at {
    margin-top: 4px;
    font-size: 12px;
    color: #767676;
    white-space: nowrap;
  }
  .skill-save-btn {
    padding: 6px 16px;
    font-size: 15px;
    background-color: #3f6fd1;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .skill-save-btn:hover {
    background-color: #35609c;
  }
  .skill-save-btn:disabled {
    background-color: #9db3dc;
    cursor: not-allowed;
  }
  .skill-row-status {
    margin-left: 10px;
    font-size: 14px;
    color: #43a047;
  }
  .skill-row-status.error {
    color: #e53935;
  }
  /* 店長画面：ダッシュボード（本日の業務設定） */
  .today-work-block {
    margin-top: 30px;
  }
  .today-work-heading {
    font-size: 22px;
    margin: 0;
  }
  .today-work-date {
    font-size: 18px;
    color: #666;
    margin-top: 8px;
  }
  .today-work-table select {
    font-size: 16px;
    padding: 4px 8px;
  }
  .today-work-notices-input {
    box-sizing: border-box;
    width: 100%;
    min-width: 220px;
    font-family: inherit;
    font-size: 15px;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    resize: vertical;
  }
  .today-work-save-btn {
    padding: 6px 16px;
    font-size: 15px;
    background-color: #3f6fd1;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .today-work-save-btn:hover {
    background-color: #35609c;
  }
  .today-work-save-btn:disabled {
    background-color: #9db3dc;
    cursor: not-allowed;
  }
  .today-work-row-status {
    margin-left: 10px;
    font-size: 14px;
    color: #43a047;
  }
  .today-work-row-status.error {
    color: #e53935;
  }
  /* 従業員画面：本日の業務カード */
  .today-work-card {
    margin-top: 28px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 12px;
    text-align: left;
  }
  .today-work-card-heading {
    font-size: 18px;
    margin: 0 0 14px;
    text-align: center;
  }
  .today-work-label {
    font-size: 13px;
    color: #767676;
    margin-top: 12px;
  }
  .today-work-label:first-of-type {
    margin-top: 0;
  }
  .today-work-position {
    font-size: 20px;
    font-weight: bold;
    margin-top: 2px;
  }
  .today-work-notices-list {
    margin: 4px 0 0;
    padding-left: 20px;
    font-size: 16px;
  }
  .today-work-notices-list li {
    margin-bottom: 4px;
  }
  .today-work-no-notice,
  .today-work-empty {
    font-size: 15px;
    color: #767676;
    margin-top: 2px;
  }
  .today-work-warning {
    font-size: 15px;
    color: #e53935;
  }
</style>
